name: Nava notification native audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-notification-native-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install smali
        run: sudo apt-get update -qq && sudo apt-get install -y smali >/dev/null
      - name: Download and inspect latest APK
        shell: bash
        run: |
          set -euo pipefail
          : > notification-native-audit.txt
          mkdir -p /tmp/apk /tmp/smali
          gh release download v12.1.34 --repo "$GITHUB_REPOSITORY" --pattern Nava.apk --dir /tmp/apk
          unzip -p /tmp/apk/Nava.apk classes.dex > /tmp/classes.dex
          baksmali disassemble /tmp/classes.dex -o /tmp/smali
          echo '=== CERT/APK ===' >> notification-native-audit.txt
          sha256sum /tmp/apk/Nava.apk >> notification-native-audit.txt
          echo '=== NOTIFICATION FILES ===' >> notification-native-audit.txt
          grep -R -l -E 'NavaFirebaseMessagingService|POST_NOTIFICATIONS|nava_follower_releases_v2|createNotificationChannel|NotificationManager;->notify' /tmp/smali | sort >> notification-native-audit.txt || true
          echo '=== CHANNEL CONTEXT ===' >> notification-native-audit.txt
          grep -R -n -A35 -B20 'nava_follower_releases_v2' /tmp/smali >> notification-native-audit.txt || true
          echo '=== PERMISSION CONTEXT ===' >> notification-native-audit.txt
          grep -R -n -A30 -B20 'POST_NOTIFICATIONS' /tmp/smali >> notification-native-audit.txt || true
          echo '=== CREATE CHANNEL CONTEXT ===' >> notification-native-audit.txt
          grep -R -n -A45 -B25 'createNotificationChannel' /tmp/smali >> notification-native-audit.txt || true
          echo '=== NOTIFY CONTEXT ===' >> notification-native-audit.txt
          grep -R -n -A35 -B25 'NotificationManager;->notify' /tmp/smali >> notification-native-audit.txt || true
          echo '=== PUSH UA/JS MARKERS ===' >> notification-native-audit.txt
          unzip -p /tmp/apk/Nava.apk assets/nava_app_v11.js | grep -o -E "appVersion:'[0-9.]+'|nava_push_registered_v[0-9]+" | sort -u >> notification-native-audit.txt || true
      - name: Persist audit
        run: |
          git config user.name 'Nava Notification Audit Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add notification-native-audit.txt
          git commit -m 'Record Android notification native audit [skip ci]' || true
          git push || true
