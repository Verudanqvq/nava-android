name: Nava follower notifications shard 3

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nava-follower-notifications-shard-3-v9
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: notification-backend
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      NAVA_TRIGGER: shard3-${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --omit=dev --no-audit --no-fund
      - shell: bash
        run: |
          set -uo pipefail
          npm run scan
          scan_rc=$?
          node retry-push.mjs
          push_rc=$?
          if [ "$scan_rc" -ne 0 ]; then exit "$scan_rc"; fi
          exit "$push_rc"
