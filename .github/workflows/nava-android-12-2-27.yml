name: Nava Android 12.2.27 Storage telemetry release
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-android-12-2-27.yml"
      - ".github/scripts/nava-12.2.27-final.sh"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nava-android-12-2-27-v5
  cancel-in-progress: true
jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build, sign, and verify candidate APK
        run: bash .github/scripts/nava-12.2.27-final.sh
      - name: Fast static validation of storage fix
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose /tmp/Nava.apk
          "$BUILD_TOOLS/aapt" dump badging /tmp/Nava.apk | grep -q "versionName='12.2.27'"
          unzip -p /tmp/Nava.apk assets/offline.html | grep -q 'storageAvailableBytes'
          unzip -p /tmp/Nava.apk assets/offline.html | grep -q 'storageTotalBytes'
          unzip -p /tmp/Nava.apk assets/nava_app_v11.js | grep -q 'storageAvailableBytes'
          unzip -p /tmp/Nava.apk assets/nava_app_v11.js | grep -q 'storageTotalBytes'
          unzip -p /tmp/Nava.apk classes2.dex > /tmp/final-classes2.dex
          test -s /tmp/final-classes2.dex
          sha256sum /tmp/Nava.apk
          echo "FAST_STATIC_VALIDATION_OK"
      - name: Publish verified signed APK
        run: |
          NOTES="Android StatFs ile cihazın toplam ve boş depolaması okunur; çevrimdışı ve profil ayarları gerçek depolama değerlerini gösterir. İndirme sınırı ortak yerel ayardan saklanır ve tam GB olarak boş alanla sınırlandırılır. İmzalama, sertifika, manifest ve depolama varlıkları yayından önce doğrulandı."
          if gh release view v12.2.27 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v12.2.27 /tmp/Nava.apk#Nava.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit v12.2.27 --repo "$GITHUB_REPOSITORY" --title "Nava 12.2.27" --notes "$NOTES" --latest
          else
            gh release create v12.2.27 /tmp/Nava.apk#Nava.apk --repo "$GITHUB_REPOSITORY" --title "Nava 12.2.27" --notes "$NOTES" --latest --target "$GITHUB_SHA"
          fi
          sha256sum /tmp/Nava.apk
          echo "Published v12.2.27 after static APK verification."
      - name: Upload candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nava-12.2.27-static-validation
          path: |
            /tmp/Nava.apk
            /tmp/verify223.txt
            /tmp/final-badging.txt
          if-no-files-found: ignore
