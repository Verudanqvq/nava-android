name: Nava native offline audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-native-offline-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        run: |
          mkdir -p /tmp/nava
          gh release download v12.1.29 --repo "$GITHUB_REPOSITORY" --pattern Nava.apk --dir /tmp/nava
      - name: Decode APK
        shell: bash
        run: |
          set -e
          VER=$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | python -c "import sys,json; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          curl -fsSL -o /tmp/apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/v${VER}/apktool_${VER}.jar"
          java -jar /tmp/apktool.jar d -f -r /tmp/nava/Nava.apk -o /tmp/apk >/tmp/apktool.log 2>&1
      - name: Capture patch points
        shell: bash
        run: |
          {
            echo '=== GX SMALI ==='
            GX=$(find /tmp/apk -type f -name 'gx.smali' | head -1); echo "$GX"; test -n "$GX" && cat "$GX"
            echo
            echo '=== CH0 MESSAGE AREA ==='
            CH=$(find /tmp/apk -type f -name 'ch0.smali' | head -1); echo "$CH"; test -n "$CH" && grep -a -n -B 55 -A 145 'pushTokenRequest' "$CH" || true
            echo
            echo '=== BACK CALLBACKS ==='
            for f in $(find /tmp/apk -type f \( -name 'dd.smali' -o -name 'o7.smali' -o -name 'cp.smali' \)); do echo "--- $f"; grep -a -n -B 30 -A 80 'onBackPressed\|goBack\|goBackOrForward\|evaluateJavascript' "$f" || true; done
            echo
            echo '=== MAINACTIVITY BACK/CACHE AREA ==='
            MA=$(find /tmp/apk -type f -path '*/com/verudanava/nava/MainActivity.smali' | head -1); echo "$MA"; test -n "$MA" && grep -a -n -E -B 18 -A 38 'setCacheMode|setWebViewClient|setDownloadListener|goBack|canGoBack|loadUrl|OnBackPressed' "$MA" | head -n 1500 || true
          } > /tmp/native-raw.txt
          iconv -f UTF-8 -t UTF-8 -c /tmp/native-raw.txt > native-offline-audit-utf8.txt
      - name: Persist
        shell: bash
        run: |
          git config user.name 'Nava Native Audit Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-offline-audit-utf8.txt
          git commit -m 'Update sanitized native offline patch points [skip ci]' || true
          git pull --rebase || true
          git push || true
