name: Nava Firestore rules

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "firestore-rules-test.mjs"
      - "notification-backend/direct-rules-deploy.mjs"
      - ".github/workflows/nava-firestore-direct-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nava-firestore-rules
  cancel-in-progress: true

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT: nava-01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test and Admin SDK tools
        run: |
          npm install --no-save firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
          npm --prefix notification-backend install --omit=dev --no-audit --no-fund
      - name: Emulator security tests
        run: |
          set -euo pipefail
          npx firebase emulators:exec --only firestore --project "$FIREBASE_PROJECT" "node firestore-rules-test.mjs" | tee /tmp/rules-test.log
          grep -q 'RULES_TEST_OK' /tmp/rules-test.log
      - name: Deploy tested rules through Firebase Admin SDK
        run: |
          set -euo pipefail
          node notification-backend/direct-rules-deploy.mjs | tee /tmp/direct-rules.log
          grep -q 'FIRESTORE_RULES_DIRECT_DEPLOY_OK' /tmp/direct-rules.log
