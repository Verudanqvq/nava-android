name: Nava lightweight quality checks

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'tests/release-metadata.test.js'
      - '.github/workflows/nava-quality-tests.yml'
      - '.github/workflows/nava-android-12-1-91.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nava-quality-tests
  cancel-in-progress: true

jobs:
  metadata-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release metadata and retired publishing workflow
        run: node --test tests/release-metadata.test.js
