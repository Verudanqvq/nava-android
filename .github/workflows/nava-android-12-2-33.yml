name: Nava Android 12.2.33 profile redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/nava-12.2.33-profile-redesign.sh'
      - '.github/workflows/nava-android-12-2-33.yml'
      - 'android-patch/profile-redesign-v12.2.33.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nava-android-12-2-33-release
  cancel-in-progress: true

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build profile redesign APK
        run: bash .github/scripts/nava-12.2.33-profile-redesign.sh
      - name: Verify metadata and production signature
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose /tmp/Nava.apk
          "$BUILD_TOOLS/aapt" dump badging /tmp/Nava.apk | tee /tmp/badging233.txt
          grep -q "versionCode='184'.*versionName='12.2.33'" /tmp/badging233.txt
          grep -q 'status=success' /tmp/status233.txt
          unzip -p /tmp/Nava.apk assets/nava_app_v11.js | grep -q 'nava-profile-redesign-12233'
      - name: Publish v12.2.33 as requested
        run: |
          gh release create v12.2.33 /tmp/Nava.apk#Nava.apk --repo "$GITHUB_REPOSITORY" --title 'Nava 12.2.33 — Profil yenilemesi' --notes 'Profil sayfası modernize edildi. Mevcut avatar, üyelik, favoriler, bildirimler ve okuma listesi sistemleri korunur. Karışıklık yaratan eserler sekmesi Okuma listem olarak adlandırıldı. Üretim imzası ve Android emülatör açılışı doğrulandı.' --latest --target "$GITHUB_SHA"
          sha256sum /tmp/Nava.apk
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nava-12.2.33-profile-validation
          path: |
            /tmp/Nava.apk
            /tmp/verify233.txt
            /tmp/badging233.txt
            /tmp/status233.txt
            /tmp/logcat233.txt
          if-no-files-found: ignore
