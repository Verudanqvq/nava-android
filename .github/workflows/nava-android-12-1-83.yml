name: Nava Android 12.1.83 reference-led redesign
on:
  push:
    branches: [main]
    paths:
      - 'android-patch/v12.1.83/**'
      - '.github/scripts/nava-12.1.83-final.sh'
      - '.github/workflows/nava-android-12-1-83.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nava-android-12-1-83-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, verify and publish signed APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: bash .github/scripts/nava-12.1.83-final.sh
