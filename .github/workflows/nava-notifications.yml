name: Nava follower notifications minute 0

on:
  push:
    branches: [main]
    paths:
      - "notification-backend/**"
      - ".github/workflows/nava-notifications.yml"
  schedule:
    - cron: "0-55/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nava-follower-notifications-minute-0-v9
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: notification-backend
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      NAVA_TRIGGER: minute0-${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --omit=dev --no-audit --no-fund
      - if: github.event_name != 'schedule'
        run: npm test
      - shell: bash
        run: |
          set -uo pipefail
          npm run scan
          scan_rc=$?
          node retry-push.mjs
          push_rc=$?
          if [ "$scan_rc" -ne 0 ]; then exit "$scan_rc"; fi
          exit "$push_rc"
