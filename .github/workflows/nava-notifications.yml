name: Nava follower notifications

on:
  push:
    branches: [main]
    paths:
      - "notification-backend/**"
      - ".github/workflows/nava-notifications.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nava-follower-notifications-v5
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: notification-backend
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend
        run: npm install --omit=dev --no-audit --no-fund

      - name: Test notification engine
        run: npm test

      - name: Watch Blogger continuously for five passes
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ../nava-diagnostics
          : > ../nava-diagnostics/latest.log
          echo "run_started=$(date -u +%FT%TZ)" | tee -a ../nava-diagnostics/latest.log
          echo "event=${GITHUB_EVENT_NAME}" | tee -a ../nava-diagnostics/latest.log
          echo "sha=${GITHUB_SHA}" | tee -a ../nava-diagnostics/latest.log

          final_rc=0
          for pass in 1 2 3 4 5; do
            echo "===== NAVA PASS $pass/5 =====" | tee -a ../nava-diagnostics/latest.log

            npm run scan 2>&1 | tee -a ../nava-diagnostics/latest.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then final_rc=$rc; fi

            echo "===== PUSH RETRY $pass/5 =====" | tee -a ../nava-diagnostics/latest.log
            node retry-push.mjs 2>&1 | tee -a ../nava-diagnostics/latest.log
            push_rc=${PIPESTATUS[0]}
            if [ "$push_rc" -ne 0 ]; then final_rc=$push_rc; fi

            if [ "$pass" = "5" ]; then
              echo "===== LIVE FEED/STATE DIAG =====" | tee -a ../nava-diagnostics/latest.log
              node diagnose.mjs 2>&1 | tee -a ../nava-diagnostics/latest.log
              diag_rc=${PIPESTATUS[0]}
              if [ "$diag_rc" -ne 0 ]; then final_rc=$diag_rc; fi
            else
              sleep 60
            fi
          done

          echo "run_finished=$(date -u +%FT%TZ)" | tee -a ../nava-diagnostics/latest.log
          echo "exit_code=$final_rc" | tee -a ../nava-diagnostics/latest.log
          exit $final_rc

      - name: Persist live diagnostics
        if: always()
        shell: bash
        run: |
          cd ..
          test -f nava-diagnostics/latest.log || {
            mkdir -p nava-diagnostics
            printf 'workflow_failed_before_scan\nrun_finished=%s\n' "$(date -u +%FT%TZ)" > nava-diagnostics/latest.log
          }
          git config user.name "Nava Diagnostics Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nava-diagnostics/latest.log
          if ! git diff --cached --quiet; then
            git commit -m "Update Nava notification diagnostics [skip ci]"
            git push
          fi
