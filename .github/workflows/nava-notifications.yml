name: Nava follower notifications

on:
  push:
    branches: [main]
    paths:
      - "notification-backend/**"
      - ".github/workflows/nava-notifications.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nava-follower-notifications-primary-v8
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    defaults:
      run:
        working-directory: notification-backend
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      NAVA_TRIGGER: ${{ github.event_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend
        run: npm install --omit=dev --no-audit --no-fund

      - name: Test notification engine on code changes
        if: github.event_name != 'schedule'
        run: npm test

      - name: Capture state before push scan
        if: github.event_name != 'schedule'
        run: node diagnose.mjs before > ../notification-pipeline-diagnose.txt

      - name: Scan Blogger now
        shell: bash
        run: |
          set -uo pipefail
          echo "NAVA_TRIGGER=${NAVA_TRIGGER}"
          npm run scan
          scan_rc=$?
          node retry-push.mjs
          push_rc=$?
          if [ "$scan_rc" -ne 0 ]; then exit "$scan_rc"; fi
          exit "$push_rc"

      - name: Capture state after push scan
        if: always() && github.event_name != 'schedule'
        shell: bash
        run: |
          node diagnose.mjs after >> ../notification-pipeline-diagnose.txt 2>&1 || true

      - name: Persist push diagnosis
        if: always() && github.event_name != 'schedule'
        working-directory: .
        run: |
          git config user.name 'Nava Notification Diagnose Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add notification-pipeline-diagnose.txt
          git commit -m 'Record notification pipeline diagnosis [skip ci]' || true
          git push || true
