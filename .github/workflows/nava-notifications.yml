name: Nava follower notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nava-follower-notifications-v4
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    defaults:
      run:
        working-directory: notification-backend
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend
        run: npm install --omit=dev --no-audit --no-fund

      - name: Test matcher
        run: npm test

      - name: Watch Blogger for 5 minutes
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3 4 5; do
            echo "===== NAVA PASS $pass/5 ====="
            npm run scan
            if [ "$pass" != "5" ]; then
              sleep 60
            fi
          done
