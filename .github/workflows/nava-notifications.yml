name: Nava follower notifications

on:
  push:
    branches: [main]
    paths:
      - "notification-backend/**"
      - ".github/workflows/nava-notifications.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nava-follower-notifications-v5
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: notification-backend
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend
        run: npm install --omit=dev --no-audit --no-fund

      - name: Test notification engine
        run: npm test

      - name: Watch Blogger for five passes
        shell: bash
        run: |
          set -uo pipefail
          final_rc=0

          for pass in 1 2 3 4 5; do
            echo "===== NAVA PASS $pass/5 ====="

            npm run scan
            rc=$?
            if [ "$rc" -ne 0 ]; then final_rc=$rc; fi

            node retry-push.mjs
            push_rc=$?
            if [ "$push_rc" -ne 0 ]; then final_rc=$push_rc; fi

            if [ "$pass" != "5" ]; then sleep 60; fi
          done

          exit $final_rc
