name: Nava Android 12.2.35 profile redesign fix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/nava-12.2.35-profile-redesign.sh'
      - '.github/workflows/nava-android-12-2-35.yml'
      - 'android-patch/profile-redesign-v12.2.33.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nava-android-12-2-35-release
  cancel-in-progress: true

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate injected JavaScript syntax
        run: |
          set -euo pipefail
          node --check android-patch/profile-redesign-v12.2.33.js
      - name: Build fixed profile redesign APK
        run: bash .github/scripts/nava-12.2.35-profile-redesign.sh
      - name: Verify metadata and production signature
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose /tmp/Nava.apk
          "$BUILD_TOOLS/aapt" dump badging /tmp/Nava.apk | tee /tmp/badging235.txt
          grep -q "versionCode='186'.*versionName='12.2.35'" /tmp/badging235.txt
          grep -q 'status=success' /tmp/status235.txt
          unzip -p /tmp/Nava.apk assets/nava_app_v11.js | grep -q 'nava-profile-redesign-12233'
      - name: Publish fixed profile redesign
        run: |
          gh release create v12.2.35 /tmp/Nava.apk#Nava.apk --repo "$GITHUB_REPOSITORY" --title 'Nava 12.2.35 — Profil tasarımı düzeltildi' --notes '12.2.33 sürümündeki JavaScript template literal sözdizimi hatası düzeltildi. Profil CSS tasarımı ve mevcut işlevler korunarak üretim imzası ve paket metadata kontrolleri doğrulandı. Emülatör testi bu derlemede çalıştırılmadı.' --latest --target "$GITHUB_SHA"
          sha256sum /tmp/Nava.apk
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nava-12.2.35-profile-validation
          path: |
            /tmp/Nava.apk
            /tmp/verify235.txt
            /tmp/badging235.txt
            /tmp/status235.txt
          if-no-files-found: ignore
