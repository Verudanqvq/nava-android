name: Nava signing bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-signing-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create protected signing transport key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          mkdir -p .github/nava-signing
          if [ -s .github/nava-signing/public.pem ] && [ -s .github/nava-signing/private.pem.enc ]; then
            echo "Signing transport key already exists."
            exit 0
          fi
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/nava-signing-private.pem
          openssl pkey -in /tmp/nava-signing-private.pem -pubout -out .github/nava-signing/public.pem
          export NAVA_KDF_SECRET="$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | sha256sum | cut -d' ' -f1)"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
            -in /tmp/nava-signing-private.pem \
            -out .github/nava-signing/private.pem.enc \
            -pass env:NAVA_KDF_SECRET
          unset NAVA_KDF_SECRET
          rm -f /tmp/nava-signing-private.pem

      - name: Persist encrypted transport key
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nava Signing Bootstrap"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/nava-signing/public.pem .github/nava-signing/private.pem.enc
          if ! git diff --cached --quiet; then
            git commit -m "Initialize encrypted Nava signing transport [skip ci]"
            git push
          fi
