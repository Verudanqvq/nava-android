name: Nava Android 12.1.59 native diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-android-12-1-59-diagnostic.yml"
      - "android-patch/v12.1.59/diagnostic-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download 12.1.58 APK
        run: |
          mkdir -p /tmp/apk
          gh release download v12.1.58 --repo "$GITHUB_REPOSITORY" --pattern Nava.apk --dir /tmp/apk
      - name: Install JADX
        run: |
          curl -fsSL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip
          mkdir -p /tmp/jadx-bin
          unzip -q /tmp/jadx.zip -d /tmp/jadx-bin
      - name: Decompile and inspect
        shell: bash
        run: |
          set -euo pipefail
          /tmp/jadx-bin/bin/jadx --show-bad-code -d /tmp/jadx-out /tmp/apk/Nava.apk >/tmp/jadx.log 2>&1 || true
          mkdir -p android-patch/v12.1.59/native-source
          cp /tmp/jadx-out/sources/com/verudanava/nava/MainActivity.java android-patch/v12.1.59/native-source/MainActivity.java.txt
          cp /tmp/jadx-out/sources/com/verudanava/nava/OfflineRuntime.java android-patch/v12.1.59/native-source/OfflineRuntime.java.txt
          cp /tmp/jadx-out/sources/defpackage/gx.java android-patch/v12.1.59/native-source/gx.java.txt
          OUT=android-patch/v12.1.59/native-diagnostic.txt
          : > "$OUT"
          printf '=== MATCHED FILES ===\n' >> "$OUT"
          grep -RIl -E 'downloadBatch|JavascriptInterface|NavaOffline|WebViewClient|onReceivedError|onPageFinished|loadUrl\(|offline|ConnectivityManager|DownloadManager' /tmp/jadx-out/sources 2>/dev/null | head -80 | tee -a "$OUT"
          printf '\n=== DEX STRINGS ===\n' >> "$OUT"
          unzip -p /tmp/apk/Nava.apk classes.dex classes2.dex 2>/dev/null | strings | grep -E 'NavaOffline|downloadBatch|cancel|WebView|offline|verudanava|onReceivedError|Connectivity' | head -500 >> "$OUT" || true
      - name: Compile patched OfflineRuntime and capture log
        shell: bash
        run: |
          set +e
          LOG=android-patch/v12.1.59/native-compile-log.txt
          : > "$LOG"
          python android-patch/v12.1.59/patch-offline-runtime.py \
            android-patch/v12.1.59/native-source/OfflineRuntime.java.txt \
            /tmp/OfflineRuntime.java >>"$LOG" 2>&1
          RC1=$?
          ANDROID_JAR="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          mkdir -p /tmp/javac
          if [ "$RC1" -eq 0 ]; then
            javac -encoding UTF-8 -source 8 -target 8 -cp "$ANDROID_JAR" -d /tmp/javac /tmp/OfflineRuntime.java >>"$LOG" 2>&1
            RC2=$?
          else
            RC2=99
          fi
          printf '\nPATCH_RC=%s JAVAC_RC=%s\n' "$RC1" "$RC2" >> "$LOG"
          cat "$LOG"
          exit 0
      - name: Persist diagnostics
        run: |
          git config user.name 'Nava Android Diagnostic Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add android-patch/v12.1.59/native-diagnostic.txt android-patch/v12.1.59/native-source android-patch/v12.1.59/native-compile-log.txt
          git commit -m 'Record 12.1.59 native compile diagnostics [skip ci]' || true
          git push || true
