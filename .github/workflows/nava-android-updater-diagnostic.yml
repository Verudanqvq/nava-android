name: Nava Android updater diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-android-updater-diagnostic.yml"
      - "diagnostics/updater-diagnostic-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download current APK
        run: |
          mkdir -p /tmp/apk
          gh release download v12.1.59 --repo "$GITHUB_REPOSITORY" --pattern Nava.apk --dir /tmp/apk
      - name: Install JADX and Apktool
        run: |
          curl -fsSL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip
          mkdir -p /tmp/jadx-bin
          unzip -q /tmp/jadx.zip -d /tmp/jadx-bin
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
      - name: Inspect updater
        shell: bash
        run: |
          set -euo pipefail
          /tmp/jadx-bin/bin/jadx --show-bad-code -d /tmp/jadx-out /tmp/apk/Nava.apk >/tmp/jadx.log 2>&1 || true
          java -jar /tmp/apktool.jar d -f -r /tmp/apk/Nava.apk -o /tmp/apktool-out >/tmp/apktool.log 2>&1
          mkdir -p diagnostics/updater-source diagnostics/updater-smali
          OUT=diagnostics/nava-updater-diagnostic.txt
          : > "$OUT"
          printf '=== MATCHED UPDATER FILES ===\n' >> "$OUT"
          grep -RIl -E 'releases/latest|Nava\.apk|DownloadManager|canRequestPackageInstalls|REQUEST_INSTALL_PACKAGES|PackageInstaller|digest|update|güncelle|Güncelle' /tmp/jadx-out/sources 2>/dev/null | head -80 | tee -a "$OUT"
          printf '\n=== h00.java ===\n' >> "$OUT"
          if [ -f /tmp/jadx-out/sources/defpackage/h00.java ]; then cat /tmp/jadx-out/sources/defpackage/h00.java >> "$OUT"; fi
          printf '\n=== RELATED SOURCES ===\n' >> "$OUT"
          for n in e00 d00 s3 l1 g00 z5; do
            f="/tmp/jadx-out/sources/defpackage/${n}.java"
            if [ -f "$f" ]; then
              cp "$f" "diagnostics/updater-source/${n}.java.txt"
              printf '\n----- %s -----\n' "$f" >> "$OUT"
              cat "$f" >> "$OUT"
            fi
          done
          cp /tmp/jadx-out/sources/defpackage/h00.java diagnostics/updater-source/h00.java.txt
          for n in e00 h00 d00 s3 z5; do
            f="$(find /tmp/apktool-out -path "*/defpackage/${n}.smali" | head -1)"
            if [ -n "$f" ] && [ -f "$f" ]; then cp "$f" "diagnostics/updater-smali/${n}.smali.txt"; fi
          done
          CALL=diagnostics/updater-e00-callsite.txt
          : > "$CALL"
          printf '=== e00 references in decoded smali ===\n' >> "$CALL"
          grep -R -n -C 12 'Ldefpackage/e00;' /tmp/apktool-out 2>/dev/null >> "$CALL" || true
          printf '\n=== Güncelle positive-button references ===\n' >> "$CALL"
          grep -R -n -C 14 'Güncelle' /tmp/apktool-out 2>/dev/null | head -300 >> "$CALL" || true
          printf '\n=== DEX STRINGS ===\n' >> "$OUT"
          unzip -p /tmp/apk/Nava.apk classes.dex | strings | grep -Ei 'release|Nava\.apk|download|update|digest|install|github|güncelle' | head -500 >> "$OUT" || true
      - name: Persist updater diagnostic
        run: |
          git config user.name 'Nava Android Diagnostic Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add diagnostics/nava-updater-diagnostic.txt diagnostics/updater-source diagnostics/updater-smali diagnostics/updater-e00-callsite.txt
          git commit -m 'Record updater callsite diagnostics [skip ci]' || true
          git push || true
