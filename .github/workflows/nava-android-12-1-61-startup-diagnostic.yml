name: Nava Android 12.1.61 startup diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-android-12-1-61-startup-diagnostic.yml"
      - "diagnostics/nava-12.1.61-startup-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download signed 12.1.60 APK
        run: |
          mkdir -p /tmp/apk
          gh release download v12.1.60 --repo "$GITHUB_REPOSITORY" --pattern Nava.apk --dir /tmp/apk
      - name: Install JADX and Apktool
        run: |
          curl -fsSL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip
          mkdir -p /tmp/jadx-bin
          unzip -q /tmp/jadx.zip -d /tmp/jadx-bin
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
      - name: Inspect startup, theme and notification shell
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jadx-out /tmp/apktool-out diagnostics/startup61
          mkdir -p diagnostics/startup61
          /tmp/jadx-bin/bin/jadx --show-bad-code -d /tmp/jadx-out /tmp/apk/Nava.apk >/tmp/jadx61.log 2>&1 || true
          java -jar /tmp/apktool.jar d -f /tmp/apk/Nava.apk -o /tmp/apktool-out >/tmp/apktool61.log 2>&1
          cp /tmp/jadx-out/sources/com/verudanava/nava/MainActivity.java diagnostics/startup61/MainActivity.java.txt
          cp /tmp/jadx-out/sources/defpackage/gx.java diagnostics/startup61/gx.java.txt
          cp /tmp/jadx-out/sources/defpackage/fx.java diagnostics/startup61/fx.java.txt
          cp /tmp/apktool-out/AndroidManifest.xml diagnostics/startup61/AndroidManifest.xml.txt
          cp /tmp/apktool-out/res/layout/activity_main.xml diagnostics/startup61/activity_main.xml.txt
          find /tmp/apktool-out/res/values* -maxdepth 1 -type f \( -name 'styles.xml' -o -name 'themes.xml' -o -name 'colors.xml' \) -print | sort > diagnostics/startup61/value-files.txt
          : > diagnostics/startup61/theme-values.txt
          while IFS= read -r f; do printf '\n===== %s =====\n' "$f" >> diagnostics/startup61/theme-values.txt; cat "$f" >> diagnostics/startup61/theme-values.txt; done < diagnostics/startup61/value-files.txt
          : > diagnostics/startup61/startup-smali.txt
          MAIN_SMALI="$(find /tmp/apktool-out -type f -path '*/com/verudanava/nava/MainActivity.smali' | head -1)"
          GX_SMALI="$(find /tmp/apktool-out -type f -name 'gx.smali' | head -1)"
          FX_SMALI="$(find /tmp/apktool-out -type f -name 'fx.smali' | head -1)"
          printf 'MAIN_SMALI=%s\nGX_SMALI=%s\nFX_SMALI=%s\n\n' "$MAIN_SMALI" "$GX_SMALI" "$FX_SMALI" >> diagnostics/startup61/startup-smali.txt
          for f in "$MAIN_SMALI" "$GX_SMALI" "$FX_SMALI"; do
            printf '\n===== %s =====\n' "$f" >> diagnostics/startup61/startup-smali.txt
            grep -n -E 'setContentView|setBackgroundColor|loadUrl|setWebViewClient|onPageStarted|onPageFinished|onReceivedError|offline.html|WebView|pageProgress|setVisibility|setProgress' "$f" >> diagnostics/startup61/startup-smali.txt || true
          done
          cp /tmp/apktool-out/assets/nava_app_v11.js diagnostics/startup61/nava_app_v11.js.txt
          cp /tmp/apktool-out/assets/nava_app_v11.css diagnostics/startup61/nava_app_v11.css.txt
          cp /tmp/apktool-out/assets/offline.html diagnostics/startup61/offline.html.txt
          grep -n -E 'nava-notification-panel|nava-notification-head|notification-head-actions|nava-app-bell|notification-list' /tmp/apktool-out/assets/nava_app_v11.js | head -160 > diagnostics/startup61/notification-selectors.txt || true
          grep -n -E 'nava-notification-panel|nava-notification-head|notification-head-actions|nava-app-bell' /tmp/apktool-out/assets/nava_app_v11.css | head -160 > diagnostics/startup61/notification-css-selectors.txt || true
      - name: Persist startup diagnostics
        run: |
          git config user.name 'Nava Android Diagnostic Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add diagnostics/startup61
          git commit -m 'Record Android 12.1.61 startup diagnostics [skip ci]' || true
          git push || true
