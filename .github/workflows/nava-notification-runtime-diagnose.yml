name: Nava notification runtime diagnose
# run: current-notification-test-2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-notification-runtime-diagnose.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend
        working-directory: notification-backend
        run: npm install --omit=dev --no-audit --no-fund
      - name: Run scanner and retry
        working-directory: notification-backend
        shell: bash
        run: |
          set +e
          : > ../notification-runtime-status.txt
          echo "checkedAt=$(date -u +%FT%TZ)" >> ../notification-runtime-status.txt
          echo '=== SCAN ===' >> ../notification-runtime-status.txt
          npm run scan >> ../notification-runtime-status.txt 2>&1
          echo "scan_rc=$?" >> ../notification-runtime-status.txt
          echo '=== RETRY ===' >> ../notification-runtime-status.txt
          node retry-push.mjs >> ../notification-runtime-status.txt 2>&1
          echo "retry_rc=$?" >> ../notification-runtime-status.txt
      - name: Inspect Firestore notification state
        working-directory: notification-backend
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> ../notification-runtime-status.txt 2>&1
          import { initializeApp, cert } from 'firebase-admin/app';
          import { getFirestore } from 'firebase-admin/firestore';
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}');
          const app=initializeApp({credential:cert(sa),projectId:'nava-01'},'diag');
          const db=getFirestore(app);
          const ms=v=>{try{return v&&typeof v.toMillis==='function'?v.toMillis():0}catch{return 0}};
          console.log('=== TOKENS ===');
          const ts=await db.collection('devicePushTokens').get();
          const tokens=ts.docs.map(d=>({id:d.id,uid:d.data().uid||'',platform:d.data().platform||'',appVersion:d.data().appVersion||'',updatedAt:ms(d.data().updatedAt)}));
          console.log(JSON.stringify({count:tokens.length,tokens:tokens.map(x=>({...x,id:x.id.slice(0,18)+'…',uid:x.uid.slice(0,8)+'…'}))}));
          console.log('=== RECENT RELEASES ===');
          const rs=await db.collection('chapterReleases').limit(300).get();
          const releases=rs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(ms(b.completedAt)||ms(b.updatedAt)||0)-(ms(a.completedAt)||ms(a.updatedAt)||0)).slice(0,12).map(r=>({id:r.id,title:r.title||'',seriesTitle:r.seriesTitle||'',status:r.status||'',updatedAt:ms(r.updatedAt),completedAt:ms(r.completedAt),followers:r.followerCount??null,siteNotifications:r.sentCount??null,pushSuccess:r.pushLastSuccessCount??null,pushFailed:r.pushLastFailureCount??null,pushTokens:r.pushLastTokenCount??null,pushPending:r.pushPendingTokenCount??null,deliveredTokenDocs:Array.isArray(r.pushDeliveredTokenDocs)?r.pushDeliveredTokenDocs.length:0,url:r.url||''}));
          console.log(JSON.stringify(releases,null,2));
          console.log('=== ENGINE ===');
          const es=await db.collection('releaseAutomation').doc('bloggerScannerGithubV5').get();
          console.log(JSON.stringify(es.exists?es.data():null));
          NODE
      - name: Persist diagnostic report
        if: always()
        run: |
          git config user.name 'Nava Notification Diagnose Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add notification-runtime-status.txt
          git commit -m 'Record notification runtime diagnosis [skip ci]' || true
          git push || true
