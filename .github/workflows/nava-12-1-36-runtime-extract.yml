name: Nava 12.1.36 notification runtime extract
# trigger: runtime-2

on:
  push:
    branches: [main]
    paths: [".github/workflows/nava-12-1-36-runtime-extract.yml"]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y smali >/dev/null
      - name: Download and inspect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/apk /tmp/smali
          gh release download v12.1.36 --repo "$GITHUB_REPOSITORY" --pattern Nava.apk --dir /tmp/apk
          unzip -p /tmp/apk/Nava.apk assets/nava_app_v11.js > /tmp/app.js
          unzip -p /tmp/apk/Nava.apk classes.dex > /tmp/classes.dex
          baksmali disassemble /tmp/classes.dex -o /tmp/smali
          OUT=notification-runtime-extract-12.1.36.txt
          : > "$OUT"
          echo '=== APK ===' >> "$OUT"
          sha256sum /tmp/apk/Nava.apk >> "$OUT"
          echo '=== APP JS NOTIFICATION MATCHES ===' >> "$OUT"
          grep -n -i -E 'notification|bildirim|bell|nava-app-notif|onSnapshot' /tmp/app.js | head -260 >> "$OUT" || true
          echo '=== APP JS CONTEXT AROUND NOTIFICATION SHEET ===' >> "$OUT"
          python - <<'PY' >> "$OUT"
          from pathlib import Path
          s=Path('/tmp/app.js').read_text(errors='replace').splitlines()
          hits=[i for i,l in enumerate(s) if any(x in l.lower() for x in ['notification','bildirim','nava-app-notif'])]
          seen=set()
          for i in hits[:40]:
              a=max(0,i-8); b=min(len(s),i+20)
              key=(a,b)
              if key in seen: continue
              seen.add(key)
              print(f'--- lines {a+1}-{b} ---')
              for j in range(a,b): print(f'{j+1}: {s[j]}')
          PY
          echo '=== FCM SERVICE NOTIFY/CHANNEL/PERMISSION ===' >> "$OUT"
          F=/tmp/smali/com/verudanava/nava/NavaFirebaseMessagingService.smali
          grep -n -B18 -A36 -E 'NotificationManager;->notify|POST_NOTIFICATIONS|nava_follower_releases|onMessageReceived' "$F" >> "$OUT" || true
          echo '=== MAIN ACTIVITY NOTIFICATION REPAIR ===' >> "$OUT"
          M=/tmp/smali/com/verudanava/nava/MainActivity.smali
          grep -n -B16 -A28 -E 'NavaNotificationRepair|nava_notif_permission|POST_NOTIFICATIONS|Lc00;->a' "$M" >> "$OUT" || true
          echo '=== REPAIR CLASS ===' >> "$OUT"
          R=/tmp/smali/com/verudanava/nava/NavaNotificationRepair.smali
          cat "$R" >> "$OUT" || true
      - name: Persist
        run: |
          git config user.name 'Nava Runtime Inspect Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notification-runtime-extract-12.1.36.txt
          git commit -m 'Record Android notification runtime extract [skip ci]' || true
          git push
