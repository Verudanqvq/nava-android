name: Nava Firestore rules

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "firestore-rules-test.mjs"
      - ".github/workflows/nava-firestore-rules.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nava-firestore-rules
  cancel-in-progress: true

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT: nava-01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare status
        run: printf 'status=running\nstarted=%s\n' "$(date -u +%FT%TZ)" > /tmp/firestore-status.txt
      - name: Install Firebase test tools
        run: |
          npm install --no-save firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
          printf 'tools=ok\n' >> /tmp/firestore-status.txt
      - name: Test security rules in emulator
        run: |
          set -euo pipefail
          npx firebase emulators:exec --only firestore --project "$FIREBASE_PROJECT" "node firestore-rules-test.mjs" | tee /tmp/rules-test.log
          grep -q 'RULES_TEST_OK' /tmp/rules-test.log
          printf 'emulator_rules_test=ok\n' >> /tmp/firestore-status.txt
      - name: Prepare service account
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/firebase-sa.json'))
          assert p.get('project_id')=='nava-01'
          assert p.get('client_email') and p.get('private_key')
          print('service_account=ok')
          PY
          chmod 600 /tmp/firebase-sa.json
          printf 'service_account=ok\n' >> /tmp/firestore-status.txt
      - name: Deploy Firestore rules to nava-01
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
        run: |
          set -euo pipefail
          npx firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT" --non-interactive | tee /tmp/deploy.log
          grep -Eqi 'Deploy complete|released rules|firestore.*rules' /tmp/deploy.log
          printf 'deploy=ok\nproject=nava-01\n' >> /tmp/firestore-status.txt
      - name: Persist status
        if: always()
        run: |
          if grep -q '^deploy=ok$' /tmp/firestore-status.txt 2>/dev/null; then S=success; else S=failed; fi
          printf 'status=%s\nfinished=%s\n' "$S" "$(date -u +%FT%TZ)" >> /tmp/firestore-status.txt
          cp /tmp/firestore-status.txt firestore-rules-status.txt
          git config user.name 'Nava Firestore Rules Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add firestore-rules-status.txt
          git commit -m 'Record Firestore rules deployment [skip ci]' || true
          git push || true
          rm -f /tmp/firebase-sa.json
