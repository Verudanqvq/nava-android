name: Nava 12.1.29 full audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-12-1-29-full-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        shell: bash
        run: |
          mkdir -p /tmp/nava
          gh release download v12.1.29 --repo "$GITHUB_REPOSITORY" --pattern Nava.apk --dir /tmp/nava
          unzip -p /tmp/nava/Nava.apk assets/nava_app_v11.js > /tmp/app.js
          unzip -p /tmp/nava/Nava.apk assets/nava_app_v11.css > /tmp/app.css
          unzip -p /tmp/nava/Nava.apk classes.dex > /tmp/classes.dex
      - name: Decompile
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/jadxdl /tmp/jadxout
          gh release download --repo skylot/jadx --pattern 'jadx-*.zip' --dir /tmp/jadxdl --clobber
          ZIP="$(find /tmp/jadxdl -name 'jadx-*.zip' | head -1)"
          unzip -q "$ZIP" -d /tmp/jadx
          JADX="$(find /tmp/jadx -type f -path '*/bin/jadx' | head -1)"
          chmod +x "$JADX"
          "$JADX" --no-res -d /tmp/jadxout /tmp/nava/Nava.apk >/tmp/jadx.log 2>&1 || true
      - name: Build audit report
        shell: bash
        run: |
          {
            echo '=== ASSET SIZES ==='
            wc -c -l /tmp/app.js /tmp/app.css
            echo
            echo '=== JS FEATURE MARKERS ==='
            grep -nEi 'markRead|markUnread|continue|kaldığım|okumaya devam|reader|chapter|volume|history\.|popstate|pageshow|visibilitychange|notification|profile|search|bottom|topbar|cache|localStorage|sessionStorage|IndexedDB|serviceWorker|offline|download' /tmp/app.js | head -n 900 || true
            echo
            echo '=== CSS COLLISION MARKERS ==='
            grep -nEi 'position:(fixed|absolute)|z-index|100vw|100vh|dvh|overflow|nava-profile|nava-search|notification|bottom|topbar|reader|modal' /tmp/app.css | head -n 900 || true
            echo
            echo '=== NATIVE WEBVIEW / OFFLINE HOOKS ==='
            grep -RInE 'shouldInterceptRequest|onReceivedError|onReceivedHttpError|WebResourceResponse|setCacheMode|LOAD_CACHE|setDomStorageEnabled|setDatabaseEnabled|setJavaScriptEnabled|setAllowFileAccess|setAllowContentAccess|setMixedContentMode|ServiceWorker|WebViewClient|goBack\(|canGoBack\(|onBackPressed|OnBackPressed|NavaNative|postMessage|pushTokenRequest|download|DownloadListener|setDownloadListener' /tmp/jadxout/sources/com/verudanava/nava /tmp/jadxout/sources/defpackage 2>/dev/null | head -n 1200 || true
            echo
            echo '=== MAINACTIVITY RELEVANT ==='
            F=/tmp/jadxout/sources/com/verudanava/nava/MainActivity.java
            test -f "$F" && grep -nEi 'WebView|onBack|goBack|canGoBack|loadUrl|setWebViewClient|setDownloadListener|NavaNative|postMessage|Cache|offline|permission' "$F" | head -n 700 || true
            echo
            echo '=== NAVA MESSAGE BRIDGE ==='
            for f in $(grep -RIl 'pushTokenRequest' /tmp/jadxout/sources 2>/dev/null | head -n 8); do echo "--- $f"; sed -n '1,360p' "$f"; done
            echo
            echo '=== MANIFEST PERMISSION STRINGS ==='
            strings -a /tmp/classes.dex | grep -Ei 'READ_EXTERNAL|WRITE_EXTERNAL|MANAGE_EXTERNAL|INTERNET|ACCESS_NETWORK|POST_NOTIFICATIONS|download|offline|cache' | sort -u | head -n 400 || true
            echo
            echo '=== APP JS READER CONTEXT ==='
            for pat in 'markRead' 'markUnread' 'nava-reader' 'continue' 'Okumaya Devam Et' 'history.back' 'popstate'; do
              echo "--- $pat";
              grep -n -m 12 -B 8 -A 18 "$pat" /tmp/app.js || true;
            done
          } > full-audit-12.1.29.txt
      - name: Persist
        shell: bash
        run: |
          git config user.name 'Nava Audit Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add full-audit-12.1.29.txt
          git commit -m 'Record Android 12.1.29 full audit [skip ci]' || true
          git push || true
