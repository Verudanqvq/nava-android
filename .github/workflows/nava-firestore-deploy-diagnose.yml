name: Nava Firestore deploy diagnose
# run: 2
on:
  push:
    branches: [main]
    paths: [".github/workflows/nava-firestore-deploy-diagnose.yml"]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT: nava-01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Diagnose deploy
        shell: bash
        run: |
          set +e
          set +x
          : > firestore-deploy-diagnose.txt
          npm install --no-save firebase-tools@14 >> firestore-deploy-diagnose.txt 2>&1
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          echo '=== firebase version ===' >> firestore-deploy-diagnose.txt
          npx firebase --version >> firestore-deploy-diagnose.txt 2>&1
          echo '=== deploy ===' >> firestore-deploy-diagnose.txt
          npx firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT" --non-interactive >> firestore-deploy-diagnose.txt 2>&1
          RC=$?
          echo "deploy_rc=$RC" >> firestore-deploy-diagnose.txt
          rm -f /tmp/firebase-sa.json
          exit 0
      - name: Persist diagnosis
        run: |
          git config user.name 'Nava Firestore Diagnose Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firestore-deploy-diagnose.txt
          git commit -m 'Record Firestore deploy diagnosis [skip ci]' || true
          git push
