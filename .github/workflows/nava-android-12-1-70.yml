name: Nava Android 12.1.70
on:
  push:
    branches: [main]
    paths:
      - 'android-patch/v12.1.70/**'
      - '.github/scripts/nava-12.1.70-final.sh'
      - '.github/workflows/nava-android-12-1-70.yml'
  workflow_dispatch:
concurrency:
  group: nava-android-12-1-70
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and release signed APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: bash .github/scripts/nava-12.1.70-final.sh
