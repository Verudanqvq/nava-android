name: Nava profile DOM diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nava-profile-dom-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-profile-dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect shipped profile asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v12.2.32 --repo "$GITHUB_REPOSITORY" --pattern Nava.apk --dir /tmp
          unzip -p /tmp/Nava.apk assets/nava_app_v11.js > /tmp/nava_app_v11.js
          echo '--- PROFILE MARKUP AND SELECTORS ---'
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('/tmp/nava_app_v11.js').read_text(errors='replace')
          for term in ['Profili Düzenle','Favori Eserler','Okumaya Devam Et','Kullanıcı Ara','nava-profile-app','nava-profile-hero','profile-screen','profileScreen','renderProfile']:
              print(f'\n### {term}: {s.find(term)}')
              i=s.find(term)
              if i>=0: print(s[max(0,i-450):min(len(s),i+850)].replace('\n',' ')[:1300])
          classes=sorted(set(re.findall(r'["\']([A-Za-z_][A-Za-z0-9_-]{2,})["\']',s)))
          print('\n### profile-related tokens')
          print('\n'.join(x for x in classes if 'profile' in x.lower() or 'user' in x.lower() or 'favor' in x.lower() or 'library' in x.lower())[:16000])
          PY