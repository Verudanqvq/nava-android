name: Nava Android patch diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-android-patch-debug.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose 12.1.24 to 12.1.25 patch
        shell: bash
        run: |
          set +e
          : > /tmp/debug.txt
          mkdir -p /tmp/apk
          gh release download v12.1.24 --repo "$GITHUB_REPOSITORY" --pattern Nava.apk --dir /tmp/apk >>/tmp/debug.txt 2>&1
          echo "download_rc=$?" >> /tmp/debug.txt
          python - <<'PY' >>/tmp/debug.txt 2>&1
          import zipfile
          p='/tmp/apk/Nava.apk'
          with zipfile.ZipFile(p) as z:
              js=z.read('assets/nava_app_v11.js').decode('utf-8','replace')
              print('has_v12124_marker=', '/* Nava v12.1.24 — reliable FREE push token bridge.' in js)
              print('has_v12122_marker=', '/* Nava v12.1.22 — FREE push token bridge.' in js)
              print('has_appversion_12124=', "appVersion:'12.1.24'" in js)
          PY
          python android-patch/patch-apk.py /tmp/apk/Nava.apk android-patch/push-block-v12.1.25.js /tmp/Nava-test.apk 41 >>/tmp/debug.txt 2>&1
          echo "patch_rc=$?" >> /tmp/debug.txt
          cat /tmp/debug.txt
      - name: Persist diagnostic
        if: always()
        shell: bash
        run: |
          cp /tmp/debug.txt android-patch-debug.txt
          git config user.name "Nava Android Debug Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-patch-debug.txt
          git commit -m "Update Android patch diagnostic [skip ci]" || exit 0
          git push
