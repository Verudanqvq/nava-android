name: Nava Android 12.1.47 repaired UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-android-12-1-47.yml"
      - "android-patch/v12.1.47/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nava-android-12-1-47
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CERT_SHA256: acde7cf216852448a8a8277fe4bf11eac183394e6b34a862b124e693d51d09fe
      EXPECTED_SOURCE_SHA256: 8b73d9066df2dfe16cb41a4048001a3a5bd0d66748d822c45b867ffa2c48e752
      SOURCE_TAG: v12.1.41
      TARGET_TAG: v12.1.47
    steps:
      - uses: actions/checkout@v4
      - name: Prepare status
        run: printf 'status=running\nstarted=%s\n' "$(date -u +%FT%TZ)" > /tmp/status.txt

      - name: Prepare and validate sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/v12147
          sed -e 's/12\.1\.42/12.1.47/g' -e 's/V12142/V12147/g' -e 's/v12142/v12147/g' android-patch/v12.1.42/push-block.js > /tmp/v12147/push-block.js
          sed -e 's/12\.1\.42/12.1.47/g' -e 's/V12142/V12147/g' -e 's/v12142/v12147/g' android-patch/v12.1.42/compat-fix.js > /tmp/v12147/compat-fix.js
          sed -e 's/12\.1\.42/12.1.47/g' android-patch/v12.1.42/patch-smali.py > /tmp/v12147/patch-smali.py
          python -m py_compile /tmp/v12147/patch-smali.py android-patch/v12.1.47/patch-apk.py
          node --check /tmp/v12147/push-block.js
          node --check /tmp/v12147/compat-fix.js
          node --check android-patch/v12.1.47/download-menu.js
          node --check android-patch/v12.1.47/offline-ui.js
          node --check android-patch/v12.1.47/language-filter.js
          python - <<'PY'
          from pathlib import Path
          t=Path('android-patch/v12.1.47/offline.html').read_text()
          assert 'data-series-delete' in t and 'data-volume-delete' in t
          assert 'İndirme sırası' not in t and 'Tüm ciltleri indir' not in t and 'Bu cildi tamamen indir' not in t
          start=t.index('<script>')+len('<script>'); end=t.rindex('</script>')
          Path('/tmp/offline-page.js').write_text(t[start:end])
          PY
          node --check /tmp/offline-page.js
          grep -q "NEW_CODE=63" android-patch/v12.1.47/patch-apk.py
          grep -q 'nava-download-top-v12147' android-patch/v12.1.47/download-menu.js
          grep -q 'nava-language-filter-v12147' android-patch/v12.1.47/language-filter.js
          grep -q 'grid-template-columns:36px minmax(0,1fr) 36px 36px' android-patch/v12.1.47/app-ui.css
          ! grep -q 'İndirme sırası' android-patch/v12.1.47/download-menu.js
          printf 'source_validation=ok\nfix=topbar+download-popover+flat-offline+language-filter\n' >> /tmp/status.txt

      - name: Install smali tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y smali >/dev/null
          printf 'smali_tools=ok\n' >> /tmp/status.txt

      - name: Recover signing material
        shell: bash
        run: |
          set -euo pipefail
          set +x
          export NAVA_KDF_SECRET="$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | sha256sum | cut -d' ' -f1)"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in .github/nava-signing/private.pem.enc -out /tmp/nava-private.pem -pass env:NAVA_KDF_SECRET
          unset NAVA_KDF_SECRET
          openssl pkeyutl -decrypt -inkey /tmp/nava-private.pem -in android-signing/key-material.enc -out /tmp/key-material.bin -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          python - <<'PY'
          from pathlib import Path
          d=Path('/tmp/key-material.bin').read_bytes(); assert len(d)==48
          Path('/tmp/aes-key').write_text(d[:32].hex()); Path('/tmp/aes-iv').write_text(d[32:].hex())
          PY
          openssl enc -d -aes-256-cbc -K "$(cat /tmp/aes-key)" -iv "$(cat /tmp/aes-iv)" -in android-signing/signing-payload.enc -out /tmp/signing.zip
          mkdir -p /tmp/nava-signing; unzip -q /tmp/signing.zip -d /tmp/nava-signing
          rm -f /tmp/nava-private.pem /tmp/key-material.bin /tmp/aes-key /tmp/aes-iv /tmp/signing.zip
          printf 'signing_material=ok\n' >> /tmp/status.txt

      - name: Download known-good 12.1.41
        run: |
          set -euo pipefail
          mkdir -p /tmp/current
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern Nava.apk --dir /tmp/current
          GOT="$(sha256sum /tmp/current/Nava.apk | cut -d' ' -f1)"
          test "$GOT" = "$EXPECTED_SOURCE_SHA256"
          printf 'source_apk=ok\nsource_sha256=%s\n' "$GOT" >> /tmp/status.txt

      - name: Patch native UA
        run: |
          set -euo pipefail
          mkdir -p /tmp/decoded/smali
          unzip -p /tmp/current/Nava.apk classes.dex > /tmp/base.dex
          baksmali disassemble /tmp/base.dex -o /tmp/decoded/smali
          python /tmp/v12147/patch-smali.py /tmp/decoded | tee /tmp/smali.txt
          grep -q 'SMALI_PATCH_OK ua=12.1.47' /tmp/smali.txt
          smali assemble /tmp/decoded/smali -o /tmp/classes.dex
          printf 'native_hooks=preserved\nua=12.1.47\n' >> /tmp/status.txt

      - name: Pack and validate APK
        run: |
          set -euo pipefail
          python android-patch/v12.1.47/patch-apk.py /tmp/current/Nava.apk /tmp/classes.dex /tmp/v12147/push-block.js android-patch/v12.1.47/offline-ui.js android-patch/v12.1.47/download-menu.js /tmp/v12147/compat-fix.js android-patch/v12.1.47/language-filter.js android-patch/v12.1.47/app-ui.css android-patch/v12.1.47/offline.html /tmp/Nava-unsigned.apk "$EXPECTED_SOURCE_SHA256" | tee /tmp/patch.txt
          grep -q 'PATCH_OK versionCode=63 versionName=12.1.47' /tmp/patch.txt
          unzip -p /tmp/Nava-unsigned.apk assets/nava_app_v11.js > /tmp/final.js
          unzip -p /tmp/Nava-unsigned.apk assets/nava_app_v11.css > /tmp/final.css
          unzip -p /tmp/Nava-unsigned.apk assets/offline.html > /tmp/final-offline.html
          node --check /tmp/final.js
          grep -q 'nava-download-top-v12147' /tmp/final.js
          grep -q 'nava-offline-browser-v12147' /tmp/final.js
          grep -q 'nava-language-filter-v12147' /tmp/final.js
          grep -q 'Tümü' /tmp/final.js && grep -q "'TR'" /tmp/final.js && grep -q "'JP'" /tmp/final.js
          grep -q 'repaired chrome, topbar download' /tmp/final.css
          grep -q '#nava-reader-top-v2' /tmp/final.css
          ! grep -q 'İndirme sırası' /tmp/final.js
          ! grep -q 'Bu cildi tamamen indir' /tmp/final.js
          ! grep -q 'Tüm ciltleri indir' /tmp/final.js
          printf 'pack=ok\njs=ok\ncss=ok\ntopbar=repaired\ndownload=topbar-popover\noffline=flat-tree\nlanguage=TR-EN-JP-KR-CN\nvolume_navigation=preserved\nscoped=ok\n' >> /tmp/status.txt

      - name: Align and sign
        shell: bash
        run: |
          set -euo pipefail
          set +x
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 /tmp/Nava-unsigned.apk /tmp/Nava-aligned.apk
          PROP=/tmp/nava-signing/keystore.properties
          export NAVA_STORE_PASS="$(sed -n 's/^storePassword=//p' "$PROP" | tr -d '\r' | head -1)"
          export NAVA_KEY_PASS="$(sed -n 's/^keyPassword=//p' "$PROP" | tr -d '\r' | head -1)"
          KEY_ALIAS="$(sed -n 's/^keyAlias=//p' "$PROP" | tr -d '\r' | head -1)"
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/nava-signing/signing/nava-release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:NAVA_STORE_PASS --key-pass env:NAVA_KEY_PASS --out /tmp/Nava.apk /tmp/Nava-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs /tmp/Nava.apk > /tmp/verify.txt
          CERT="$(grep -i -m1 'certificate SHA-256 digest:' /tmp/verify.txt | sed 's/.*digest:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$CERT" = "$EXPECTED_CERT_SHA256"
          printf 'zipalign=ok\nsigning=ok\ncert_sha256=%s\n' "$CERT" >> /tmp/status.txt
          sha256sum /tmp/Nava.apk | awk '{print "apk_sha256="$1}' >> /tmp/status.txt

      - name: Publish 12.1.47
        run: |
          set -euo pipefail
          NOTES='12.1.47 arayüz onarımı: indirme artık sayfa içine büyük blok eklemez ve ayrı floating düğme kullanmaz. İndirme ikonu normal uygulama üst barına, okuyucuda okuyucu üst barına yerleşir; yalnız küçük komut menüsü açar. İndirilenler tam ekran sade Eser → Cilt → Bölüm dosya ağacına dönüştürüldü. Dil filtresi Tümü / TR / EN / JP / KR / CN olarak Ana ve Keşfet ekranlarına eklendi. Cilt kartı gezinmesi, bildirim silme, native offline motoru ve stabil imza korunur.'
          gh release create "$TARGET_TAG" /tmp/Nava.apk#Nava.apk --repo "$GITHUB_REPOSITORY" --title 'Nava 12.1.47' --notes "$NOTES" --latest
          printf 'release=v12.1.47\nasset=Nava.apk\nstatus=success\nfinished=%s\n' "$(date -u +%FT%TZ)" >> /tmp/status.txt

      - name: Persist status
        if: always()
        run: |
          if ! grep -q '^status=success$' /tmp/status.txt 2>/dev/null; then printf 'status=failed\nfinished=%s\n' "$(date -u +%FT%TZ)" >> /tmp/status.txt; fi
          cp /tmp/status.txt android-build-status-12.1.47.txt
          git config user.name 'Nava Android Build Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add android-build-status-12.1.47.txt
          git commit -m 'Record Android 12.1.47 build [skip ci]' || true
          git push || true
