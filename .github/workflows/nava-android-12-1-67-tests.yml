name: Nava Android 12.1.67 test-first
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'android-patch/v12.1.67/**'
      - 'tests/v12167-*.test.js'
      - '.github/workflows/nava-android-12-1-67-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check android-patch/v12.1.67/library-core-v12167.js
          node --check android-patch/v12.1.67/language-core-v12167.js
          node --check tests/v12167-core.test.js
          node --check tests/v12167-live.test.js
      - name: Fixture regressions
        run: node tests/v12167-core.test.js
      - name: Download live Blogger feeds
        run: |
          curl --retry 3 --retry-all-errors -fsSL 'https://www.verudanava.com/feeds/posts/summary/-/Cilt?alt=json&max-results=500&orderby=published' -o /tmp/cilt.json
          curl --retry 3 --retry-all-errors -fsSL 'https://www.verudanava.com/feeds/posts/summary/-/B%C3%B6l%C3%BCm?alt=json&max-results=500&orderby=published' -o /tmp/bolum.json
      - name: Live relation and language contract
        run: node tests/v12167-live.test.js /tmp/cilt.json /tmp/bolum.json
