name: Nava notification verify

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-notification-verify.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend
        working-directory: notification-backend
        run: npm install --omit=dev --no-audit --no-fund
      - name: Read runtime state
        working-directory: notification-backend
        shell: bash
        run: |
          node --input-type=module <<'NODE' > ../nava-notification-verify.txt
          import { initializeApp, cert } from 'firebase-admin/app';
          import { getFirestore } from 'firebase-admin/firestore';
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}');
          initializeApp({credential:cert(sa),projectId:'nava-01'});
          const db=getFirestore();
          const fmt=v=>v&&typeof v.toDate==='function'?v.toDate().toISOString():null;
          console.log('checkedAt='+new Date().toISOString());
          const eng=await db.collection('releaseAutomation').doc('bloggerScannerGithubV5').get();
          if(eng.exists){const d=eng.data()||{};console.log('engine.updatedAt='+fmt(d.updatedAt));console.log('engine.lastResult='+JSON.stringify(d.lastResult||{}));}
          const posts=await db.collection('releaseAutomationPostsV5').orderBy('updatedAt','desc').limit(10).get();
          for(const x of posts.docs){const d=x.data()||{};console.log('post='+JSON.stringify({title:d.title||'',kind:d.kind||'',status:d.status||'',updatedAt:fmt(d.updatedAt),releaseId:d.releaseId||'',reason:d.reason||''}));}
          const rel=await db.collection('chapterReleases').orderBy('updatedAt','desc').limit(8).get();
          for(const x of rel.docs){const d=x.data()||{};console.log('release='+JSON.stringify({title:d.title||'',seriesTitle:d.seriesTitle||'',status:d.status||'',followers:d.followerCount||0,sent:d.sentCount||0,updatedAt:fmt(d.updatedAt),completedAt:fmt(d.completedAt)}));}
          const toks=await db.collection('devicePushTokens').where('platform','==','android').get();
          const versions={};for(const x of toks.docs){const v=String((x.data()||{}).appVersion||'unknown');versions[v]=(versions[v]||0)+1;}
          console.log('androidTokens='+toks.size+' versions='+JSON.stringify(versions));
          NODE
      - name: Persist report
        run: |
          git config user.name 'Nava Verify Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nava-notification-verify.txt
          git commit -m 'Record Nava notification verification [skip ci]' || true
          git push || true
