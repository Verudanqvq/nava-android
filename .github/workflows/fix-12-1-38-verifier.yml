name: Fix Android 12.1.38 verifier
# trigger: 2
on:
  push:
    branches: [main]
    paths: [".github/workflows/fix-12-1-38-verifier.yml"]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix verifier
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/nava-android-12-1-38.yml')
          s=p.read_text()
          old="          grep -q 'Yeni bölüm geldi' /tmp/verify-direct/com/verudanava/nava/NavaDirectNotification.smali\n"
          new="          grep -q 'Yeni cilt geldi' /tmp/verify-direct/com/verudanava/nava/NavaDirectNotification.smali\n          grep -q 'setSmallIcon' /tmp/verify-direct/com/verudanava/nava/NavaDirectNotification.smali\n"
          if old not in s: raise SystemExit('target verifier line missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'Nava Build Fix Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/nava-android-12-1-38.yml
          git commit -m 'Fix Android 12.1.38 renderer verification'
          git push
