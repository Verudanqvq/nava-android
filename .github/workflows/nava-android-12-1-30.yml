name: Nava Android 12.1.30 UI reader polish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-android-12-1-30.yml"
      - "android-patch/patch-apk-v12.1.30.py"
      - "android-patch/push-block-v12.1.30.js"
      - "android-patch/ui-reader-polish-v12.1.30.js"
      - "android-patch/ui-reader-polish-v12.1.30.css"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nava-android-12-1-30
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CERT_SHA256: acde7cf216852448a8a8277fe4bf11eac183394e6b34a862b124e693d51d09fe
      SOURCE_TAG: v12.1.29
      TARGET_TAG: v12.1.30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare status
        shell: bash
        run: printf 'status=running\nstarted=%s\n' "$(date -u +%FT%TZ)" > /tmp/nava-build-status.txt
      - name: Validate patch inputs
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile android-patch/patch-apk-v12.1.30.py
          node --check android-patch/push-block-v12.1.30.js
          node --check android-patch/ui-reader-polish-v12.1.30.js
          grep -q "NEW_VERSION='12.1.30'" android-patch/patch-apk-v12.1.30.py
          grep -q "NEW_CODE=46" android-patch/patch-apk-v12.1.30.py
          grep -q "appVersion:'12.1.30'" android-patch/push-block-v12.1.30.js
          grep -q 'nava-app-overlay-open' android-patch/ui-reader-polish-v12.1.30.css
          grep -q 'saveReaderPositionNow' android-patch/ui-reader-polish-v12.1.30.js
          printf 'source_validation=ok\nui=topbar+bottomnav+search+notifications+profile+reader\nreader=position+small-screen+safe-area\nperformance=cache-clean+lazy-images+visual-viewport\n' >> /tmp/nava-build-status.txt
      - name: Recover signing material
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          export NAVA_KDF_SECRET="$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | sha256sum | cut -d' ' -f1)"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in .github/nava-signing/private.pem.enc -out /tmp/nava-private.pem -pass env:NAVA_KDF_SECRET
          unset NAVA_KDF_SECRET
          openssl pkeyutl -decrypt -inkey /tmp/nava-private.pem -in android-signing/key-material.enc -out /tmp/key-material.bin -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          python - <<'PY'
          from pathlib import Path
          d=Path('/tmp/key-material.bin').read_bytes()
          if len(d)!=48: raise SystemExit('bad key material')
          Path('/tmp/aes-key').write_text(d[:32].hex()); Path('/tmp/aes-iv').write_text(d[32:].hex())
          PY
          openssl enc -d -aes-256-cbc -K "$(cat /tmp/aes-key)" -iv "$(cat /tmp/aes-iv)" -in android-signing/signing-payload.enc -out /tmp/signing.zip
          mkdir -p /tmp/nava-signing; unzip -q /tmp/signing.zip -d /tmp/nava-signing
          test -s /tmp/nava-signing/signing/nava-release.jks; test -s /tmp/nava-signing/keystore.properties
          rm -f /tmp/nava-private.pem /tmp/key-material.bin /tmp/aes-key /tmp/aes-iv /tmp/signing.zip
          printf 'signing_material=ok\n' >> /tmp/nava-build-status.txt
      - name: Download 12.1.29
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/current
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern Nava.apk --dir /tmp/current
          test -s /tmp/current/Nava.apk
          printf 'source_apk=ok\n' >> /tmp/nava-build-status.txt
      - name: Patch scoped APK entries
        shell: bash
        run: |
          set -euo pipefail
          python android-patch/patch-apk-v12.1.30.py \
            /tmp/current/Nava.apk \
            android-patch/push-block-v12.1.30.js \
            android-patch/ui-reader-polish-v12.1.30.js \
            android-patch/ui-reader-polish-v12.1.30.css \
            /tmp/Nava-unsigned.apk 46 | tee /tmp/patch.txt
          grep -q 'PATCH_OK versionCode=46 js=12.1.30 css=ui-reader dex=ua-12.1.30 unchanged_entries=ok' /tmp/patch.txt
          unzip -p /tmp/Nava-unsigned.apk assets/nava_app_v11.js > /tmp/final.js
          unzip -p /tmp/Nava-unsigned.apk assets/nava_app_v11.css > /tmp/final.css
          unzip -p /tmp/Nava-unsigned.apk classes.dex > /tmp/final.dex
          node --check /tmp/final.js
          grep -q 'Nava Android v12.1.30 — UI/reader/runtime polish' /tmp/final.js
          grep -q 'Nava Android v12.1.30 — safe-area, overlays, reader and small-screen polish' /tmp/final.css
          grep -q 'nava-profile-edit-modal' /tmp/final.css
          grep -q '#nava-app-notifications-v9' /tmp/final.css
          grep -q '#nava-reader-bottom-v2' /tmp/final.css
          python - <<'PY'
          import hashlib,struct,zlib
          d=open('/tmp/final.dex','rb').read()
          assert b'NavaAndroidApp/12.1.30' in d
          assert b'NavaAndroidApp/12.1.23' not in d
          assert b'nava_notif_permission_v12129' in d
          assert d[12:32]==hashlib.sha1(d[32:]).digest()
          assert struct.unpack_from('<I',d,8)[0]==(zlib.adler32(d[12:])&0xffffffff)
          PY
          printf 'patch=ok\nunchanged_entries=ok\ndex_checksum=ok\nfinal_js_syntax=ok\nua=12.1.30\n' >> /tmp/nava-build-status.txt
      - name: Align and sign
        shell: bash
        run: |
          set -euo pipefail
          set +x
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 /tmp/Nava-unsigned.apk /tmp/Nava-aligned.apk
          PROP=/tmp/nava-signing/keystore.properties
          export NAVA_STORE_PASS="$(sed -n 's/^storePassword=//p' "$PROP" | tr -d '\r' | head -1)"
          export NAVA_KEY_PASS="$(sed -n 's/^keyPassword=//p' "$PROP" | tr -d '\r' | head -1)"
          KEY_ALIAS="$(sed -n 's/^keyAlias=//p' "$PROP" | tr -d '\r' | head -1)"
          keytool -list -keystore /tmp/nava-signing/signing/nava-release.jks -storepass "$NAVA_STORE_PASS" -alias "$KEY_ALIAS" >/dev/null
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/nava-signing/signing/nava-release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:NAVA_STORE_PASS --key-pass env:NAVA_KEY_PASS --out /tmp/Nava.apk /tmp/Nava-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs /tmp/Nava.apk > /tmp/verify.txt
          CERT="$(grep -i -m1 'certificate SHA-256 digest:' /tmp/verify.txt | sed 's/.*digest:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$CERT" = "$EXPECTED_CERT_SHA256"
          printf 'zipalign=ok\nsigning=ok\ncert_sha256=%s\n' "$CERT" >> /tmp/nava-build-status.txt
          sha256sum /tmp/Nava.apk | awk '{print "apk_sha256="$1}' >> /tmp/nava-build-status.txt
      - name: Publish 12.1.30 latest
        shell: bash
        run: |
          set -euo pipefail
          NOTES='Android UI/reader polish: safe-area aware app bars, search/notification/profile/reader overlays hardened for small screens and keyboard viewport changes, immediate reader-position persistence on page exit, controlled old-cache cleanup, lazy image decoding outside the reader, larger touch targets, and the native User-Agent marker updated to 12.1.30. Existing notification, updater, signing, profile, read-state and reader navigation behavior is preserved.'
          if gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TARGET_TAG" /tmp/Nava.apk#Nava.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" --latest --title 'Nava 12.1.30' --notes "$NOTES"
          else
            gh release create "$TARGET_TAG" /tmp/Nava.apk#Nava.apk --repo "$GITHUB_REPOSITORY" --title 'Nava 12.1.30' --notes "$NOTES" --latest
          fi
          printf 'release=v12.1.30\nasset=Nava.apk\nstatus=success\nfinished=%s\n' "$(date -u +%FT%TZ)" >> /tmp/nava-build-status.txt
      - name: Persist status
        if: always()
        shell: bash
        run: |
          if ! grep -q '^status=success$' /tmp/nava-build-status.txt 2>/dev/null; then printf 'status=failed\nfinished=%s\n' "$(date -u +%FT%TZ)" >> /tmp/nava-build-status.txt; fi
          cp /tmp/nava-build-status.txt android-build-status.txt
          git config user.name 'Nava Android Build Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add android-build-status.txt
          git commit -m 'Update Android 12.1.30 build status [skip ci]' || true
          git push || true
