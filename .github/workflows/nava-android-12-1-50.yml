name: Nava Android 12.1.50 hotfix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-android-12-1-50.yml"
      - "android-patch/v12.1.50/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nava-android-12-1-50
  cancel-in-progress: false

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CERT_SHA256: acde7cf216852448a8a8277fe4bf11eac183394e6b34a862b124e693d51d09fe
      EXPECTED_SOURCE_SHA256: 8b4650833446f30eafa6e0fc1ed28dc19564eeee304421b02c7ce05f5433964c
      SOURCE_TAG: v12.1.47
      TARGET_TAG: v12.1.50
    steps:
      - uses: actions/checkout@v4

      - name: Prepare status
        run: printf 'status=running\nstarted=%s\n' "$(date -u +%FT%TZ)" > /tmp/status.txt

      - name: Validate sources
        run: |
          set -euo pipefail
          python -m py_compile android-patch/v12.1.50/patch-apk.py
          node --check android-patch/v12.1.49/download-menu.js
          node --check android-patch/v12.1.49/offline-ui.js
          node --check android-patch/v12.1.49/language-variants.js
          node --check android-patch/v12.1.49/notification-delete.js
          grep -q "NEW_VERSION='12.1.50';NEW_CODE=66" android-patch/v12.1.50/patch-apk.py
          grep -q "nativeUA=12.1.47" android-patch/v12.1.50/patch-apk.py
          printf 'source_validation=ok\nbase=12.1.47\nnative_ua=12.1.47-preserved\n' >> /tmp/status.txt

      - name: Recover signing material
        shell: bash
        run: |
          set -euo pipefail
          set +x
          export NAVA_KDF_SECRET="$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | sha256sum | cut -d' ' -f1)"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in .github/nava-signing/private.pem.enc -out /tmp/nava-private.pem -pass env:NAVA_KDF_SECRET
          unset NAVA_KDF_SECRET
          openssl pkeyutl -decrypt -inkey /tmp/nava-private.pem -in android-signing/key-material.enc -out /tmp/key-material.bin -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          python - <<'PY'
          from pathlib import Path
          d=Path('/tmp/key-material.bin').read_bytes(); assert len(d)==48
          Path('/tmp/aes-key').write_text(d[:32].hex()); Path('/tmp/aes-iv').write_text(d[32:].hex())
          PY
          openssl enc -d -aes-256-cbc -K "$(cat /tmp/aes-key)" -iv "$(cat /tmp/aes-iv)" -in android-signing/signing-payload.enc -out /tmp/signing.zip
          mkdir -p /tmp/nava-signing
          unzip -q /tmp/signing.zip -d /tmp/nava-signing
          rm -f /tmp/nava-private.pem /tmp/key-material.bin /tmp/aes-key /tmp/aes-iv /tmp/signing.zip
          printf 'signing_material=ok\n' >> /tmp/status.txt

      - name: Download signed 12.1.47 base
        run: |
          set -euo pipefail
          mkdir -p /tmp/current
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern Nava.apk --dir /tmp/current
          GOT="$(sha256sum /tmp/current/Nava.apk | cut -d' ' -f1)"
          test "$GOT" = "$EXPECTED_SOURCE_SHA256"
          printf 'source_apk=ok\nsource_sha256=%s\n' "$GOT" >> /tmp/status.txt

      - name: Patch and validate APK
        run: |
          set -euo pipefail
          python android-patch/v12.1.50/patch-apk.py \
            /tmp/current/Nava.apk \
            android-patch/v12.1.49/download-menu.js \
            android-patch/v12.1.49/offline-ui.js \
            android-patch/v12.1.49/language-variants.js \
            android-patch/v12.1.49/notification-delete.js \
            android-patch/v12.1.49/ui-fix.css \
            /tmp/Nava-unsigned.apk | tee /tmp/patch.txt
          grep -q 'PATCH_OK versionName=12.1.50 versionCode=66 base=12.1.47 nativeUA=12.1.47' /tmp/patch.txt
          unzip -p /tmp/Nava-unsigned.apk assets/nava_app_v11.js > /tmp/final.js
          unzip -p /tmp/Nava-unsigned.apk classes.dex > /tmp/final.dex
          node --check /tmp/final.js
          grep -aq 'NavaAndroidApp/12.1.47' /tmp/final.dex
          ! grep -aq 'NavaAndroidApp/12.1.50' /tmp/final.dex
          printf 'patch=ok\nversionName=12.1.50\nversionCode=66\n' >> /tmp/status.txt

      - name: Align and sign
        shell: bash
        run: |
          set -euo pipefail
          set +x
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 /tmp/Nava-unsigned.apk /tmp/Nava-aligned.apk
          PROP=/tmp/nava-signing/keystore.properties
          export NAVA_STORE_PASS="$(sed -n 's/^storePassword=//p' "$PROP" | tr -d '\r' | head -1)"
          export NAVA_KEY_PASS="$(sed -n 's/^keyPassword=//p' "$PROP" | tr -d '\r' | head -1)"
          KEY_ALIAS="$(sed -n 's/^keyAlias=//p' "$PROP" | tr -d '\r' | head -1)"
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/nava-signing/signing/nava-release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:NAVA_STORE_PASS --key-pass env:NAVA_KEY_PASS --out /tmp/Nava.apk /tmp/Nava-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs /tmp/Nava.apk > /tmp/verify.txt
          CERT="$(grep -i -m1 'certificate SHA-256 digest:' /tmp/verify.txt | sed 's/.*digest:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$CERT" = "$EXPECTED_CERT_SHA256"
          APK_SHA="$(sha256sum /tmp/Nava.apk | cut -d' ' -f1)"
          printf 'zipalign=ok\nsigning=ok\ncert_sha256=%s\napk_sha256=%s\n' "$CERT" "$APK_SHA" >> /tmp/status.txt

      - name: Prepare native Android emulator
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name nava_api35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_6"
          python -m pip install --quiet pillow
          printf 'emulator_tools=ok\n' >> /tmp/status.txt

      - name: Emulator startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd nava_api35 \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel off \
            >/tmp/emulator.log 2>&1 &
          EMU_PID=$!
          cleanup(){ adb emu kill >/dev/null 2>&1 || true; kill "$EMU_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          adb wait-for-device
          for i in $(seq 1 180); do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$BOOT" = "1" ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r /tmp/Nava.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          PKG="$("$BUILD_TOOLS/aapt" dump badging /tmp/Nava.apk | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -1)"
          test -n "$PKG"
          adb logcat -c || true
          adb shell am force-stop "$PKG"
          adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/tmp/monkey.txt
          sleep 18
          adb shell dumpsys window windows > /tmp/windows.txt
          grep -q "$PKG" /tmp/windows.txt
          adb exec-out screencap -p > /tmp/screen.png
          python - <<'PY'
          from PIL import Image,ImageStat
          im=Image.open('/tmp/screen.png').convert('L')
          w,h=im.size
          crop=im.crop((int(w*.06),int(h*.13),int(w*.94),int(h*.90)))
          stat=ImageStat.Stat(crop)
          mean=float(stat.mean[0]); var=float(stat.var[0])
          print(f'SCREEN mean={mean:.2f} var={var:.2f} size={w}x{h}')
          if mean>247.5 and var<45:
              raise SystemExit('WHITE_SCREEN_DETECTED')
          PY
          adb logcat -d -t 1600 > /tmp/logcat.txt || true
          ! grep -E 'FATAL EXCEPTION|AndroidRuntime.*Process: .*verudanava' /tmp/logcat.txt
          printf 'emulator_smoke=ok\n' >> /tmp/status.txt

      - name: Publish 12.1.50
        run: |
          set -euo pipefail
          if gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TARGET_TAG already exists; refusing to overwrite." >&2
            exit 1
          fi
          NOTES='12.1.50 beyaz ekran hotfixi. 12.1.47 imzalı APK tabanından kurulmuştur ve 12.1.47 çalışan native WebView UA/classes.dex aynen korunur. 12.1.49 indirme, Eseri indir cilt seçimi, indirme sırası, güvenilir çevrimdışı silme, Firestore bildirim silme ve eser bazlı TR/EN/JP/KR/CN dil varyantı özellikleri korunur. Release, Android emülatöründe kurulum + açılış + beyaz ekran görsel testi geçmeden yayınlanmaz.'
          gh release create "$TARGET_TAG" /tmp/Nava.apk#Nava.apk --repo "$GITHUB_REPOSITORY" --title 'Nava 12.1.50' --notes "$NOTES" --latest
          printf 'release=v12.1.50\nasset=Nava.apk\nstatus=success\nfinished=%s\n' "$(date -u +%FT%TZ)" >> /tmp/status.txt

      - name: Persist status
        if: always()
        run: |
          if ! grep -q '^status=success$' /tmp/status.txt 2>/dev/null; then printf 'status=failed\nfinished=%s\n' "$(date -u +%FT%TZ)" >> /tmp/status.txt; fi
          cp /tmp/status.txt android-build-status-12.1.50.txt
          git config user.name 'Nava Android Build Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add android-build-status-12.1.50.txt
          git commit -m 'Record Android 12.1.50 build [skip ci]' || true
          git push || true
