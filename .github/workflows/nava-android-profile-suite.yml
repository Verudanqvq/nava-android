name: Nava Android 12.1.28 profile suite

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-android-profile-suite.yml"
      - "android-patch/patch-apk-v12.1.28.py"
      - "android-patch/push-block-v12.1.28.js"
      - "android-patch/profile-polish-v12.1.28.js"
      - "android-patch/profile-polish-v12.1.28.css"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nava-android-profile-suite-12-1-28
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CERT_SHA256: acde7cf216852448a8a8277fe4bf11eac183394e6b34a862b124e693d51d09fe
      SOURCE_TAG: v12.1.27
      TARGET_TAG: v12.1.28

    steps:
      - uses: actions/checkout@v4

      - name: Prepare status
        shell: bash
        run: printf 'status=running\nstarted=%s\n' "$(date -u +%FT%TZ)" > /tmp/nava-android-build-status.txt

      - name: Validate patch sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile android-patch/patch-apk-v12.1.28.py
          node --check android-patch/push-block-v12.1.28.js
          node --check android-patch/profile-polish-v12.1.28.js
          grep -q 'OLD_VERSION = "12.1.27"' android-patch/patch-apk-v12.1.28.py
          grep -q 'NEW_VERSION = "12.1.28"' android-patch/patch-apk-v12.1.28.py
          grep -q 'NEW_CODE = 44' android-patch/patch-apk-v12.1.28.py
          grep -q "collection('adminProfiles')" android-patch/profile-polish-v12.1.28.js
          grep -q "collection('staff')" android-patch/profile-polish-v12.1.28.js
          grep -q 'nava:profile-customization-updated' android-patch/profile-polish-v12.1.28.js
          grep -q "is-preset" android-patch/profile-polish-v12.1.28.js
          printf 'source_validation=ok\nprofile_search=admin+preset+google\nlive_refresh=event+observer\n' >> /tmp/nava-android-build-status.txt

      - name: Recover signing material securely
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          test -s .github/nava-signing/private.pem.enc
          test -s android-signing/signing-payload.enc
          test -s android-signing/key-material.enc
          export NAVA_KDF_SECRET="$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | sha256sum | cut -d' ' -f1)"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in .github/nava-signing/private.pem.enc -out /tmp/nava-private.pem -pass env:NAVA_KDF_SECRET
          unset NAVA_KDF_SECRET
          openssl pkeyutl -decrypt -inkey /tmp/nava-private.pem -in android-signing/key-material.enc -out /tmp/key-material.bin -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          python - <<'PY'
          from pathlib import Path
          d=Path('/tmp/key-material.bin').read_bytes()
          if len(d)!=48: raise SystemExit(f'bad key material length: {len(d)}')
          Path('/tmp/aes-key.hex').write_text(d[:32].hex())
          Path('/tmp/aes-iv.hex').write_text(d[32:48].hex())
          PY
          KEYHEX="$(cat /tmp/aes-key.hex)"; IVHEX="$(cat /tmp/aes-iv.hex)"
          openssl enc -d -aes-256-cbc -K "$KEYHEX" -iv "$IVHEX" -in android-signing/signing-payload.enc -out /tmp/signing.zip
          mkdir -p /tmp/nava-signing
          unzip -q /tmp/signing.zip -d /tmp/nava-signing
          test -s /tmp/nava-signing/signing/nava-release.jks
          test -s /tmp/nava-signing/keystore.properties
          rm -f /tmp/nava-private.pem /tmp/key-material.bin /tmp/aes-key.hex /tmp/aes-iv.hex /tmp/signing.zip
          printf 'signing_material=ok\n' >> /tmp/nava-android-build-status.txt

      - name: Download 12.1.27
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nava-current
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern Nava.apk --dir /tmp/nava-current
          test -s /tmp/nava-current/Nava.apk
          printf 'source_tag=%s\nsource_apk=ok\n' "$SOURCE_TAG" >> /tmp/nava-android-build-status.txt

      - name: Patch scoped Android assets
        shell: bash
        run: |
          set -euo pipefail
          python android-patch/patch-apk-v12.1.28.py \
            /tmp/nava-current/Nava.apk \
            android-patch/push-block-v12.1.28.js \
            android-patch/profile-polish-v12.1.28.js \
            android-patch/profile-polish-v12.1.28.css \
            /tmp/Nava-unsigned.apk 44 | tee /tmp/patch-result.txt
          grep -q 'PATCH_OK versionCode=44 js=12.1.28 profile=live-search css=admin-small-screen unchanged_entries=ok' /tmp/patch-result.txt
          unzip -p /tmp/Nava-unsigned.apk assets/nava_app_v11.js > /tmp/final-app.js
          unzip -p /tmp/Nava-unsigned.apk assets/nava_app_v11.css > /tmp/final-app.css
          node --check /tmp/final-app.js
          grep -q 'Nava Android v12.1.28 — profile/search live polish' /tmp/final-app.js
          grep -q 'Nava Android v12.1.28 — profile/admin/search/small-screen polish' /tmp/final-app.css
          grep -q 'Nava Android v12.1.27 — profile/editor mobile layout fix' /tmp/final-app.css
          grep -q '#nava-app-topbar' /tmp/final-app.css
          grep -q '#nava-app-bottom' /tmp/final-app.css
          grep -q '#nava-app-search-v2' /tmp/final-app.css
          grep -q 'nava-profile-edit-modal' /tmp/final-app.css
          grep -q 'nava-reader' /tmp/final-app.css
          printf 'patch=ok\nunchanged_entries=ok\nfinal_js_syntax=ok\nui_static_audit=topbar+bottomnav+search+modal+reader\n' >> /tmp/nava-android-build-status.txt

      - name: Find Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/zipalign"; test -x "$BUILD_TOOLS/apksigner"
          printf '%s' "$BUILD_TOOLS" > /tmp/build-tools-path
          printf 'android_build_tools=%s\n' "$(basename "$BUILD_TOOLS")" >> /tmp/nava-android-build-status.txt

      - name: Align and sign
        shell: bash
        run: |
          set -uo pipefail
          set +x
          BUILD_TOOLS="$(cat /tmp/build-tools-path)"; PROP=/tmp/nava-signing/keystore.properties
          "$BUILD_TOOLS/zipalign" -f -p 4 /tmp/Nava-unsigned.apk /tmp/Nava-aligned.apk || exit 1
          printf 'zipalign=ok\n' >> /tmp/nava-android-build-status.txt
          export NAVA_STORE_PASS="$(sed -n 's/^storePassword=//p' "$PROP" | tr -d '\r' | head -1)"
          export NAVA_KEY_PASS="$(sed -n 's/^keyPassword=//p' "$PROP" | tr -d '\r' | head -1)"
          KEY_ALIAS="$(sed -n 's/^keyAlias=//p' "$PROP" | tr -d '\r' | head -1)"
          test -n "$NAVA_STORE_PASS"; test -n "$NAVA_KEY_PASS"; test -n "$KEY_ALIAS"
          printf 'keystore_properties=ok\n' >> /tmp/nava-android-build-status.txt
          keytool -list -keystore /tmp/nava-signing/signing/nava-release.jks -storepass "$NAVA_STORE_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1 || exit 1
          printf 'keystore_unlock=ok\n' >> /tmp/nava-android-build-status.txt
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/nava-signing/signing/nava-release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:NAVA_STORE_PASS --key-pass env:NAVA_KEY_PASS --out /tmp/Nava.apk /tmp/Nava-aligned.apk || exit 1
          printf 'apksigner_sign=ok\n' >> /tmp/nava-android-build-status.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs /tmp/Nava.apk > /tmp/apksigner-verify.txt 2>&1 || exit 1
          printf 'apksigner_verify=ok\n' >> /tmp/nava-android-build-status.txt
          CERT="$(grep -i -m1 'certificate SHA-256 digest:' /tmp/apksigner-verify.txt | sed 's/.*digest:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$CERT" = "$EXPECTED_CERT_SHA256" || { printf 'error=cert_mismatch\ncert_sha256=%s\n' "$CERT" >> /tmp/nava-android-build-status.txt; exit 1; }
          printf 'signing=ok\ncert_sha256=%s\n' "$CERT" >> /tmp/nava-android-build-status.txt
          sha256sum /tmp/Nava.apk | awk '{print "apk_sha256="$1}' >> /tmp/nava-android-build-status.txt
          unset NAVA_STORE_PASS NAVA_KEY_PASS

      - name: Publish 12.1.28 latest
        shell: bash
        run: |
          set -euo pipefail
          NOTES='Android profile suite: @ user search now resolves admin custom avatars, Google avatars and Nava presets; profile customization changes refresh app search/profile UI without a reload; admin profile editor and small-screen layout receive app-specific collision fixes. Reader, read-state, updater/native resources and notification behavior are preserved.'
          if gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TARGET_TAG" /tmp/Nava.apk#Nava.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" --latest --title 'Nava 12.1.28' --notes "$NOTES"
          else
            gh release create "$TARGET_TAG" /tmp/Nava.apk#Nava.apk --repo "$GITHUB_REPOSITORY" --title 'Nava 12.1.28' --notes "$NOTES" --latest
          fi
          printf 'release=%s\nasset=Nava.apk\nstatus=success\nfinished=%s\n' "$TARGET_TAG" "$(date -u +%FT%TZ)" >> /tmp/nava-android-build-status.txt

      - name: Persist status
        if: always()
        shell: bash
        run: |
          set -u
          if ! grep -q '^status=success$' /tmp/nava-android-build-status.txt 2>/dev/null; then printf 'status=failed\nfinished=%s\n' "$(date -u +%FT%TZ)" >> /tmp/nava-android-build-status.txt; fi
          cp /tmp/nava-android-build-status.txt android-build-status.txt
          git config user.name 'Nava Android Build Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-build-status.txt
          if ! git diff --cached --quiet; then git commit -m 'Update Android build status [skip ci]'; git push; fi
