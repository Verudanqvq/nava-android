name: Nava Android 12.1.31 offline downloads

on:
  push:
    branches: [main, feat/offline-downloads-12-1-31]
    paths:
      - ".github/workflows/nava-android-12-1-31.yml"
      - "android-patch/v12.1.31/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nava-android-12-1-31-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CERT_SHA256: acde7cf216852448a8a8277fe4bf11eac183394e6b34a862b124e693d51d09fe
      EXPECTED_SOURCE_SHA256: c072f679623e01efd59fe376d4a34cd71b26f734165e9ff98d53bee15862ed50
      SOURCE_TAG: v12.1.30
      TARGET_TAG: v12.1.31
    steps:
      - uses: actions/checkout@v4

      - name: Prepare status
        run: printf 'status=running\nbranch=%s\nstarted=%s\n' "$GITHUB_REF_NAME" "$(date -u +%FT%TZ)" > /tmp/nava-build-status.txt

      - name: Validate sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile android-patch/v12.1.31/patch-smali.py android-patch/v12.1.31/patch-apk.py
          node --check android-patch/v12.1.31/offline-downloads.js
          node --check android-patch/v12.1.31/push-block.js
          grep -q "NEW_VERSION='12.1.31'" android-patch/v12.1.31/patch-apk.py
          grep -q "NEW_CODE=47" android-patch/v12.1.31/patch-apk.py
          grep -q "appVersion:'12.1.31'" android-patch/v12.1.31/push-block.js
          grep -q 'class OfflineRuntime' android-patch/v12.1.31/OfflineRuntime.java
          grep -q 'downloadBatch' android-patch/v12.1.31/OfflineRuntime.java
          grep -q 'shouldInterceptRequest' android-patch/v12.1.31/patch-smali.py
          printf 'source_validation=ok\noffline=app-private-storage+native-interceptor+downloads-ui\nnotification_channel=v2-high\n' >> /tmp/nava-build-status.txt

      - name: Prepare notification channel v2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for name in ['notification-backend/scan.mjs','notification-backend/retry-push.mjs']:
              p=Path(name); s=p.read_text()
              if 'nava_follower_releases_v2' not in s:
                  if 'nava_follower_releases' not in s: raise SystemExit(name+': old channel missing')
                  s=s.replace('nava_follower_releases','nava_follower_releases_v2')
                  p.write_text(s)
              if 'nava_follower_releases_v2' not in p.read_text(): raise SystemExit(name+': v2 channel verify failed')
          PY
          npm --prefix notification-backend install --omit=dev --no-audit --no-fund
          npm --prefix notification-backend test
          printf 'notification_backend_channel=v2\n' >> /tmp/nava-build-status.txt

      - name: Install smali tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y smali >/dev/null
          command -v smali
          command -v baksmali
          printf 'smali_tools=ok\n' >> /tmp/nava-build-status.txt

      - name: Recover signing material
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          export NAVA_KDF_SECRET="$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | sha256sum | cut -d' ' -f1)"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in .github/nava-signing/private.pem.enc -out /tmp/nava-private.pem -pass env:NAVA_KDF_SECRET
          unset NAVA_KDF_SECRET
          openssl pkeyutl -decrypt -inkey /tmp/nava-private.pem -in android-signing/key-material.enc -out /tmp/key-material.bin -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          python - <<'PY'
          from pathlib import Path
          d=Path('/tmp/key-material.bin').read_bytes()
          if len(d)!=48: raise SystemExit('bad key material')
          Path('/tmp/aes-key').write_text(d[:32].hex()); Path('/tmp/aes-iv').write_text(d[32:].hex())
          PY
          openssl enc -d -aes-256-cbc -K "$(cat /tmp/aes-key)" -iv "$(cat /tmp/aes-iv)" -in android-signing/signing-payload.enc -out /tmp/signing.zip
          mkdir -p /tmp/nava-signing; unzip -q /tmp/signing.zip -d /tmp/nava-signing
          test -s /tmp/nava-signing/signing/nava-release.jks; test -s /tmp/nava-signing/keystore.properties
          rm -f /tmp/nava-private.pem /tmp/key-material.bin /tmp/aes-key /tmp/aes-iv /tmp/signing.zip
          printf 'signing_material=ok\n' >> /tmp/nava-build-status.txt

      - name: Download stable 12.1.30
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/current
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern Nava.apk --dir /tmp/current
          test -s /tmp/current/Nava.apk
          GOT="$(sha256sum /tmp/current/Nava.apk | cut -d' ' -f1)"
          test "$GOT" = "$EXPECTED_SOURCE_SHA256"
          unzip -l /tmp/current/Nava.apk | grep -q 'classes.dex'
          if unzip -l /tmp/current/Nava.apk | grep -q 'classes2.dex'; then echo 'source unexpectedly multidex' >&2; exit 1; fi
          printf 'source_apk=ok\nsource_sha256=%s\n' "$GOT" >> /tmp/nava-build-status.txt

      - name: Patch existing native dex
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/decoded/smali
          unzip -p /tmp/current/Nava.apk classes.dex > /tmp/base.dex
          baksmali disassemble /tmp/base.dex -o /tmp/decoded/smali
          python android-patch/v12.1.31/patch-smali.py /tmp/decoded | tee /tmp/smali-patch.txt
          grep -q 'SMALI_PATCH_OK' /tmp/smali-patch.txt
          smali assemble /tmp/decoded/smali -o /tmp/classes.dex
          baksmali disassemble /tmp/classes.dex -o /tmp/verify-classes
          grep -R -q 'OfflineRuntime;->attach' /tmp/verify-classes
          grep -R -q 'OfflineRuntime;->intercept' /tmp/verify-classes
          grep -R -q 'nava_follower_releases_v2' /tmp/verify-classes
          if grep -R -q '"nava_follower_releases"' /tmp/verify-classes; then echo 'old notification channel remains' >&2; exit 1; fi
          printf 'native_hooks=ok\nnotification_native_channel=v2-high\n' >> /tmp/nava-build-status.txt

      - name: Compile native offline runtime
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_JAR="$(find "$ANDROID_HOME/platforms" -mindepth 2 -maxdepth 2 -name android.jar | sort -V | tail -1)"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -s "$ANDROID_JAR"; test -x "$BUILD_TOOLS/d8"
          mkdir -p /tmp/offline-classes /tmp/offline-dex
          javac -source 8 -target 8 -bootclasspath "$ANDROID_JAR" -d /tmp/offline-classes android-patch/v12.1.31/OfflineRuntime.java
          jar cf /tmp/offline-runtime.jar -C /tmp/offline-classes .
          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --min-api 23 --output /tmp/offline-dex /tmp/offline-runtime.jar
          test -s /tmp/offline-dex/classes.dex
          cp /tmp/offline-dex/classes.dex /tmp/classes2.dex
          baksmali disassemble /tmp/classes2.dex -o /tmp/verify-offline
          test -f /tmp/verify-offline/com/verudanava/nava/OfflineRuntime.smali
          grep -q 'JavascriptInterface' /tmp/verify-offline/com/verudanava/nava/OfflineRuntime\$Bridge.smali
          grep -q 'downloadBatch' /tmp/verify-offline/com/verudanava/nava/OfflineRuntime\$Bridge.smali
          printf 'offline_runtime_compile=ok\nclasses2=ok\n' >> /tmp/nava-build-status.txt

      - name: Pack scoped APK
        shell: bash
        run: |
          set -euo pipefail
          python android-patch/v12.1.31/patch-apk.py \
            /tmp/current/Nava.apk /tmp/classes.dex /tmp/classes2.dex \
            android-patch/v12.1.31/push-block.js \
            android-patch/v12.1.31/offline-downloads.js \
            android-patch/v12.1.31/offline-downloads.css \
            android-patch/v12.1.31/offline.html \
            /tmp/Nava-unsigned.apk 47 "$EXPECTED_SOURCE_SHA256" | tee /tmp/patch.txt
          grep -q 'PATCH_OK versionCode=47 js=12.1.31 offline=native classes2=ok scoped_entries=ok' /tmp/patch.txt
          unzip -p /tmp/Nava-unsigned.apk assets/nava_app_v11.js > /tmp/final.js
          unzip -p /tmp/Nava-unsigned.apk assets/nava_app_v11.css > /tmp/final.css
          unzip -p /tmp/Nava-unsigned.apk assets/offline.html > /tmp/final-offline.html
          node --check /tmp/final.js
          grep -q 'native offline downloads UI' /tmp/final.js
          grep -q 'offline downloads UI' /tmp/final.css
          grep -q 'Nava • İndirilenler' /tmp/final-offline.html
          printf 'pack=ok\nscoped_entries=ok\nfinal_js_syntax=ok\n' >> /tmp/nava-build-status.txt

      - name: Align and sign
        shell: bash
        run: |
          set -euo pipefail
          set +x
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 /tmp/Nava-unsigned.apk /tmp/Nava-aligned.apk
          PROP=/tmp/nava-signing/keystore.properties
          export NAVA_STORE_PASS="$(sed -n 's/^storePassword=//p' "$PROP" | tr -d '\r' | head -1)"
          export NAVA_KEY_PASS="$(sed -n 's/^keyPassword=//p' "$PROP" | tr -d '\r' | head -1)"
          KEY_ALIAS="$(sed -n 's/^keyAlias=//p' "$PROP" | tr -d '\r' | head -1)"
          keytool -list -keystore /tmp/nava-signing/signing/nava-release.jks -storepass "$NAVA_STORE_PASS" -alias "$KEY_ALIAS" >/dev/null
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/nava-signing/signing/nava-release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:NAVA_STORE_PASS --key-pass env:NAVA_KEY_PASS --out /tmp/Nava.apk /tmp/Nava-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs /tmp/Nava.apk > /tmp/verify.txt
          CERT="$(grep -i -m1 'certificate SHA-256 digest:' /tmp/verify.txt | sed 's/.*digest:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$CERT" = "$EXPECTED_CERT_SHA256"
          printf 'zipalign=ok\nsigning=ok\ncert_sha256=%s\n' "$CERT" >> /tmp/nava-build-status.txt
          sha256sum /tmp/Nava.apk | awk '{print "apk_sha256="$1}' >> /tmp/nava-build-status.txt

      - name: Publish latest 12.1.31
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          NOTES='Gerçek offline indirme: bölüm indir, cildi toplu indir, İndirilenler ekranı, uygulama kapatılıp açıldıktan sonra app-private depolamadan internetsiz okuma, sil/yenile ve yalnız Wi-Fi seçeneği. WebView istekleri native interceptor üzerinden kaydedilmiş HTML/görsellere yönlendirilir. Bildirim kanalı yeni yüksek öncelikli v2 kanala taşındı. Mevcut updater, signing, profil, okundu durumu ve reader navigation korunur.'
          if gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TARGET_TAG" /tmp/Nava.apk#Nava.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" --latest --title 'Nava 12.1.31' --notes "$NOTES"
          else
            gh release create "$TARGET_TAG" /tmp/Nava.apk#Nava.apk --repo "$GITHUB_REPOSITORY" --title 'Nava 12.1.31' --notes "$NOTES" --latest
          fi
          printf 'release=v12.1.31\nasset=Nava.apk\n' >> /tmp/nava-build-status.txt

      - name: Persist validation status and backend channel
        if: always()
        shell: bash
        run: |
          if grep -q '^signing=ok$' /tmp/nava-build-status.txt 2>/dev/null; then
            if [ "$GITHUB_REF" = 'refs/heads/main' ] && grep -q '^release=v12.1.31$' /tmp/nava-build-status.txt; then S=success; else S=validated; fi
          else S=failed; fi
          printf 'status=%s\nfinished=%s\n' "$S" "$(date -u +%FT%TZ)" >> /tmp/nava-build-status.txt
          cp /tmp/nava-build-status.txt android-build-status-12.1.31.txt
          git config user.name 'Nava Android Build Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add notification-backend/scan.mjs notification-backend/retry-push.mjs android-build-status-12.1.31.txt
          git commit -m 'Record Android 12.1.31 validation [skip ci]' || true
          git push || true
