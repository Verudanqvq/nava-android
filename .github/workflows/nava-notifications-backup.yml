name: Nava follower notifications backup

on:
  push:
    branches: [main]
    paths:
      - "notification-backend/**"
      - ".github/workflows/nava-notifications-backup.yml"
  schedule:
    # Backup sweep, offset from the primary watcher.
    - cron: "4-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared with the primary watcher so two scans never race each other.
  group: nava-follower-notifications-v6
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: notification-backend
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      NAVA_TRIGGER: backup-${{ github.event_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: notification-backend/package-lock.json

      - name: Install backend
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Test notification engine
        run: npm test

      - name: Scan Blogger now
        shell: bash
        run: |
          set -uo pipefail
          echo "NAVA_TRIGGER=${NAVA_TRIGGER}"
          npm run scan
          scan_rc=$?
          node retry-push.mjs
          push_rc=$?
          if [ "$scan_rc" -ne 0 ]; then exit "$scan_rc"; fi
          exit "$push_rc"
