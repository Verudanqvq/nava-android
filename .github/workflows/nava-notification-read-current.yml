name: Nava notification current-state read
on:
  push:
    branches: [main]
    paths: [".github/workflows/nava-notification-read-current.yml"]
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: notification-backend
        run: npm install --omit=dev --no-audit --no-fund
      - name: Read feed and Firestore only
        working-directory: notification-backend
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > ../notification-current-state.txt
          import { initializeApp, cert } from 'firebase-admin/app';
          import { getFirestore } from 'firebase-admin/firestore';
          import { parseEntry, mergeEntriesByPostId } from './core.mjs';
          const PROJECT_ID='nava-01';
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}');
          initializeApp({credential:cert(sa),projectId:PROJECT_ID});
          const db=getFirestore();
          const bases=[
            'https://verudanava.blogspot.com/feeds/posts/summary?alt=json&max-results=30&orderby=published',
            'https://verudanava.blogspot.com/feeds/posts/summary/-/B%C3%B6l%C3%BCm?alt=json&max-results=30&orderby=published',
            'https://verudanava.blogspot.com/feeds/posts/summary/-/Cilt?alt=json&max-results=30&orderby=published',
            'https://www.verudanava.com/feeds/posts/summary?alt=json&max-results=30&orderby=published',
            'https://www.verudanava.com/feeds/posts/summary/-/B%C3%B6l%C3%BCm?alt=json&max-results=30&orderby=published',
            'https://www.verudanava.com/feeds/posts/summary/-/Cilt?alt=json&max-results=30&orderby=published'
          ];
          const groups=[],errors=[]; const ts=Date.now();
          for(const base of bases){
            try{const r=await fetch(base+'&_nava_read='+ts,{headers:{'User-Agent':'NavaReadOnlyDiagnose/1','Cache-Control':'no-cache, no-store'},signal:AbortSignal.timeout(15000)}); if(!r.ok) throw new Error('HTTP '+r.status); const j=await r.json(); groups.push(Array.isArray(j?.feed?.entry)?j.feed.entry:[])}catch(e){errors.push({base,error:String(e?.message||e)})}
          }
          const merged=mergeEntriesByPostId(groups).map(parseEntry).filter(Boolean).sort((a,b)=>new Date(b.publishedAt||0)-new Date(a.publishedAt||0));
          const latest=merged.slice(0,12).map(x=>({postId:x.postId,title:x.title,kind:x.kind,publishedAt:x.publishedAt,url:x.url,labels:x.labels}));
          const engine=await db.collection('releaseAutomation').doc('engineV5').get();
          const releases=await db.collection('chapterReleases').orderBy('updatedAt','desc').limit(8).get();
          const postStates=[];
          for(const x of latest.slice(0,8)){
            const s=await db.collection('releaseAutomationPostsV5').doc(String(x.postId)).get();
            postStates.push({postId:x.postId,title:x.title,exists:s.exists,data:s.exists?s.data():null});
          }
          const tokenSnap=await db.collection('devicePushTokens').where('platform','==','android').get();
          console.log(JSON.stringify({checkedAt:new Date().toISOString(),feed:{sourcesOk:groups.length,errors,latest},engine:engine.exists?engine.data():null,postStates,releases:releases.docs.map(d=>({id:d.id,...d.data()})),tokens:tokenSnap.docs.map(d=>({id:d.id,uid:d.data().uid,appVersion:d.data().appVersion,notificationProtocol:d.data().notificationProtocol,notificationChannel:d.data().notificationChannel,updatedAt:d.data().updatedAt}))},null,2));
          NODE
      - name: Persist read-only report
        run: |
          git config user.name 'Nava Readonly Diagnose Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notification-current-state.txt
          git commit -m 'Record current notification state [skip ci]' || true
          git push
