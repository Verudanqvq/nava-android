name: Nava offline native inspect

on:
  push:
    branches: [feat/offline-downloads-12-1-31]
    paths:
      - ".github/workflows/nava-offline-native-inspect.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/offline-downloads-12-1-31
      - name: Install apktool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apktool >/dev/null
      - name: Download stable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/nava-apk
          gh release download v12.1.30 -p Nava.apk -D /tmp/nava-apk
          test -s /tmp/nava-apk/Nava.apk
      - name: Decode focused native surface
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nava-decoded android-audit/v12.1.30
          apktool d -f /tmp/nava-apk/Nava.apk -o /tmp/nava-decoded >/dev/null
          mkdir -p android-audit/v12.1.30/smali android-audit/v12.1.30/assets
          cp /tmp/nava-decoded/smali/gx.smali android-audit/v12.1.30/smali/gx.smali
          cp /tmp/nava-decoded/smali/com/verudanava/nava/MainActivity.smali android-audit/v12.1.30/smali/MainActivity.smali
          cp /tmp/nava-decoded/smali/c00.smali android-audit/v12.1.30/smali/c00.smali
          for n in bx lf rr; do [ -f "/tmp/nava-decoded/smali/$n.smali" ] && cp "/tmp/nava-decoded/smali/$n.smali" "android-audit/v12.1.30/smali/$n.smali"; done
          cp /tmp/nava-decoded/assets/offline.html android-audit/v12.1.30/assets/offline.html
          cp /tmp/nava-decoded/assets/nava_app_v11.js android-audit/v12.1.30/assets/nava_app_v11.js
          OUT=native-offline-inspect.txt
          : > "$OUT"
          echo '=== APK ===' >> "$OUT"
          sha256sum /tmp/nava-apk/Nava.apk >> "$OUT"
          echo >> "$OUT"
          echo '=== MATCH FILES: shouldInterceptRequest ===' >> "$OUT"
          grep -RIl 'shouldInterceptRequest' /tmp/nava-decoded/smali* | sort >> "$OUT" || true
          echo '=== MATCH FILES: NavaNative/postMessage ===' >> "$OUT"
          grep -RIl -E 'NavaNative|postMessage' /tmp/nava-decoded/smali* | sort >> "$OUT" || true
          echo '=== MAINACTIVITY HOOK LINES ===' >> "$OUT"
          grep -nE 'WebView;->|->A:Landroid/webkit/WebView;|setWebViewClient|setWebChromeClient|addJavascriptInterface|addWebMessageListener|NavaNative|evaluateJavascript|onCreate\(' /tmp/nava-decoded/smali/com/verudanava/nava/MainActivity.smali >> "$OUT" || true
          echo '=== GX HOOK LINES ===' >> "$OUT"
          grep -nE 'shouldInterceptRequest|onReceivedError|onPageFinished' /tmp/nava-decoded/smali/gx.smali >> "$OUT" || true
          echo '=== ASSETS ===' >> "$OUT"
          find /tmp/nava-decoded/assets -maxdepth 2 -type f -printf '%p\n' | sort >> "$OUT" || true
          echo '===== AndroidManifest decoded =====' >> "$OUT"
          sed -n '1,260p' /tmp/nava-decoded/AndroidManifest.xml >> "$OUT"
      - name: Persist inspection
        run: |
          git config user.name 'Nava Native Inspect Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-offline-inspect.txt android-audit/v12.1.30
          git commit -m 'Record WebView offline hook locations [skip ci]' || true
          git push origin HEAD:feat/offline-downloads-12-1-31
