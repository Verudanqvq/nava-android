name: Nava Android 12.2.37 profile update
# Release build for the corrected profile presentation patch; validates version code 188.
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/nava-12.2.37-profile-redesign.sh'
      - '.github/workflows/nava-android-12-2-37.yml'
      - 'android-patch/profile-redesign-v12.2.37.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nava-android-12-2-37-release
  cancel-in-progress: true
jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Validate injected JavaScript syntax
        run: node --check android-patch/profile-redesign-v12.2.37.js
      - name: Build profile update APK
        run: bash .github/scripts/nava-12.2.37-profile-redesign.sh
      - name: Verify package, version and signature
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose /tmp/Nava.apk
          "$BUILD_TOOLS/aapt" dump badging /tmp/Nava.apk | tee /tmp/badging237.txt
          grep -q "versionCode='188'.*versionName='12.2.37'" /tmp/badging237.txt
          grep -q 'status=success' /tmp/status237.txt
          unzip -p /tmp/Nava.apk assets/nava_app_v11.js | grep -q 'nava-profile-redesign-12237'
      - name: Publish profile update
        run: |
          if ! gh release view v12.2.37 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v12.2.37 --repo "$GITHUB_REPOSITORY" --title 'Nava 12.2.37 — Profil güncellemesi' --notes 'Profil ekranı için yeni, mevcut uygulama verisini ve eylemlerini koruyan stil güncellemesi. Paket, sürüm ve üretim imzası doğrulandı.' --latest --target "$GITHUB_SHA"
          fi
          gh release upload v12.2.37 /tmp/Nava.apk#Nava.apk --repo "$GITHUB_REPOSITORY" --clobber
          sha256sum /tmp/Nava.apk
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nava-12.2.37-profile-validation
          path: |
            /tmp/Nava.apk
            /tmp/verify237.txt
            /tmp/badging237.txt
            /tmp/status237.txt
          if-no-files-found: ignore
