name: Nava notification diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-notification-debug.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        id: install
        continue-on-error: true
        working-directory: notification-backend
        shell: bash
        run: |
          npm install --omit=dev --no-audit --no-fund > /tmp/install.log 2>&1
          echo $? > /tmp/install.rc
      - name: Capture before state
        id: before
        continue-on-error: true
        working-directory: notification-backend
        shell: bash
        run: |
          node debug-state.mjs > /tmp/before.json 2>/tmp/before.err
          echo $? > /tmp/before.rc
      - name: Test engine
        id: tests
        continue-on-error: true
        working-directory: notification-backend
        shell: bash
        run: |
          npm test > /tmp/tests.log 2>&1
          echo $? > /tmp/tests.rc
      - name: Run real scanner once
        id: scan
        continue-on-error: true
        working-directory: notification-backend
        shell: bash
        run: |
          npm run scan > /tmp/scan.log 2>&1
          echo $? > /tmp/scan.rc
          node retry-push.mjs > /tmp/retry.log 2>&1
          echo $? > /tmp/retry.rc
      - name: Capture after state
        id: after
        continue-on-error: true
        working-directory: notification-backend
        shell: bash
        run: |
          node debug-state.mjs > /tmp/after.json 2>/tmp/after.err
          echo $? > /tmp/after.rc
      - name: Persist diagnostics even on failure
        if: always()
        shell: bash
        run: |
          for f in install.rc before.rc tests.rc scan.rc retry.rc after.rc; do test -f /tmp/$f || echo 999 > /tmp/$f; done
          for f in install.log before.json before.err tests.log scan.log retry.log after.json after.err; do test -f /tmp/$f || : > /tmp/$f; done
          {
            echo '=== STEP RC ==='
            echo "install=$(cat /tmp/install.rc) before=$(cat /tmp/before.rc) tests=$(cat /tmp/tests.rc) scan=$(cat /tmp/scan.rc) retry=$(cat /tmp/retry.rc) after=$(cat /tmp/after.rc)"
            echo '=== INSTALL ==='; tail -n 80 /tmp/install.log
            echo '=== BEFORE ERROR ==='; cat /tmp/before.err
            echo '=== BEFORE ==='; cat /tmp/before.json
            echo '=== TESTS ==='; cat /tmp/tests.log
            echo '=== SCAN ==='; tail -n 200 /tmp/scan.log
            echo '=== RETRY ==='; tail -n 200 /tmp/retry.log
            echo '=== AFTER ERROR ==='; cat /tmp/after.err
            echo '=== AFTER ==='; cat /tmp/after.json
          } > notification-debug.txt
          git config user.name 'Nava Notification Debug Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notification-debug.txt
          git commit -m 'Record notification diagnostics [skip ci]' || true
          git push || true
