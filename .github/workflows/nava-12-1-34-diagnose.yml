name: Nava 12.1.34 diagnose
# run: 2
on:
  push:
    branches: [main]
    paths: [".github/workflows/nava-12-1-34-diagnose.yml"]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y smali >/dev/null
      - shell: bash
        run: |
          set +e
          exec > >(tee diagnose-12.1.34.txt) 2>&1
          mkdir -p /tmp/current /tmp/decoded/smali
          gh release download v12.1.33 --repo "$GITHUB_REPOSITORY" --pattern Nava.apk --dir /tmp/current
          unzip -p /tmp/current/Nava.apk classes.dex > /tmp/base.dex
          echo '=== disassemble ==='
          baksmali disassemble /tmp/base.dex -o /tmp/decoded/smali; echo rc=$?
          echo '=== anchor ==='
          grep -n -A28 -B8 ':cond_9' /tmp/decoded/smali/gx.smali | head -80 || true
          echo '=== patch ==='
          python android-patch/v12.1.34/patch-smali.py /tmp/decoded; echo rc=$?
          echo '=== assemble ==='
          smali assemble /tmp/decoded/smali -o /tmp/classes.dex; echo rc=$?
          ls -lh /tmp/classes.dex 2>/dev/null || true
          echo '=== verify ==='
          rm -rf /tmp/verify
          baksmali disassemble /tmp/classes.dex -o /tmp/verify; echo rc=$?
          grep -n -A40 -B8 'blogger-live' /tmp/verify/gx.smali | head -100 || true
          grep -R -n 'NavaAndroidApp/12.1.34' /tmp/verify | head -20 || true
          exit 0
      - run: |
          git config user.name 'Nava Diagnose Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnose-12.1.34.txt
          git commit -m 'Record Android 12.1.34 native diagnosis [skip ci]' || true
          git push
