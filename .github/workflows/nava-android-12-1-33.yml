name: Nava Android 12.1.33 hard layout fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-android-12-1-33.yml"
      - "android-patch/v12.1.33/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nava-android-12-1-33
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CERT_SHA256: acde7cf216852448a8a8277fe4bf11eac183394e6b34a862b124e693d51d09fe
      EXPECTED_SOURCE_SHA256: a9ea0408237bf185ae98d386c3ccf247639c80b4d75bd9f4494d0faa87aab8ad
      SOURCE_TAG: v12.1.32
      TARGET_TAG: v12.1.33
    steps:
      - uses: actions/checkout@v4
      - name: Prepare status
        run: printf 'status=running\nstarted=%s\n' "$(date -u +%FT%TZ)" > /tmp/nava-build-status.txt
      - name: Validate inputs
        run: |
          set -euo pipefail
          python -m py_compile android-patch/v12.1.33/patch-apk.py
          grep -q 'hard safe-area reset + compact shell' android-patch/v12.1.33/safe-area-fix.css
          grep -q "NEW_CODE=49" android-patch/v12.1.33/patch-apk.py
          printf 'source_validation=ok\nlayout=zero-webview-safe-insets+single-scroll+compact-bars\n' >> /tmp/nava-build-status.txt
      - name: Recover signing material
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          export NAVA_KDF_SECRET="$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | sha256sum | cut -d' ' -f1)"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in .github/nava-signing/private.pem.enc -out /tmp/nava-private.pem -pass env:NAVA_KDF_SECRET
          unset NAVA_KDF_SECRET
          openssl pkeyutl -decrypt -inkey /tmp/nava-private.pem -in android-signing/key-material.enc -out /tmp/key-material.bin -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          python - <<'PY'
          from pathlib import Path
          d=Path('/tmp/key-material.bin').read_bytes()
          if len(d)!=48: raise SystemExit('bad key material')
          Path('/tmp/aes-key').write_text(d[:32].hex()); Path('/tmp/aes-iv').write_text(d[32:].hex())
          PY
          openssl enc -d -aes-256-cbc -K "$(cat /tmp/aes-key)" -iv "$(cat /tmp/aes-iv)" -in android-signing/signing-payload.enc -out /tmp/signing.zip
          mkdir -p /tmp/nava-signing; unzip -q /tmp/signing.zip -d /tmp/nava-signing
          rm -f /tmp/nava-private.pem /tmp/key-material.bin /tmp/aes-key /tmp/aes-iv /tmp/signing.zip
          printf 'signing_material=ok\n' >> /tmp/nava-build-status.txt
      - name: Download stable 12.1.32
        run: |
          set -euo pipefail
          mkdir -p /tmp/current
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern Nava.apk --dir /tmp/current
          GOT="$(sha256sum /tmp/current/Nava.apk | cut -d' ' -f1)"
          test "$GOT" = "$EXPECTED_SOURCE_SHA256"
          printf 'source_apk=ok\nsource_sha256=%s\n' "$GOT" >> /tmp/nava-build-status.txt
      - name: Patch scoped APK
        run: |
          set -euo pipefail
          python android-patch/v12.1.33/patch-apk.py /tmp/current/Nava.apk android-patch/v12.1.33/safe-area-fix.css /tmp/Nava-unsigned.apk "$EXPECTED_SOURCE_SHA256" | tee /tmp/patch.txt
          grep -q 'PATCH_OK versionCode=49 versionName=12.1.33' /tmp/patch.txt
          unzip -p /tmp/Nava-unsigned.apk assets/nava_app_v11.css > /tmp/final.css
          unzip -p /tmp/Nava-unsigned.apk assets/nava_app_v11.js > /tmp/final.js
          node --check /tmp/final.js
          grep -q 'hard safe-area reset + compact shell' /tmp/final.css
          grep -q "appVersion:'12.1.33'" /tmp/final.js
          printf 'patch=ok\nfinal_js_syntax=ok\nscoped_entries=ok\n' >> /tmp/nava-build-status.txt
      - name: Align and sign
        shell: bash
        run: |
          set -euo pipefail
          set +x
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 /tmp/Nava-unsigned.apk /tmp/Nava-aligned.apk
          PROP=/tmp/nava-signing/keystore.properties
          export NAVA_STORE_PASS="$(sed -n 's/^storePassword=//p' "$PROP" | tr -d '\r' | head -1)"
          export NAVA_KEY_PASS="$(sed -n 's/^keyPassword=//p' "$PROP" | tr -d '\r' | head -1)"
          KEY_ALIAS="$(sed -n 's/^keyAlias=//p' "$PROP" | tr -d '\r' | head -1)"
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/nava-signing/signing/nava-release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:NAVA_STORE_PASS --key-pass env:NAVA_KEY_PASS --out /tmp/Nava.apk /tmp/Nava-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs /tmp/Nava.apk > /tmp/verify.txt
          CERT="$(grep -i -m1 'certificate SHA-256 digest:' /tmp/verify.txt | sed 's/.*digest:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$CERT" = "$EXPECTED_CERT_SHA256"
          printf 'zipalign=ok\nsigning=ok\ncert_sha256=%s\n' "$CERT" >> /tmp/nava-build-status.txt
          sha256sum /tmp/Nava.apk | awk '{print "apk_sha256="$1}' >> /tmp/nava-build-status.txt
      - name: Publish 12.1.33 latest
        run: |
          set -euo pipefail
          NOTES='WebView status/navigation bar alanını zaten dışarıda bıraktığı için Android CSS safe-area insetleri sıfırlandı. Üst bar 56px, alt navigasyon 68px sabitlendi; çift safe-area kaynaklı üst yükseklik ve alt ölü boşluk kaldırıldı. Sayfa tek document scroll kullanır. 12.1.32 site-native mavi stil, 12.1.31 offline indirme ve notification v2 altyapısı korunur.'
          if gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TARGET_TAG" /tmp/Nava.apk#Nava.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" --latest --title 'Nava 12.1.33' --notes "$NOTES"
          else
            gh release create "$TARGET_TAG" /tmp/Nava.apk#Nava.apk --repo "$GITHUB_REPOSITORY" --title 'Nava 12.1.33' --notes "$NOTES" --latest
          fi
          printf 'release=v12.1.33\nasset=Nava.apk\nstatus=success\nfinished=%s\n' "$(date -u +%FT%TZ)" >> /tmp/nava-build-status.txt
      - name: Persist status
        if: always()
        run: |
          if ! grep -q '^status=success$' /tmp/nava-build-status.txt 2>/dev/null; then printf 'status=failed\nfinished=%s\n' "$(date -u +%FT%TZ)" >> /tmp/nava-build-status.txt; fi
          cp /tmp/nava-build-status.txt android-build-status-12.1.33.txt
          git config user.name 'Nava Android Build Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add android-build-status-12.1.33.txt
          git commit -m 'Record Android 12.1.33 build status [skip ci]' || true
          git push || true
