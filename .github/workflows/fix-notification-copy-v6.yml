name: Update Nava notification copy
on:
  push:
    branches: [main]
    paths: [".github/workflows/fix-notification-copy-v6.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update site notification copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('notification-backend/scan.mjs')
          s=p.read_text()
          old='''    title: release.title,\n    url: release.url,\n    body: series.title,\n'''
          new='''    title: release.kind === "volume" ? "Yeni cilt geldi" : "Yeni bölüm geldi",\n    url: release.url,\n    body: series.title + " • " + release.title,\n'''
          if old not in s: raise SystemExit('notification payload target missing')
          p.write_text(s.replace(old,new,1))
          PY
          node --check notification-backend/scan.mjs
          git config user.name 'Nava Notification Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notification-backend/scan.mjs
          git commit -m 'Use clear cilt and bölüm notification copy'
          git push
