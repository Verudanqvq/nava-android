name: Nava Android 12.1.66
on:
  push:
    branches: [main]
    paths:
      - 'android-patch/v12.1.66/**'
      - '.github/scripts/nava-12.1.66-final.sh'
      - 'diagnostics/nava-12.1.66-release-trigger.txt'
  workflow_dispatch:
concurrency:
  group: nava-android-12-1-66
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and release signed APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: bash .github/scripts/nava-12.1.66-final.sh
      - name: Record build status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp /tmp/status66.txt android-build-status-12.1.66.txt || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android-build-status-12.1.66.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record Android 12.1.66 build [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
