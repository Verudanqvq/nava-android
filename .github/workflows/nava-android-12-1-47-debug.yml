name: Nava Android 12.1.47 pack debug
on:
  push:
    branches: [main]
    paths: [".github/workflows/nava-android-12-1-47-debug.yml"]
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SOURCE_SHA256: 8b73d9066df2dfe16cb41a4048001a3a5bd0d66748d822c45b867ffa2c48e752
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y smali >/dev/null
      - name: Prepare generated sources
        run: |
          mkdir -p /tmp/v12147
          sed -e 's/12\.1\.42/12.1.47/g' -e 's/V12142/V12147/g' -e 's/v12142/v12147/g' android-patch/v12.1.42/push-block.js > /tmp/v12147/push-block.js
          sed -e 's/12\.1\.42/12.1.47/g' -e 's/V12142/V12147/g' -e 's/v12142/v12147/g' android-patch/v12.1.42/compat-fix.js > /tmp/v12147/compat-fix.js
          sed -e 's/12\.1\.42/12.1.47/g' android-patch/v12.1.42/patch-smali.py > /tmp/v12147/patch-smali.py
      - name: Download and patch dex
        run: |
          mkdir -p /tmp/current /tmp/decoded/smali
          gh release download v12.1.41 --repo "$GITHUB_REPOSITORY" --pattern Nava.apk --dir /tmp/current
          test "$(sha256sum /tmp/current/Nava.apk | cut -d' ' -f1)" = "$EXPECTED_SOURCE_SHA256"
          unzip -p /tmp/current/Nava.apk classes.dex > /tmp/base.dex
          baksmali disassemble /tmp/base.dex -o /tmp/decoded/smali
          python /tmp/v12147/patch-smali.py /tmp/decoded
          smali assemble /tmp/decoded/smali -o /tmp/classes.dex
      - name: Capture pack result
        shell: bash
        run: |
          set +e
          python android-patch/v12.1.47/patch-apk.py /tmp/current/Nava.apk /tmp/classes.dex /tmp/v12147/push-block.js android-patch/v12.1.47/offline-ui.js android-patch/v12.1.47/download-menu.js /tmp/v12147/compat-fix.js android-patch/v12.1.47/language-filter.js android-patch/v12.1.47/app-ui.css android-patch/v12.1.47/offline.html /tmp/Nava-unsigned.apk "$EXPECTED_SOURCE_SHA256" > /tmp/debug.txt 2>&1
          RC=$?
          printf '\nexit_code=%s\n' "$RC" >> /tmp/debug.txt
          cat /tmp/debug.txt
          cp /tmp/debug.txt android-build-debug-12.1.47.txt
          git config user.name 'Nava Android Debug Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add android-build-debug-12.1.47.txt
          git commit -m 'Record Android 12.1.47 pack debug [skip ci]' || true
          git push || true
          exit 0
