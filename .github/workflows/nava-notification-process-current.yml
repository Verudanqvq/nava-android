name: Nava process current release once
on:
  push:
    branches: [main]
    paths: [".github/workflows/nava-notification-process-current.yml"]
permissions:
  contents: write
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      NAVA_TRIGGER: current-one-shot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: notification-backend
        run: npm install --omit=dev --no-audit --no-fund
      - name: Scan and retry now
        working-directory: notification-backend
        shell: bash
        run: |
          set -euo pipefail
          npm run scan | tee ../notification-process-current.txt
          node retry-push.mjs | tee -a ../notification-process-current.txt
      - name: Persist result
        run: |
          git config user.name 'Nava Current Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notification-process-current.txt
          git commit -m 'Record current release processing [skip ci]' || true
          git push
