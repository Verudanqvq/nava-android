name: Nava Android 12.2.25 Shared download limit fix
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-android-12-2-25.yml"
      - ".github/scripts/nava-12.2.25-final.sh"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nava-android-12-2-25
  cancel-in-progress: false
jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build, verify and publish 12.2.25 shared download limit
        run: bash .github/scripts/nava-12.2.25-final.sh
      - name: Preserve build status
        if: always()
        run: |
          if [ ! -f /tmp/status225.txt ]; then printf 'status=failed\nreason=build did not start\n' > /tmp/status225.txt; fi
          cp /tmp/status225.txt android-build-status-12.2.25.txt
          git config user.name 'Nava Android Build Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add android-build-status-12.2.25.txt
          git commit -m 'Record Android 12.2.25 build status [skip ci]' || true
          git push || true
