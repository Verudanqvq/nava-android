name: Nava gx inspect 12.1.33
on:
  push:
    branches: [main]
    paths: [".github/workflows/nava-gx-inspect-v12-1-33.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y smali >/dev/null
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nava /tmp/smali
          gh release download v12.1.33 --repo "$GITHUB_REPOSITORY" --pattern Nava.apk --dir /tmp/nava
          unzip -p /tmp/nava/Nava.apk classes.dex > /tmp/classes.dex
          baksmali disassemble /tmp/classes.dex -o /tmp/smali
          python - <<'PY' > gx-inspect-v12.1.33.txt
          from pathlib import Path
          s=Path('/tmp/smali/gx.smali').read_text()
          a=s.find('.method public final shouldInterceptRequest')
          b=s.find('.end method',a)
          print(s[a:b+11])
          PY
      - run: |
          git config user.name 'Nava GX Inspect Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gx-inspect-v12.1.33.txt
          git commit -m 'Record loader interceptor inspection [skip ci]' || true
          git push
