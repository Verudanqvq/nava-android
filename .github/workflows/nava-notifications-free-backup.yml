name: Nava notifications free backup

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nava-notifications-free-backup-v5
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        working-directory: notification-backend
        run: npm install --no-audit --no-fund
      - name: Scan Blogger releases
        working-directory: notification-backend
        run: npm run scan
      - name: Retry pending pushes
        if: always()
        working-directory: notification-backend
        run: node retry-push.mjs
