name: Inspect Nava 12.2.26 storage UI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect shipped UI assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v12.2.26 --repo "$GITHUB_REPOSITORY" --pattern Nava.apk --dir /tmp/nava-inspect
          python - <<'PY'
          import re, zipfile
          from pathlib import Path
          z=zipfile.ZipFile('/tmp/nava-inspect/Nava.apk')
          for name in ['assets/offline.html','assets/nava_app_v11.js']:
              try: s=z.read(name).decode('utf-8')
              except KeyError: print('MISSING_ASSET',name); continue
              print('===== ASSET',name,'LEN',len(s),'=====')
              patterns=[r'.{0,250}(?:storageAvailableBytes|freeBytes|totalBytes|storageLimitBytes|getStorageLimitBytes|getStorageInfo|setting-cap|cap\.max|storage|depolama|GB|gb).{0,350}']
              found=[]
              for pat in patterns:
                  found.extend(re.findall(pat,s,re.I|re.S))
              seen=set()
              for x in found:
                  x=re.sub(r'\\s+',' ',x)
                  if x not in seen:
                      seen.add(x); print(x[:650])
                      if len(seen)>=80: break
          PY
