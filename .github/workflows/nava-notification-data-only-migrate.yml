name: Nava notification data-only migrate

on:
  push:
    branches: [main]
    paths: [".github/workflows/nava-notification-data-only-migrate.yml"]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert scan and retry to data-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ['notification-backend/scan.mjs','notification-backend/retry-push.mjs']:
              p=Path(name); s=p.read_text()
              old=s
              s,n1=re.subn(r'\n\s*notification:\s*\{\s*title:\s*systemTitle,\s*body:\s*[^\n]+\s*\},', '', s, count=1)
              s,n2=re.subn(r',\s*notification:\s*\{\s*channelId:\s*"nava_follower_releases_v3",\s*tag:\s*notificationId\s*\}', '', s, count=1)
              if n1!=1 or n2!=1:
                  raise SystemExit(f'{name}: replace counts notification={n1} androidNotification={n2}')
              if 'notification: {' in s[s.find('sendEachForMulticast'):s.find('sendEachForMulticast')+1800]:
                  raise SystemExit(f'{name}: notification payload remains near send')
              if s==old: raise SystemExit(f'{name}: unchanged')
              p.write_text(s)
          PY
          node --check notification-backend/scan.mjs
          node --check notification-backend/retry-push.mjs
          grep -q 'priority: "high"' notification-backend/scan.mjs
          grep -q 'priority: "high"' notification-backend/retry-push.mjs
      - name: Commit migration
        run: |
          git config user.name 'Nava Notification Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notification-backend/scan.mjs notification-backend/retry-push.mjs
          git commit -m 'Use data-only FCM for native Android rendering [skip ci]'
          git push
