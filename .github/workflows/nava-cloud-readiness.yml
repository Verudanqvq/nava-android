name: Nava cloud readiness

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-cloud-readiness.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare service account file
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/nava-sa.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/nava-sa.json'))
          assert d.get('project_id')=='nava-01'
          print('service_account='+d.get('client_email',''))
          PY
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check project readiness
        shell: bash
        run: |
          set +e
          SA=$(python -c "import json;print(json.load(open('/tmp/nava-sa.json')).get('client_email',''))")
          {
            echo "checkedAt=$(date -u +%FT%TZ)"
            echo "project=nava-01"
            echo "serviceAccount=$SA"
            gcloud config set project nava-01 >/dev/null 2>&1
            if gcloud projects describe nava-01 >/dev/null 2>&1; then echo "projectAccess=ok"; else echo "projectAccess=fail"; fi
            BILL=$(gcloud beta billing projects describe nava-01 --format='value(billingEnabled)' 2>/dev/null)
            if [ "$BILL" = "True" ]; then echo "billingEnabled=true"; elif [ "$BILL" = "False" ]; then echo "billingEnabled=false"; else echo "billingEnabled=unknown"; fi
            ENABLED=$(gcloud services list --enabled --project nava-01 --format='value(config.name)' 2>/dev/null)
            for API in run.googleapis.com cloudscheduler.googleapis.com cloudfunctions.googleapis.com artifactregistry.googleapis.com cloudbuild.googleapis.com firebase.googleapis.com firestore.googleapis.com fcm.googleapis.com; do
              if printf '%s\n' "$ENABLED" | grep -qx "$API"; then echo "api:$API=enabled"; else echo "api:$API=disabled"; fi
            done
            ROLES=$(gcloud projects get-iam-policy nava-01 --flatten='bindings[].members' --filter="bindings.members:serviceAccount:$SA" --format='value(bindings.role)' 2>/dev/null | tr '\n' ',' | sed 's/,$//')
            if [ -n "$ROLES" ]; then echo "roles=$ROLES"; else echo "roles=unreadable-or-none"; fi
          } > nava-cloud-readiness.txt
          cat nava-cloud-readiness.txt
      - name: Persist sanitized result
        shell: bash
        run: |
          git config user.name 'Nava Cloud Readiness Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nava-cloud-readiness.txt
          git commit -m 'Record Nava cloud readiness [skip ci]' || true
          git push || true
