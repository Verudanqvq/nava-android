name: Nava Android 12.1.46 clean chrome repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-android-12-1-46.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nava-android-12-1-46
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CERT_SHA256: acde7cf216852448a8a8277fe4bf11eac183394e6b34a862b124e693d51d09fe
      EXPECTED_SOURCE_SHA256: 8b73d9066df2dfe16cb41a4048001a3a5bd0d66748d822c45b867ffa2c48e752
      SOURCE_TAG: v12.1.41
      TARGET_TAG: v12.1.46
    steps:
      - uses: actions/checkout@v4

      - name: Prepare status
        run: printf 'status=running\nstarted=%s\n' "$(date -u +%FT%TZ)" > /tmp/status.txt

      - name: Prepare clean 12.1.46 sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/v12146
          for f in offline-ui.js compat-fix.js offline-library.css push-block.js patch-smali.py patch-apk.py; do
            sed -e 's/12\.1\.42/12.1.46/g' -e 's/v12142/v12146/g' -e 's/V12142/V12146/g' "android-patch/v12.1.42/$f" > "/tmp/v12146/$f"
          done
          sed -i 's/NEW_CODE=58/NEW_CODE=62/' /tmp/v12146/patch-apk.py
          cp android-patch/v12.1.42/offline.html /tmp/v12146/offline.html
          cp android-patch/v12.1.46/download-menu.js /tmp/v12146/download-menu.js
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v12146/download-menu.js')
          s=p.read_text()
          s=s.replace('/* Nava Android 12.1.46 — compact download hub + persistent queue. */','/* Nava Android 12.1.46 — compact download hub. */',1)
          s=s.replace("function isReader(){return!!(d.body&&d.body.classList.contains('nava-app-reader'))}function isVolume(){return!!(d.body&&d.body.classList.contains('nava-app-volume'))}function isSeries(){return!!(d.body&&d.body.classList.contains('nava-app-series'))}","function isReader(){return!!(d.body&&d.body.classList.contains('nava-app-reader'))||!!d.querySelector('[data-nava-chapter-meta]')}function isVolume(){return!!(d.body&&d.body.classList.contains('nava-app-volume'))||(!isReader()&&!!containerTitle(d,''))}function isSeries(){return!!(d.body&&d.body.classList.contains('nava-app-series'))||(!isReader()&&!isVolume()&&!!d.querySelector('#chapters,#clwd,[data-nava-chapter-list],.eplister,.listupd'))}",1)
          old="function cleanup(){['nava-download-launcher-v12145','nava-offline-library-btn-v12131','nava-offline-reader-download-v12131','nava-offline-volume-btn-v12131'].forEach(function(id){var x=d.getElementById(id);if(x)x.remove()})}"
          new="function cleanup(){['nava-download-launcher-v12145','nava-download-btn-v12143','nava-download-menu-v12138','nava-download-menu-v12139','nava-download-menu-v12141','nava-download-menu-v12142','nava-download-menu-v12143','nava-download-menu-v12145','nava-download-center-v12143','nava-offline-library-btn-v12131','nava-offline-reader-download-v12131','nava-offline-volume-btn-v12131'].forEach(function(id){var x=d.getElementById(id);if(x)x.remove()});[].slice.call(d.querySelectorAll('[data-nava-download-inline],.nava-app-download-card,.nava-download-inline')).forEach(function(x){x.remove()})}"
          if old not in s: raise SystemExit('cleanup marker missing')
          s=s.replace(old,new,1)
          oldinit="function init(){cleanup();loadQueue();launcher();sheet();renderQueue();setTimeout(cleanup,300);setTimeout(cleanup,1200);w.addEventListener('pageshow',function(){cleanup();launcher();renderQueue()},{passive:true})}"
          newinit="function init(){cleanup();loadQueue();launcher();sheet();renderQueue();var mo=new MutationObserver(function(){cleanup();launcher()});mo.observe(d.body,{childList:true,subtree:true});setTimeout(cleanup,100);setTimeout(cleanup,500);w.addEventListener('pageshow',function(){cleanup();launcher();renderQueue()},{passive:true})}"
          if oldinit not in s: raise SystemExit('init marker missing')
          s=s.replace(oldinit,newinit,1)
          p.write_text(s)
          PY
          python -m py_compile /tmp/v12146/patch-smali.py /tmp/v12146/patch-apk.py
          node --check /tmp/v12146/push-block.js
          node --check /tmp/v12146/offline-ui.js
          node --check /tmp/v12146/download-menu.js
          node --check /tmp/v12146/compat-fix.js
          python - <<'PY'
          from pathlib import Path
          t=Path('/tmp/v12146/offline.html').read_text()
          assert '<h1>İndirilenler</h1>' in t
          assert 'data-series-delete' in t and 'data-volume-delete' in t
          start=t.index('<script>')+len('<script>');end=t.rindex('</script>')
          Path('/tmp/offline-page.js').write_text(t[start:end])
          PY
          node --check /tmp/offline-page.js
          grep -q "NEW_VERSION='12.1.46'" /tmp/v12146/patch-apk.py
          grep -q 'NEW_CODE=62' /tmp/v12146/patch-apk.py
          grep -q 'compact download hub' /tmp/v12146/download-menu.js
          grep -q 'nava-download-launcher-v12146' /tmp/v12146/download-menu.js
          grep -q 'MutationObserver' /tmp/v12146/download-menu.js
          ! grep -q 'nava-app-topbar' /tmp/v12146/download-menu.js
          ! grep -q 'nava-reader-top-v2' /tmp/v12146/download-menu.js
          grep -q 'position:fixed' /tmp/v12146/offline-library.css
          printf 'source_validation=ok\nfix=stable-12.1.41-base+topbar-untouched+fixed-download-launcher+legacy-inline-purge\n' >> /tmp/status.txt

      - name: Install smali tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y smali >/dev/null
          printf 'smali_tools=ok\n' >> /tmp/status.txt

      - name: Recover signing material
        shell: bash
        run: |
          set -euo pipefail
          set +x
          export NAVA_KDF_SECRET="$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | sha256sum | cut -d' ' -f1)"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in .github/nava-signing/private.pem.enc -out /tmp/nava-private.pem -pass env:NAVA_KDF_SECRET
          unset NAVA_KDF_SECRET
          openssl pkeyutl -decrypt -inkey /tmp/nava-private.pem -in android-signing/key-material.enc -out /tmp/key-material.bin -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          python - <<'PY'
          from pathlib import Path
          d=Path('/tmp/key-material.bin').read_bytes();assert len(d)==48
          Path('/tmp/aes-key').write_text(d[:32].hex());Path('/tmp/aes-iv').write_text(d[32:].hex())
          PY
          openssl enc -d -aes-256-cbc -K "$(cat /tmp/aes-key)" -iv "$(cat /tmp/aes-iv)" -in android-signing/signing-payload.enc -out /tmp/signing.zip
          mkdir -p /tmp/nava-signing; unzip -q /tmp/signing.zip -d /tmp/nava-signing
          rm -f /tmp/nava-private.pem /tmp/key-material.bin /tmp/aes-key /tmp/aes-iv /tmp/signing.zip
          printf 'signing_material=ok\n' >> /tmp/status.txt

      - name: Download known-good 12.1.41
        run: |
          set -euo pipefail
          mkdir -p /tmp/current
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern Nava.apk --dir /tmp/current
          GOT="$(sha256sum /tmp/current/Nava.apk | cut -d' ' -f1)"
          test "$GOT" = "$EXPECTED_SOURCE_SHA256"
          printf 'source_apk=ok\nsource_sha256=%s\n' "$GOT" >> /tmp/status.txt

      - name: Patch native UA
        run: |
          set -euo pipefail
          mkdir -p /tmp/decoded/smali
          unzip -p /tmp/current/Nava.apk classes.dex > /tmp/base.dex
          baksmali disassemble /tmp/base.dex -o /tmp/decoded/smali
          python /tmp/v12146/patch-smali.py /tmp/decoded | tee /tmp/smali.txt
          grep -q 'SMALI_PATCH_OK ua=12.1.46' /tmp/smali.txt
          smali assemble /tmp/decoded/smali -o /tmp/classes.dex
          printf 'native_hooks=preserved\nua=12.1.46\n' >> /tmp/status.txt

      - name: Pack and validate APK
        run: |
          set -euo pipefail
          python /tmp/v12146/patch-apk.py /tmp/current/Nava.apk /tmp/classes.dex /tmp/v12146/push-block.js /tmp/v12146/offline-ui.js /tmp/v12146/download-menu.js /tmp/v12146/compat-fix.js /tmp/v12146/offline-library.css /tmp/v12146/offline.html /tmp/Nava-unsigned.apk "$EXPECTED_SOURCE_SHA256" | tee /tmp/patch.txt
          grep -q 'PATCH_OK versionCode=62 versionName=12.1.46' /tmp/patch.txt
          unzip -p /tmp/Nava-unsigned.apk assets/nava_app_v11.js > /tmp/final.js
          unzip -p /tmp/Nava-unsigned.apk assets/nava_app_v11.css > /tmp/final.css
          unzip -p /tmp/Nava-unsigned.apk assets/offline.html > /tmp/final-offline.html
          node --check /tmp/final.js
          grep -q 'nava-download-launcher-v12146' /tmp/final.js
          grep -q 'nava-download-hub-v12146' /tmp/final.js
          grep -q 'nava-download-menu-v12141' /tmp/final.js
          grep -q '#nava-download-menu-v12141' /tmp/final.css
          grep -q '.nava-download-launcher-v12146{position:fixed' /tmp/final.css
          ! grep -q 'nava-app-topbar' /tmp/v12146/download-menu.js
          ! grep -q 'nava-reader-top-v2' /tmp/v12146/download-menu.js
          ! grep -q 'Bu cildi tamamen indir' /tmp/final.js
          ! grep -q 'Tüm ciltleri indir' /tmp/final.js
          printf 'pack=ok\njs=ok\ncss=ok\ntopbar=untouched\nlegacy_inline=purged\ndownload_launcher=fixed\nvolume_navigation=preserved\nscoped=ok\n' >> /tmp/status.txt

      - name: Align and sign
        shell: bash
        run: |
          set -euo pipefail
          set +x
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 /tmp/Nava-unsigned.apk /tmp/Nava-aligned.apk
          PROP=/tmp/nava-signing/keystore.properties
          export NAVA_STORE_PASS="$(sed -n 's/^storePassword=//p' "$PROP" | tr -d '\r' | head -1)"
          export NAVA_KEY_PASS="$(sed -n 's/^keyPassword=//p' "$PROP" | tr -d '\r' | head -1)"
          KEY_ALIAS="$(sed -n 's/^keyAlias=//p' "$PROP" | tr -d '\r' | head -1)"
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/nava-signing/signing/nava-release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:NAVA_STORE_PASS --key-pass env:NAVA_KEY_PASS --out /tmp/Nava.apk /tmp/Nava-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs /tmp/Nava.apk > /tmp/verify.txt
          CERT="$(grep -i -m1 'certificate SHA-256 digest:' /tmp/verify.txt | sed 's/.*digest:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$CERT" = "$EXPECTED_CERT_SHA256"
          printf 'zipalign=ok\nsigning=ok\ncert_sha256=%s\n' "$CERT" >> /tmp/status.txt
          sha256sum /tmp/Nava.apk | awk '{print "apk_sha256="$1}' >> /tmp/status.txt

      - name: Publish 12.1.46
        run: |
          set -euo pipefail
          NOTES='12.1.46, bozuk 12.1.45 üzerine yama yapmak yerine çalışan 12.1.41 APK tabanından temiz üretildi. İndirme sistemi mevcut üst bara hiçbir öğe eklemez veya üst bar sırasını değiştirmez. Eski indirme düğmeleri, eski menüler ve sayfa içine düşen büyük indirme blokları temizlenir. İndirme erişimi yalnızca ekranın sağ altında küçük sabit Nava indirme ikonudur; dokununca kompakt panel açılır ve sayfaya göre Bölümü indir, Cildi indir veya Eseri indir ile İndirilenler gösterilir. Eser → Cilt → Bölüm indirilenler düzeni ve grup silme korunur.'
          gh release create "$TARGET_TAG" /tmp/Nava.apk#Nava.apk --repo "$GITHUB_REPOSITORY" --title 'Nava 12.1.46' --notes "$NOTES" --latest
          printf 'release=v12.1.46\nasset=Nava.apk\nstatus=success\nfinished=%s\n' "$(date -u +%FT%TZ)" >> /tmp/status.txt

      - name: Persist status
        if: always()
        run: |
          if ! grep -q '^status=success$' /tmp/status.txt 2>/dev/null; then printf 'status=failed\nfinished=%s\n' "$(date -u +%FT%TZ)" >> /tmp/status.txt; fi
          cp /tmp/status.txt android-build-status-12.1.46.txt
          git config user.name 'Nava Android Build Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add android-build-status-12.1.46.txt
          git commit -m 'Record Android 12.1.46 build [skip ci]' || true
          git push || true
