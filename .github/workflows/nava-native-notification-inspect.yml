name: Nava native notification inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-native-notification-inspect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download latest Nava APK
        shell: bash
        run: |
          mkdir -p /tmp/nava
          gh release download v12.1.28 --repo "$GITHUB_REPOSITORY" --pattern Nava.apk --dir /tmp/nava
          test -s /tmp/nava/Nava.apk
      - name: Download JADX and decompile
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/jadxdl /tmp/jadxout
          gh release download --repo skylot/jadx --pattern 'jadx-*.zip' --dir /tmp/jadxdl --clobber
          ZIP="$(find /tmp/jadxdl -name 'jadx-*.zip' | head -1)"
          unzip -q "$ZIP" -d /tmp/jadx
          JADX="$(find /tmp/jadx -type f -path '*/bin/jadx' | head -1)"
          chmod +x "$JADX"
          "$JADX" --no-res -d /tmp/jadxout /tmp/nava/Nava.apk >/tmp/jadx.log 2>&1 || true
          MAIN=/tmp/jadxout/sources/com/verudanava/nava/MainActivity.java
          SVC=/tmp/jadxout/sources/com/verudanava/nava/NavaFirebaseMessagingService.java
          {
            echo '=== MAINACTIVITY PERMISSION FLOW ==='
            grep -nE 'POST_NOTIFICATIONS|nava_notification_permission|requestPermission|shouldShowRequestPermissionRationale' "$MAIN" || true
            sed -n '285,335p' "$MAIN" || true
            echo
            echo '=== NAVA FCM SERVICE ==='
            sed -n '1,210p' "$SVC" || true
          } > /tmp/native-permission.txt
      - name: Persist permission inspection
        if: always()
        shell: bash
        run: |
          test -f /tmp/native-permission.txt || echo 'permission inspect failed' > /tmp/native-permission.txt
          cp /tmp/native-permission.txt native-notification-permission.txt
          git config user.name 'Nava Native Inspect Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-notification-permission.txt
          git commit -m 'Record native notification permission inspection [skip ci]' || true
          git push || true
