name: Nava notification channel v3 migrate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nava-notification-v3-migrate.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Switch backend notification channel to v3
        run: |
          set -euo pipefail
          grep -q 'nava_follower_releases_v2' notification-backend/scan.mjs
          grep -q 'nava_follower_releases_v2' notification-backend/retry-push.mjs
          sed -i 's/nava_follower_releases_v2/nava_follower_releases_v3/g' notification-backend/scan.mjs notification-backend/retry-push.mjs
          node --check notification-backend/scan.mjs
          node --check notification-backend/retry-push.mjs
          grep -q 'nava_follower_releases_v3' notification-backend/scan.mjs
          grep -q 'nava_follower_releases_v3' notification-backend/retry-push.mjs
          ! grep -q 'nava_follower_releases_v2' notification-backend/scan.mjs
          ! grep -q 'nava_follower_releases_v2' notification-backend/retry-push.mjs
      - name: Commit migration
        run: |
          git config user.name 'Nava Notification Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notification-backend/scan.mjs notification-backend/retry-push.mjs
          git commit -m 'Use notification channel v3 [skip ci]'
          git push
