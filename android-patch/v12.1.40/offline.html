<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>İndirilenler</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b1120;color:#e5e7eb}body{padding:calc(16px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom))}.app{max-width:720px;margin:0 auto}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}.head-copy{min-width:0}.head h1{margin:0;font-size:22px;line-height:1.15;color:#f8fafc}.head p{margin:5px 0 0;font-size:12px;line-height:1.45;color:#94a3b8}.refresh{flex:0 0 auto;min-height:40px;padding:0 13px;border:1px solid #40536c;border-radius:10px;background:#172033;color:#dce8f7;font-weight:800}.refresh:active{background:#223149}.summary{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:38px;margin-bottom:10px;padding:8px 10px;border:1px solid #29364a;border-radius:10px;background:#111827;color:#aebed0;font-size:11.5px}.summary strong{color:#e5edf6;font-size:12px}.search{width:100%;height:42px;margin:0 0 12px;padding:0 12px;border:1px solid #334155;border-radius:10px;outline:0;background:#111827;color:#f8fafc;font-size:13px}.search::placeholder{color:#718198}.search:focus{border-color:#6f8fb8;box-shadow:0 0 0 2px rgba(91,120,166,.16)}.status{min-height:0;margin:0 2px 9px;color:#9fb0c3;font-size:11.5px}.status:empty{display:none}.library{display:grid;gap:12px}.series{overflow:hidden;border:1px solid #29364a;border-radius:14px;background:#0f172a}.series-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-bottom:1px solid #29364a;background:#111827}.series-head strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#eef4fa;font-size:14px}.series-head span{flex:0 0 auto;color:#8294a8;font-size:10.5px}.volume{padding:10px 10px 3px}.volume+.volume{border-top:1px solid #223044}.volume-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 8px}.volume-head strong{color:#b9cce1;font-size:11.5px}.volume-head span{color:#71839a;font-size:10px}.items{display:grid;gap:7px}.item{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:9px;min-height:58px;padding:8px;border:1px solid #253449;border-radius:10px;background:#111827}.kind{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;background:#1b2a3d;color:#a9c0db;font-weight:900;font-size:11px}.copy{min-width:0}.title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f3f6fa;font-size:12.5px;font-weight:800}.meta{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:3px;color:#8192a5;font-size:10.2px}.dot:before{content:'•';margin-right:5px;color:#51657c}.actions{display:flex;align-items:center;gap:6px}.open,.del{min-height:36px;border-radius:9px;font-weight:800}.open{padding:0 12px;border:1px solid #6f8fb8;background:#466184;color:#fff}.open:active{background:#3b536f}.del{width:38px;border:1px solid #3b485a;background:#182231;color:#f0a6a6;font-size:15px}.del:active{background:#312027}.empty,.noBridge{padding:28px 18px;border:1px dashed #334155;border-radius:14px;text-align:center;color:#8ea0b5;font-size:12px;line-height:1.5}.empty strong,.noBridge strong{display:block;margin-bottom:5px;color:#dce5ef;font-size:14px}.noBridge{border-style:solid;border-color:#5a3434;background:#241719;color:#efb0b0}@media(max-width:460px){.head{align-items:center}.head h1{font-size:20px}.head p{font-size:11.5px}.item{grid-template-columns:34px minmax(0,1fr) auto;gap:7px}.kind{width:34px;height:34px}.open{padding:0 10px}.del{width:36px}.series-head{align-items:flex-start}.series-head span{margin-top:2px}}@media(max-width:350px){.item{grid-template-columns:32px minmax(0,1fr)}.kind{width:32px;height:32px}.actions{grid-column:2;justify-content:flex-end}.open{min-width:72px}}
</style>
</head>
<body>
<main class="app">
  <header class="head">
    <div class="head-copy"><h1>İndirilenler</h1><p>Kaydettiğin cilt ve bölümleri internet olmadan buradan okuyabilirsin.</p></div>
    <button class="refresh" id="refresh" type="button">Yenile</button>
  </header>
  <div class="summary" id="summary"><strong>İndirilen içerikler</strong><span>Hazırlanıyor…</span></div>
  <input class="search" id="search" type="search" inputmode="search" autocomplete="off" placeholder="İndirilenlerde ara">
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="library" id="library"></div>
</main>
<script>
(function(){
'use strict';
var N=window.NavaOffline,L=document.getElementById('library'),S=document.getElementById('status'),Q=document.getElementById('search'),M=document.getElementById('summary'),R=document.getElementById('refresh');
var all=[];
function clean(v){return String(v==null?'':v).replace(/\s+/g,' ').trim()}
function esc(v){return clean(v).replace(/[&<>\"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){n=Number(n)||0;if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(2)+' GB'}
function when(ms){var n=Number(ms)||0;if(!n)return'';try{return new Date(n).toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}catch(_){return''}}
function stripRelease(v){return clean(v).replace(/\s*(?:[-–—|:]\s*)?(?:cilt|volume|vol\.?|bölüm|bolum|chapter|ch\.?)\s*\d+(?:\s*[-–—|:].*)?$/i,'').trim()}
function seriesName(i){var s=clean(i.seriesTitle);if(!s||/^nava$/i.test(s))s='';var root=stripRelease(s||i.title);if(root&&root.length>2)return root;if(s)return s;return'Diğer indirilenler'}
function volumeName(i){var src=clean(i.seriesTitle)+' '+clean(i.title),m=src.match(/(?:cilt|volume|vol\.?)\s*([0-9]+(?:\.[0-9]+)?)/i);if(m)return'Cilt '+m[1];if(String(i.kind||'').toLowerCase()==='volume')return'Cilt';return'Bölümler'}
function kindName(i){var k=String(i.kind||'').toLowerCase();if(k==='volume')return'Cilt';if(k==='chapter')return'Bölüm';return'İçerik'}
function kindMark(i){return kindName(i)==='Cilt'?'C':'B'}
function groups(items){var map=new Map();items.forEach(function(i){var sn=seriesName(i),vn=volumeName(i);if(!map.has(sn))map.set(sn,{name:sn,volumes:new Map(),bytes:0,count:0});var g=map.get(sn);if(!g.volumes.has(vn))g.volumes.set(vn,[]);g.volumes.get(vn).push(i);g.bytes+=Number(i.bytes)||0;g.count++});return Array.from(map.values())}
function row(i){var date=when(i.downloadedAt),meta='<span>'+esc(kindName(i))+'</span>'+(date?'<span class="dot">'+esc(date)+'</span>':'')+'<span class="dot">'+esc(fmt(i.bytes||0))+'</span>';return'<article class="item"><span class="kind">'+kindMark(i)+'</span><div class="copy"><strong class="title">'+esc(i.title||kindName(i))+'</strong><div class="meta">'+meta+'</div></div><div class="actions"><button class="open" type="button" data-open="'+esc(i.url)+'">Oku</button><button class="del" type="button" aria-label="İndirmeyi sil" data-del="'+esc(i.url)+'">×</button></div></article>'}
function draw(){var q=clean(Q.value).toLocaleLowerCase('tr-TR'),items=all.filter(function(i){return!q||(clean(i.title)+' '+clean(i.seriesTitle)+' '+seriesName(i)+' '+volumeName(i)).toLocaleLowerCase('tr-TR').indexOf(q)>=0});if(!items.length){L.innerHTML='<div class="empty"><strong>'+(all.length?'Sonuç bulunamadı':'Henüz indirme yok')+'</strong>'+(all.length?'Başka bir adla aramayı dene.':'Bir bölüm veya cildi indirdiğinde burada düzenli şekilde görünecek.')+'</div>';return}L.innerHTML=groups(items).map(function(g){var vols=Array.from(g.volumes.entries()).map(function(v){var a=v[1].slice().sort(function(x,y){return(Number(y.downloadedAt)||0)-(Number(x.downloadedAt)||0)});return'<section class="volume"><div class="volume-head"><strong>'+esc(v[0])+'</strong><span>'+a.length+' içerik</span></div><div class="items">'+a.map(row).join('')+'</div></section>'}).join('');return'<section class="series"><header class="series-head"><strong>'+esc(g.name)+'</strong><span>'+g.count+' içerik • '+esc(fmt(g.bytes))+'</span></header>'+vols+'</section>'}).join('')}
window.renderDownloads=function(){if(!N){M.innerHTML='<strong>İndirilen içerikler</strong><span>—</span>';L.innerHTML='<div class="noBridge"><strong>İndirilenler açılamadı</strong>Uygulamayı kapatıp yeniden aç.</div>';return}try{var x=JSON.parse(N.listDownloads()||'{}');all=Array.isArray(x.items)?x.items:[];all.sort(function(a,b){return(Number(b.downloadedAt)||0)-(Number(a.downloadedAt)||0)});M.innerHTML='<strong>İndirilen içerikler</strong><span>'+all.length+' içerik • '+esc(fmt(x.storageBytes||0))+'</span>';S.textContent='';draw()}catch(e){S.textContent='İndirilen içerikler okunamadı.'}}
Q.addEventListener('input',draw);R.addEventListener('click',window.renderDownloads);L.addEventListener('click',function(e){var b=e.target.closest('button');if(!b||!N)return;var open=b.getAttribute('data-open'),del=b.getAttribute('data-del');if(open){N.open(open);return}if(del){b.disabled=true;S.textContent='Siliniyor…';N.delete(del)}});window.navaOfflineNativeEvent=function(e){e=e||{};if(e.type==='deleted'){S.textContent='';window.renderDownloads()}else if(e.type==='error'){S.textContent=e.message||'İşlem başarısız.'}};window.renderDownloads();
})();
</script>
</body>
</html>
