<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>İndirilenler</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f8fafc;color:#1f2937}.app{min-height:100dvh;display:grid;grid-template-rows:auto auto auto auto minmax(0,1fr)}.head{display:grid;grid-template-columns:38px minmax(0,1fr) 38px;align-items:center;gap:8px;min-height:58px;padding:env(safe-area-inset-top) 10px 0;border-bottom:1px solid #dce4ee;background:#fff}.head>div{min-width:0;display:grid;gap:1px}.head strong{font-size:16px;color:#1f2d40}.head span{font-size:10px;color:#8291a4}.head button{width:36px;height:36px;border:0;border-radius:9px;background:#eef3f8;color:#526982;font-size:20px}.head .back{font-size:24px}.settings{padding:8px 10px;border-bottom:1px solid #e2e8f0;background:#fff}.settings[hidden]{display:none}.settings button{width:100%;min-height:38px;padding:0 10px;border:1px solid #dce4ee;border-radius:8px;background:#f8fafc;color:#41556d;text-align:left;font-size:11.5px;font-weight:750}.search{padding:9px 10px 7px}.search input{width:100%;height:40px;padding:0 12px;border:1px solid #d6e0eb;border-radius:10px;outline:0;background:#fff;color:#233349;font-size:12.5px}.status{min-height:0;padding:0 12px 7px;color:#718197;font-size:10.5px}.status:empty{display:none}.tree{min-height:0;overflow:auto;padding:0 10px calc(18px + env(safe-area-inset-bottom))}.series{border-bottom:1px solid #dfe6ef;background:#fff}.series:first-child{border-radius:11px 11px 0 0}.series:last-child{border-radius:0 0 11px 11px}.group{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 40px;min-height:54px}.group.volume{min-height:48px;border-top:1px solid #edf1f5;background:#f9fbfd}.toggle{min-width:0;display:grid;grid-template-columns:18px minmax(0,1fr);align-items:center;gap:7px;padding:0 7px 0 11px;border:0;background:transparent;color:#26374c;text-align:left}.toggle>span:last-child{min-width:0;display:grid;gap:1px}.toggle strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.group.volume .toggle strong{font-size:12px}.toggle small{font-size:9.5px;color:#8a98aa}.chev{font-size:19px;color:#8497ab;transition:transform .15s}.toggle[aria-expanded=true]>.chev{transform:rotate(90deg)}.more{width:40px;border:0;background:transparent;color:#8292a4;font-size:19px}.seriesbody[hidden],.volbody[hidden]{display:none}.volume-sec{background:#f9fbfd}.volbody{padding:0 0 3px 25px}.file{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 40px;min-height:44px;border-top:1px solid #edf1f5;background:#fff}.fileopen{min-width:0;display:grid;grid-template-columns:24px minmax(0,1fr);align-items:center;gap:7px;padding:0 5px 0 9px;border:0;background:transparent;color:#34465b;text-align:left}.fileopen>span:last-child{min-width:0;display:grid;gap:1px}.fileopen strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}.fileopen small{font-size:9px;color:#93a0af}.ico{width:21px;height:21px;display:grid;place-items:center;border-radius:6px;background:#edf3fa;color:#6684a7;font-size:9px;font-weight:900}.menu{position:absolute;z-index:50;right:6px;top:calc(100% - 5px);min-width:132px;overflow:hidden;border:1px solid #ccd7e3;border-radius:9px;background:#fff;box-shadow:0 10px 28px rgba(15,23,42,.18)}.menu button{width:100%;min-height:38px;padding:0 11px;border:0;background:#fff;color:#42556c;text-align:left;font-size:11.5px}.menu button.danger{color:#b85c5c}.empty{padding:36px 16px;border:1px dashed #cbd5e1;border-radius:11px;text-align:center;color:#8594a6}.empty strong{display:block;margin-bottom:4px;color:#44566d;font-size:13px}.empty span{font-size:11px}@media(prefers-color-scheme:dark){html,body,.tree,.search,.status{background:#111827;color:#dbe3ee}.head,.settings,.series,.group,.file{background:#172033;border-color:#334155}.group.volume,.volume-sec,.volbody{background:#141e2c;border-color:#334155}.search input,.settings button,.menu,.menu button{background:#1f2937;border-color:#334155;color:#e5edf6}.head strong,.toggle,.fileopen{color:#edf3fa}.menu button.danger{color:#f0aaaa}}
</style></head><body><main class="app"><header class="head"><button class="back" id="back" type="button">‹</button><div><strong>İndirilenler</strong><span id="summary">0 içerik</span></div><button id="settingsBtn" type="button">⋯</button></header><div class="settings" id="settings" hidden><button id="wifi" type="button"></button></div><div class="search"><input id="search" type="search" autocomplete="off" placeholder="Eser veya bölüm ara"></div><div class="status" id="status"></div><div class="tree" id="tree"></div></main><script>
(function(){'use strict';var N=window.NavaOffline,S=document.getElementById('summary'),Q=document.getElementById('search'),T=document.getElementById('tree'),ST=document.getElementById('status'),SET=document.getElementById('settings'),W=document.getElementById('wifi'),all=[],so=Object.create(null),vo=Object.create(null),bulk=null;function clean(v,n){return String(v==null?'':v).replace(/\s+/g,' ').trim().slice(0,n||500)}function key(v){return clean(v).toLocaleLowerCase('tr-TR')}function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function fmt(n){n=Number(n)||0;if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(2)+' GB'}function slug(url){try{return clean(decodeURIComponent(new URL(String(url||'')).pathname.split('/').filter(Boolean).pop()||'').replace(/\.html?$/i,'').replace(/[-_]+/g,' '),400)}catch(_){return''}}function junk(v){var x=key(v);return !x||['nava','bölüm','bolum','chapter','cilt','volume','içerik'].indexOf(x)>=0}function num(text,vol){var r=vol?/(?:cilt|volume|vol\.?)\s*([0-9]+(?:\.[0-9]+)?)/i:/(?:bölüm|bolum|chapter|ch\.?|episode|ep\.?)\s*([0-9]+(?:\.[0-9]+)?)/i,m=clean(text,900).match(r);return m?m[1]:''}function strip(v){return clean(v,500).replace(/\s*(?:[-–—|:]\s*)?(?:cilt|volume|vol\.?|bölüm|bolum|chapter|ch\.?|episode|ep\.?)\s*\d+(?:\.\d+)?(?:\s*[-–—|:].*)?$/i,'').trim()}function pretty(v){return clean(v).split(' ').map(function(x){return x?x.charAt(0).toLocaleUpperCase('tr-TR')+x.slice(1):''}).join(' ')}function meta(i){i=i||{};var st=clean(i.seriesTitle),tt=clean(i.title),sl=slug(i.url),mix=[st,tt,sl].join(' '),vn=num(mix,true),cn=num(mix,false),k=String(i.kind||'').toLowerCase(),series='';if(!junk(st))series=strip(st);if(!series||junk(series)){var x=strip(sl);if(x&&!junk(x))series=pretty(x)}if((!series||junk(series))&&!junk(tt))series=strip(tt);if(!series||junk(series))series='Diğer';var volume=vn?'Cilt '+vn:(k==='volume'?'Cilt':'Bölümler'),title=tt;if(junk(title))title=cn?'Bölüm '+cn:(k==='volume'?(vn?'Cilt '+vn:'Cilt'):'Bölüm');return{series:series,volume:volume,title:title,cn:cn,kind:k}}function groups(items){var sm=new Map();items.forEach(function(i){var m=meta(i);if(!sm.has(m.series))sm.set(m.series,{name:m.series,items:[],bytes:0,vols:new Map()});var s=sm.get(m.series);s.items.push(i);s.bytes+=Number(i.bytes)||0;if(!s.vols.has(m.volume))s.vols.set(m.volume,{name:m.volume,items:[],bytes:0});var v=s.vols.get(m.volume);v.items.push({i:i,m:m});v.bytes+=Number(i.bytes)||0});return Array.from(sm.values())}function closeMenus(){document.querySelectorAll('.menu').forEach(function(x){x.remove()})}function menu(a,items){closeMenus();var m=document.createElement('div');m.className='menu';items.forEach(function(it){var b=document.createElement('button');b.type='button';b.textContent=it.label;if(it.danger)b.className='danger';b.onclick=function(e){e.stopPropagation();closeMenus();it.run()};m.append(b)});a.parentElement.append(m);setTimeout(function(){document.addEventListener('click',closeMenus,{once:true})},0)}function uniq(items){var seen={},out=[];(items||[]).forEach(function(i){var u=clean(i&&i.url,2000);if(u&&!seen[u]){seen[u]=1;out.push(u)}});return out}function startDelete(items,label){var urls=uniq(items);if(!urls.length)return;if(!confirm(label+' silinsin mi?'))return;bulk={q:urls.slice(),done:0,total:urls.length};ST.textContent='Siliniyor 0/'+urls.length;nextDelete()}function nextDelete(){if(!bulk)return;if(!bulk.q.length){bulk=null;ST.textContent='Silindi.';renderDownloads();return}N.delete(bulk.q.shift())}function row(x){return'<div class="file"><button class="fileopen" data-open="'+esc(x.i.url)+'"><span class="ico">#</span><span><strong>'+esc(x.m.title)+'</strong><small>'+(x.m.kind==='volume'?'Cilt sayfası':'Bölüm')+(x.i.bytes?' • '+fmt(x.i.bytes):'')+'</small></span></button><button class="more" data-file-menu="'+esc(x.i.url)+'">⋯</button></div>'}function draw(){var q=key(Q.value),items=all.filter(function(i){if(!q)return true;var m=meta(i);return[m.series,m.volume,m.title].join(' ').toLocaleLowerCase('tr-TR').indexOf(q)>=0});T.innerHTML='';closeMenus();if(!items.length){T.innerHTML='<div class="empty"><strong>'+(all.length?'Sonuç yok':'Henüz indirme yok')+'</strong><span>'+(all.length?'Aramayı değiştir.':'İndirdiğin eserler burada görünecek.')+'</span></div>';return}T.innerHTML=groups(items).map(function(s){var sk=key(s.name),os=q||so[sk],vols=Array.from(s.vols.values()).map(function(v){var vk=sk+'|'+key(v.name),ov=q||vo[vk];v.items.sort(function(a,b){var an=Number(a.m.cn)||0,bn=Number(b.m.cn)||0;return an&&bn?an-bn:0});return'<section class="volume-sec"><div class="group volume"><button class="toggle" data-volume="'+esc(vk)+'" aria-expanded="'+(ov?'true':'false')+'"><span class="chev">›</span><span><strong>'+esc(v.name)+'</strong><small>'+v.items.length+' içerik • '+fmt(v.bytes)+'</small></span></button><button class="more" data-volume-delete="'+esc(vk)+'">⋯</button></div><div class="volbody" '+(ov?'':'hidden')+'>'+v.items.map(row).join('')+'</div></section>'}).join('');return'<section class="series"><div class="group"><button class="toggle" data-series="'+esc(sk)+'" aria-expanded="'+(os?'true':'false')+'"><span class="chev">›</span><span><strong>'+esc(s.name)+'</strong><small>'+s.items.length+' içerik • '+fmt(s.bytes)+'</small></span></button><button class="more" data-series-delete="'+esc(sk)+'">⋯</button></div><div class="seriesbody" '+(os?'':'hidden')+'>'+vols+'</div></section>'}).join('')}window.renderDownloads=function(){if(!N){T.innerHTML='<div class="empty"><strong>İndirilenler açılamadı</strong><span>Uygulamayı yeniden aç.</span></div>';return}try{var x=JSON.parse(N.listDownloads()||'{}');all=Array.isArray(x.items)?x.items:[];S.textContent=all.length+' içerik • '+fmt(x.storageBytes||0);ST.textContent='';W.textContent='Yalnız Wi‑Fi ile indir '+(N.getWifiOnly()===true?'✓':'');draw()}catch(_){ST.textContent='İndirilenler okunamadı.'}};Q.oninput=draw;document.getElementById('settingsBtn').onclick=function(){SET.hidden=!SET.hidden};W.onclick=function(){N.setWifiOnly(!(N.getWifiOnly()===true));window.renderDownloads()};document.getElementById('back').onclick=function(){try{history.back()}catch(_){}};T.onclick=function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.series){so[b.dataset.series]=!so[b.dataset.series];draw();return}if(b.dataset.volume){vo[b.dataset.volume]=!vo[b.dataset.volume];draw();return}if(b.dataset.open){N.open(b.dataset.open);return}if(b.dataset.fileMenu){var item=all.find(function(i){return i.url===b.dataset.fileMenu});if(item)menu(b,[{label:'Sil',danger:true,run:function(){startDelete([item],meta(item).title)}}]);return}if(b.dataset.seriesDelete){var ss=b.dataset.seriesDelete,arr=all.filter(function(i){return key(meta(i).series)===ss});menu(b,[{label:'Eseri sil',danger:true,run:function(){startDelete(arr,meta(arr[0]||{}).series||'Eser')}}]);return}if(b.dataset.volumeDelete){var parts=b.dataset.volumeDelete.split('|'),arr2=all.filter(function(i){var m=meta(i);return key(m.series)===parts[0]&&key(m.volume)===parts.slice(1).join('|')});menu(b,[{label:'Cildi sil',danger:true,run:function(){startDelete(arr2,meta(arr2[0]||{}).volume||'Cilt')}}])}};window.navaOfflineNativeEvent=function(e){e=e||{};if(e.type==='deleted'){if(bulk){bulk.done++;ST.textContent='Siliniyor '+bulk.done+'/'+bulk.total;nextDelete()}else window.renderDownloads()}else if(e.type==='error'){bulk=null;ST.textContent=e.message||'İşlem başarısız.'}};window.renderDownloads()})();
</script></body></html>
