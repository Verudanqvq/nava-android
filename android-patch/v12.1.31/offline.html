<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nava • İndirilenler</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1120;color:#e5e7eb}body{padding:calc(18px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}.w{max-width:680px;margin:0 auto}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.logo{width:48px;height:48px;border-radius:14px;background:#c6dafc;color:#2f4666;display:grid;place-items:center;font-size:22px;font-weight:900}.top h1{font-size:21px;margin:0}.top p{font-size:12px;color:#94a3b8;margin:2px 0 0}.bar{display:flex;gap:8px;align-items:center;margin-bottom:14px}.bar button{flex:1;min-height:44px;border:1px solid #334155;border-radius:12px;background:#1e293b;color:#e2e8f0;font-weight:750}.bar button.primary{background:#6d28d9;border-color:#7c3aed;color:#fff}.pref{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:12px;border:1px solid #29364a;border-radius:12px;background:#111827;font-size:13px}.pref input{width:18px;height:18px;accent-color:#8b5cf6}.status{min-height:18px;color:#94a3b8;font-size:12px;margin:6px 2px 10px}.list{display:grid;gap:10px}.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid #29364a;background:#111827;border-radius:14px;padding:12px}.copy{display:grid;gap:3px;min-width:0}.copy strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:#f8fafc}.copy span{font-size:11px;color:#94a3b8}.actions{display:flex;gap:6px}.actions button{min-height:38px;border:1px solid #334155;border-radius:10px;background:#1e293b;color:#e2e8f0;font-weight:750}.actions .open{background:#6d28d9;color:#fff;border-color:#7c3aed;padding:0 14px}.actions .del{color:#fca5a5;width:42px}.empty{text-align:center;border:1px dashed #334155;border-radius:16px;padding:30px 18px;color:#94a3b8}.empty strong{display:block;color:#e2e8f0;margin-bottom:6px}.noBridge{padding:12px;border-radius:12px;background:#3f1d1d;color:#fecaca;font-size:12px}@media(max-width:520px){.card{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr 42px}.actions .open{width:100%}}</style></head><body><main class="w"><div class="top"><div class="logo">N</div><div><h1>Çevrimdışısın</h1><p>İndirdiğin bölümleri internetsiz okumaya devam edebilirsin.</p></div></div><div class="bar"><button class="primary" onclick="location.href='https://www.verudanava.com/'">Tekrar bağlan</button><button onclick="render()">Yenile</button></div><label class="pref"><input id="wifi" type="checkbox"><span>Yalnız Wi‑Fi ile indir</span></label><div class="status" id="status"></div><div class="list" id="list"></div></main><script>(function(){var N=window.NavaOffline,L=document.getElementById('list'),S=document.getElementById('status'),W=document.getElementById('wifi');function fmt(n){n=Number(n)||0;if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB'}function esc(v){return String(v==null?'':v).replace(/[&<>\"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}window.render=function(){if(!N){L.innerHTML='<div class="noBridge">Offline köprüsü yüklenemedi. Uygulamayı yeniden aç.</div>';return}try{var x=JSON.parse(N.listDownloads()||'{}'),a=Array.isArray(x.items)?x.items:[];W.checked=x.wifiOnly!==false;S.textContent=a.length+' indirme • '+fmt(x.storageBytes||0);if(!a.length){L.innerHTML='<div class="empty"><strong>İndirilmiş bölüm yok</strong>İnternet varken bölümde indirme simgesine dokun.</div>';return}L.innerHTML=a.map(function(i){return'<article class="card"><div class="copy"><strong>'+esc(i.title||'Bölüm')+'</strong><span>'+esc(i.seriesTitle||'Nava')+' • '+fmt(i.bytes||0)+'</span></div><div class="actions"><button class="open" data-open="'+esc(i.url)+'">Aç</button><button class="del" data-del="'+esc(i.url)+'">Sil</button></div></article>'}).join('')}catch(e){S.textContent='İndirilenler okunamadı.'}};W.onchange=function(){if(N)N.setWifiOnly(W.checked)};L.onclick=function(e){var b=e.target.closest('button');if(!b||!N)return;var u=b.getAttribute('data-open')||b.getAttribute('data-del');if(!u)return;if(b.hasAttribute('data-open'))N.open(u);else{N.delete(u);S.textContent='Siliniyor…'}};window.navaOfflineNativeEvent=function(e){if(e&&e.type==='deleted')render();if(e&&e.type==='error')S.textContent=e.message||'İşlem başarısız.'};render()})();</script></body></html>
