<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>İndirilenler</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b1120;color:#e5e7eb}body{padding:calc(14px + env(safe-area-inset-top)) 10px calc(20px + env(safe-area-inset-bottom))}.app{max-width:720px;margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.head h1{margin:0;font-size:20px;color:#f8fafc}.head p{margin:3px 0 0;color:#8192a5;font-size:11px}.headtools{display:flex;gap:6px}.icon{width:40px;height:40px;border:1px solid #35475d;border-radius:10px;background:#172033;color:#cbd5e1;font-size:18px}.settings{margin-bottom:8px;padding:8px;border:1px solid #2b3a4e;border-radius:10px;background:#101925}.settings[hidden]{display:none}.setting{width:100%;min-height:40px;border:1px solid #2e4055;border-radius:8px;background:#121d2b;color:#dbe7f4;text-align:left;padding:0 10px}.search{width:100%;height:42px;margin-bottom:8px;padding:0 12px;border:1px solid #35475d;border-radius:10px;outline:0;background:#111827;color:#f8fafc}.status{min-height:0;margin:0 2px 8px;color:#9fb0c3;font-size:11px}.status:empty{display:none}.library{display:grid;gap:8px}.series{overflow:visible;border:1px solid #2b3a4e;border-radius:12px;background:#101925}.line{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 40px}.line.volume{border-top:1px solid #26364a}.toggle{min-height:50px;display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:8px;padding:0 8px 0 10px;border:0;background:#172033;color:#f1f5f9;text-align:left}.line.volume .toggle{min-height:46px;background:#121d2b}.toggle strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.toggle small{font-size:9.5px;color:#8092a8}.chev{font-size:20px;color:#8fa8c4}.toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}.more{border:0;border-left:1px solid #26364a;background:#172033;color:#94a3b8;font-size:18px}.line.volume .more{background:#121d2b}.seriesbody[hidden],.volbody[hidden]{display:none}.volbody{display:grid;gap:5px;padding:7px 8px 9px;background:#0e1622}.item{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 40px;min-height:45px;border:1px solid #26364a;border-radius:9px;background:#111827}.open{border:0;background:transparent;color:#f3f6fa;text-align:left;padding:0 10px}.open strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.item .more{background:transparent}.pop{position:absolute;right:5px;top:calc(100% - 4px);z-index:20;min-width:128px;overflow:hidden;border:1px solid #3a4b60;border-radius:9px;background:#162131;box-shadow:0 12px 28px rgba(2,6,23,.36)}.pop button{width:100%;min-height:39px;border:0;background:transparent;color:#f2aaaa;text-align:left;padding:0 11px}.empty{padding:28px 18px;border:1px dashed #334155;border-radius:12px;text-align:center;color:#8ea0b5}.empty strong{display:block;margin-bottom:5px;color:#dce5ef}@media(prefers-reduced-motion:reduce){.chev{transition:none}}
</style></head><body><main class="app"><header class="head"><div><h1>İndirilenler</h1><p>Eser → Cilt → Bölüm</p></div><div class="headtools"><button class="icon" id="settingsBtn" aria-label="Ayarlar">⋯</button><button class="icon" id="refresh" aria-label="Yenile">↻</button></div></header><div class="settings" id="settings" hidden><button class="setting" id="wifi">Yalnız Wi‑Fi</button></div><input class="search" id="search" type="search" autocomplete="off" placeholder="Eser veya bölüm ara"><div class="status" id="status"></div><div class="library" id="library"></div></main><script>
(function(){'use strict';var N=window.NavaOffline,L=document.getElementById('library'),Q=document.getElementById('search'),S=document.getElementById('status'),W=document.getElementById('wifi'),SET=document.getElementById('settings'),all=[],so=Object.create(null),vo=Object.create(null),bulk=null;function clean(v,n){return String(v==null?'':v).replace(/\s+/g,' ').trim().slice(0,n||500)}function key(v){return clean(v).toLocaleLowerCase('tr-TR')}function esc(v){return clean(v).replace(/[&<>\"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function slug(url){try{return clean(decodeURIComponent(new URL(String(url||'')).pathname.split('/').filter(Boolean).pop()||'').replace(/\.html?$/i,'').replace(/[-_]+/g,' '),400)}catch(_){return''}}function junk(v){var x=key(v);return !x||['nava','bölüm','bolum','chapter','cilt','volume','içerik'].indexOf(x)>=0}function no(t,vol){var r=vol?/(?:cilt|volume|vol\.?)\s*([0-9]+(?:\.[0-9]+)?)/i:/(?:bölüm|bolum|chapter|ch\.?|episode|ep\.?)\s*([0-9]+(?:\.[0-9]+)?)/i,m=clean(t,900).match(r);return m?m[1]:''}function strip(v){return clean(v,500).replace(/\s*(?:[-–—|:]\s*)?(?:cilt|volume|vol\.?|bölüm|bolum|chapter|ch\.?|episode|ep\.?)\s*\d+(?:\.\d+)?(?:\s*[-–—|:].*)?$/i,'').trim()}function pretty(v){return clean(v).split(' ').map(function(x){return x?x.charAt(0).toLocaleUpperCase('tr-TR')+x.slice(1):''}).join(' ')}function meta(i){i=i||{};var st=clean(i.seriesTitle),tt=clean(i.title),sl=slug(i.url),mix=[st,tt,sl].join(' '),vn=no(mix,true),cn=no(mix,false),k=String(i.kind||'').toLowerCase(),series='';if(!junk(st))series=strip(st);if(!series||junk(series)){var s=strip(sl);if(s&&!junk(s))series=pretty(s)}if((!series||junk(series))&&!junk(tt))series=strip(tt);if(!series||junk(series))series='Diğer';var volume=vn?'Cilt '+vn:(k==='volume'?'Cilt':'Bölümler'),title=tt;if(junk(title))title=cn?'Bölüm '+cn:(k==='volume'?(vn?'Cilt '+vn:'Cilt'):'Bölüm');return{series:series,volume:volume,title:title,cn:cn}}function groups(items){var sm=new Map();items.forEach(function(i){var m=meta(i);if(!sm.has(m.series))sm.set(m.series,{name:m.series,items:[],vols:new Map()});var s=sm.get(m.series);s.items.push(i);if(!s.vols.has(m.volume))s.vols.set(m.volume,{name:m.volume,items:[]});s.vols.get(m.volume).items.push({i:i,m:m})});return Array.from(sm.values())}function closePop(){document.querySelectorAll('.pop').forEach(function(x){x.remove()})}function pop(btn,label,run){closePop();var p=document.createElement('div');p.className='pop';var b=document.createElement('button');b.textContent=label;b.onclick=function(e){e.stopPropagation();closePop();run()};p.append(b);btn.parentNode.append(p);setTimeout(function(){document.addEventListener('click',closePop,{once:true})},0)}function urls(items){var seen={},out=[];(items||[]).forEach(function(i){var u=clean(i&&i.url,2000);if(u&&!seen[u]){seen[u]=1;out.push(u)}});return out}function bulkDelete(items,label){var u=urls(items);if(!u.length)return;if(!confirm(label+' silinsin mi?'))return;bulk={q:u.slice(),done:0,total:u.length};S.textContent='Siliniyor 0/'+u.length;next()}function next(){if(!bulk)return;if(!bulk.q.length){S.textContent='Silindi.';bulk=null;load();return}N.delete(bulk.q.shift())}function row(x){return'<article class="item"><button class="open" data-open="'+esc(x.i.url)+'"><strong>'+esc(x.m.title)+'</strong></button><button class="more" data-del="'+esc(x.i.url)+'">⋯</button></article>'}function draw(){closePop();var q=key(Q.value),items=all.filter(function(i){if(!q)return true;var m=meta(i);return[m.series,m.volume,m.title].join(' ').toLocaleLowerCase('tr-TR').indexOf(q)>=0});if(!items.length){L.innerHTML='<div class="empty"><strong>'+(all.length?'Sonuç yok':'Henüz indirme yok')+'</strong>'+(all.length?'Aramayı değiştir.':'İndirdiğin eserler burada görünecek.')+'</div>';return}L.innerHTML=groups(items).map(function(s){var sk=key(s.name),os=q||so[sk],vols=Array.from(s.vols.values()).map(function(v){var vk=sk+'|'+key(v.name),ov=q||vo[vk];v.items.sort(function(a,b){var an=Number(a.m.cn)||0,bn=Number(b.m.cn)||0;return an&&bn?an-bn:0});return'<section><div class="line volume"><button class="toggle" data-volume="'+esc(vk)+'" aria-expanded="'+(ov?'true':'false')+'"><span class="chev">›</span><strong>'+esc(v.name)+'</strong><small>'+v.items.length+'</small></button><button class="more" data-volume-delete="'+esc(vk)+'">⋯</button></div><div class="volbody" '+(ov?'':'hidden')+'>'+v.items.map(row).join('')+'</div></section>'}).join('');return'<section class="series"><div class="line"><button class="toggle" data-series="'+esc(sk)+'" aria-expanded="'+(os?'true':'false')+'"><span class="chev">›</span><strong>'+esc(s.name)+'</strong><small>'+s.items.length+'</small></button><button class="more" data-series-delete="'+esc(sk)+'">⋯</button></div><div class="seriesbody" '+(os?'':'hidden')+'>'+vols+'</div></section>'}).join('')}function load(){if(!N){L.innerHTML='<div class="empty"><strong>Açılamadı</strong>Uygulamayı yeniden aç.</div>';return}try{var x=JSON.parse(N.listDownloads()||'{}');all=Array.isArray(x.items)?x.items:[];S.textContent='';draw();renderWifi()}catch(_){S.textContent='İndirilenler okunamadı.'}}function renderWifi(){if(!N)return;W.textContent='Yalnız Wi‑Fi '+(N.getWifiOnly()?'✓':'')}Q.oninput=draw;document.getElementById('refresh').onclick=load;document.getElementById('settingsBtn').onclick=function(){SET.hidden=!SET.hidden;renderWifi()};W.onclick=function(){N.setWifiOnly(!N.getWifiOnly());renderWifi()};L.onclick=function(e){var b=e.target.closest('button');if(!b)return;var k=b.getAttribute('data-series');if(k){so[k]=!so[k];draw();return}k=b.getAttribute('data-volume');if(k){vo[k]=!vo[k];draw();return}var u=b.getAttribute('data-open');if(u){N.open(u);return}u=b.getAttribute('data-del');if(u){pop(b,'Sil',function(){bulkDelete(all.filter(function(i){return i.url===u}),meta(all.find(function(i){return i.url===u})||{}).title)});return}k=b.getAttribute('data-series-delete');if(k){var s=groups(all).find(function(x){return key(x.name)===k});if(s)pop(b,'Eseri sil',function(){bulkDelete(s.items,s.name)});return}k=b.getAttribute('data-volume-delete');if(k){var target=null;groups(all).some(function(s){return Array.from(s.vols.values()).some(function(v){if(key(s.name)+'|'+key(v.name)===k){target={s:s,v:v};return true}return false})});if(target)pop(b,'Cildi sil',function(){bulkDelete(target.v.items.map(function(x){return x.i}),target.s.name+' • '+target.v.name)})}};window.navaOfflineNativeEvent=function(e){if(e&&e.type==='deleted'){if(bulk){bulk.done++;S.textContent='Siliniyor '+bulk.done+'/'+bulk.total;next()}else load()}else if(e&&e.type==='error'){S.textContent=e.message||'İşlem başarısız.';bulk=null}};load()})();
</script></body></html>
