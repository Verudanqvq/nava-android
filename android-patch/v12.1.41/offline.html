<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>İndirilenler</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b1120;color:#e5e7eb}body{padding:calc(16px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom))}.app{max-width:720px;margin:0 auto}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.head h1{margin:0;font-size:21px;color:#f8fafc}.head p{margin:4px 0 0;color:#8fa0b5;font-size:11.5px;line-height:1.45}.refresh{min-height:40px;padding:0 13px;border:1px solid #40536c;border-radius:10px;background:#172033;color:#dce8f7;font-weight:800}.summary{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;margin-bottom:9px;border:1px solid #29364a;border-radius:10px;background:#111827;color:#91a3b7;font-size:11px}.summary strong{color:#e5edf6}.search{width:100%;height:42px;margin-bottom:10px;padding:0 12px;border:1px solid #35475d;border-radius:10px;outline:0;background:#111827;color:#f8fafc;font-size:13px}.search:focus{border-color:#6f8fb8;box-shadow:0 0 0 2px rgba(91,120,166,.16)}.status{margin:0 2px 8px;color:#9fb0c3;font-size:11.5px}.status:empty{display:none}.library{display:grid;gap:9px}.series{overflow:hidden;border:1px solid #2b3a4e;border-radius:12px;background:#101925}.toggle{width:100%;display:flex;align-items:center;gap:9px;text-align:left;border:0;color:#e5edf6}.series>.toggle{padding:12px;background:#172033}.volume>.toggle{padding:10px 11px;background:#121d2b;border-top:1px solid #26364a}.chev{width:20px;height:20px;display:grid;place-items:center;color:#8fa8c4;font-size:21px;transition:transform .15s ease}.toggle[aria-expanded="true"]>.chev{transform:rotate(90deg)}.groupcopy{min-width:0;display:grid;gap:2px}.groupcopy strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f1f5f9;font-size:13px}.series>.toggle .groupcopy strong{font-size:14px}.groupcopy small{color:#8092a8;font-size:10px}.seriesbody[hidden],.volbody[hidden]{display:none!important}.volbody{display:grid;gap:7px;padding:8px 9px 10px;background:#0e1622}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid #26364a;border-radius:10px;background:#111827}.copy{min-width:0;display:grid;gap:3px}.copy strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f3f6fa;font-size:12.5px}.copy span{color:#8192a5;font-size:10px}.actions{display:flex;gap:6px}.actions button{min-height:35px;border-radius:8px;font-weight:800}.open{padding:0 12px;border:1px solid #6f8fb8;background:#466184;color:#fff}.del{padding:0 10px;border:1px solid #4a3940;background:#21181d;color:#efaaaa}.empty,.noBridge{padding:28px 18px;border:1px dashed #334155;border-radius:12px;text-align:center;color:#8ea0b5;font-size:12px;line-height:1.5}.empty strong,.noBridge strong{display:block;margin-bottom:5px;color:#dce5ef;font-size:14px}@media(max-width:480px){.item{grid-template-columns:1fr}.actions{justify-content:flex-end}.open{min-width:86px}}@media(prefers-reduced-motion:reduce){.chev{transition:none}}
</style></head><body><main class="app"><header class="head"><div><h1>İndirilenler</h1><p>Eser, cilt ve bölümlerini çevrimdışı oku.</p></div><button class="refresh" id="refresh" type="button">Yenile</button></header><div class="summary" id="summary"><strong>İndirilen içerikler</strong><span>Hazırlanıyor…</span></div><input class="search" id="search" type="search" autocomplete="off" placeholder="İndirilenlerde ara"><div class="status" id="status"></div><div class="library" id="library"></div></main><script>
(function(){'use strict';var N=window.NavaOffline,L=document.getElementById('library'),S=document.getElementById('status'),Q=document.getElementById('search'),M=document.getElementById('summary'),R=document.getElementById('refresh'),all=[],so=Object.create(null),vo=Object.create(null);function clean(v,n){return String(v==null?'':v).replace(/\s+/g,' ').trim().slice(0,n||500)}function esc(v){return clean(v).replace(/[&<>\"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function fmt(n){n=Number(n)||0;if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(2)+' GB'}function when(ms){try{return ms?new Date(Number(ms)).toLocaleDateString('tr-TR',{day:'numeric',month:'short'}):''}catch(_){return''}}function slug(url){try{return clean(decodeURIComponent(new URL(String(url||'')).pathname.split('/').filter(Boolean).pop()||'').replace(/\.html?$/i,'').replace(/[-_]+/g,' '),400)}catch(_){return''}}function junk(v){var x=clean(v).toLocaleLowerCase('tr-TR');return !x||['nava','bölüm','bolum','chapter','cilt','volume','içerik'].indexOf(x)>=0}function no(t,vol){var r=vol?/(?:cilt|volume|vol\.?)\s*([0-9]+(?:\.[0-9]+)?)/i:/(?:bölüm|bolum|chapter|ch\.?|episode|ep\.?)\s*([0-9]+(?:\.[0-9]+)?)/i,m=clean(t,900).match(r);return m?m[1]:''}function strip(v){return clean(v,500).replace(/\s*(?:[-–—|:]\s*)?(?:cilt|volume|vol\.?|bölüm|bolum|chapter|ch\.?|episode|ep\.?)\s*\d+(?:\.\d+)?(?:\s*[-–—|:].*)?$/i,'').trim()}function pretty(v){return clean(v).split(' ').map(function(x){return x?x.charAt(0).toLocaleUpperCase('tr-TR')+x.slice(1):''}).join(' ')}function meta(i){i=i||{};var st=clean(i.seriesTitle),tt=clean(i.title),sl=slug(i.url),mix=[st,tt,sl].join(' '),vn=no(mix,true),cn=no(mix,false),k=String(i.kind||'').toLowerCase(),series='';if(!junk(st))series=strip(st);if(!series||junk(series)){var s=strip(sl);if(s&&!junk(s))series=pretty(s)}if((!series||junk(series))&&!junk(tt))series=strip(tt);if(!series||junk(series))series='Diğer indirilenler';var volume=vn?'Cilt '+vn:(k==='volume'?'Cilt':'Bölümler'),title=tt;if(junk(title))title=cn?'Bölüm '+cn:(k==='volume'?(vn?'Cilt '+vn+' sayfası':'Cilt sayfası'):'Bölüm');return{series:series,volume:volume,title:title,kind:k,cn:cn}}function groups(items){var sm=new Map();items.forEach(function(i){var m=meta(i);if(!sm.has(m.series))sm.set(m.series,{name:m.series,count:0,bytes:0,vols:new Map()});var s=sm.get(m.series);if(!s.vols.has(m.volume))s.vols.set(m.volume,{name:m.volume,count:0,items:[]});var v=s.vols.get(m.volume);v.items.push({i:i,m:m});v.count++;s.count++;s.bytes+=Number(i.bytes)||0});return Array.from(sm.values())}function key(v){return clean(v).toLocaleLowerCase('tr-TR')}function row(x){var i=x.i,m=x.m,date=when(i.downloadedAt);return'<article class="item"><div class="copy"><strong>'+esc(m.title)+'</strong><span>'+esc([(m.kind==='volume'?'Cilt sayfası':'Bölüm'),date,fmt(i.bytes||0)].filter(Boolean).join(' • '))+'</span></div><div class="actions"><button class="open" data-open="'+esc(i.url)+'">Oku</button><button class="del" data-del="'+esc(i.url)+'">Sil</button></div></article>'}function draw(){var q=clean(Q.value).toLocaleLowerCase('tr-TR'),items=all.filter(function(i){if(!q)return true;var m=meta(i);return[m.series,m.volume,m.title,clean(i.seriesTitle),clean(i.title)].join(' ').toLocaleLowerCase('tr-TR').indexOf(q)>=0});if(!items.length){L.innerHTML='<div class="empty"><strong>'+(all.length?'Sonuç bulunamadı':'Henüz indirme yok')+'</strong>'+(all.length?'Başka bir adla ara.':'Bir cilt veya bölüm indirdiğinde burada görünecek.')+'</div>';return}L.innerHTML=groups(items).map(function(s){var sk=key(s.name),openS=q||so[sk],vols=Array.from(s.vols.values()).map(function(v){var vk=sk+'|'+key(v.name),openV=q||vo[vk];v.items.sort(function(a,b){var an=Number(a.m.cn)||0,bn=Number(b.m.cn)||0;return an&&bn?an-bn:(Number(b.i.downloadedAt)||0)-(Number(a.i.downloadedAt)||0)});return'<section class="volume"><button class="toggle" data-volume="'+esc(vk)+'" aria-expanded="'+(openV?'true':'false')+'"><span class="chev">›</span><span class="groupcopy"><strong>'+esc(v.name)+'</strong><small>'+v.count+' içerik</small></span></button><div class="volbody" '+(openV?'':'hidden')+'>'+v.items.map(row).join('')+'</div></section>'}).join('');return'<section class="series"><button class="toggle" data-series="'+esc(sk)+'" aria-expanded="'+(openS?'true':'false')+'"><span class="chev">›</span><span class="groupcopy"><strong>'+esc(s.name)+'</strong><small>'+s.count+' içerik • '+esc(fmt(s.bytes))+'</small></span></button><div class="seriesbody" '+(openS?'':'hidden')+'>'+vols+'</div></section>'}).join('')}window.renderDownloads=function(){if(!N){M.innerHTML='<strong>İndirilen içerikler</strong><span>—</span>';L.innerHTML='<div class="noBridge"><strong>İndirilenler açılamadı</strong>Uygulamayı kapatıp yeniden aç.</div>';return}try{var x=JSON.parse(N.listDownloads()||'{}');all=Array.isArray(x.items)?x.items:[];M.innerHTML='<strong>İndirilen içerikler</strong><span>'+all.length+' içerik • '+esc(fmt(x.storageBytes||0))+'</span>';S.textContent='';draw()}catch(e){S.textContent='İndirilen içerikler okunamadı.'}};Q.oninput=draw;R.onclick=window.renderDownloads;L.onclick=function(e){var b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-series')){var k=b.getAttribute('data-series');so[k]=!so[k];draw();return}if(b.hasAttribute('data-volume')){var v=b.getAttribute('data-volume');vo[v]=!vo[v];draw();return}if(!N)return;var o=b.getAttribute('data-open'),d=b.getAttribute('data-del');if(o)N.open(o);else if(d){b.disabled=true;S.textContent='Siliniyor…';N.delete(d)}};window.navaOfflineNativeEvent=function(e){if(e&&e.type==='deleted')window.renderDownloads();if(e&&e.type==='error')S.textContent=e.message||'İşlem başarısız.'};window.renderDownloads()})();
</script></body></html>
