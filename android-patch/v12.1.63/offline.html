<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Nava • İndirilenler</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#24344a;background:#f5f7fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f7fa}.head{height:58px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#dce8f8;border-bottom:1px solid #c7d6e9;position:sticky;top:0;z-index:5}.head>div{min-width:0;display:flex;flex:1;flex-direction:column}.head strong{font-size:15px}.head span{font-size:9.5px;color:#6f8198}.online{display:none;border:0;border-radius:9px;background:#fff;color:#456485;min-height:34px;padding:0 10px;font:700 9px system-ui}.online.show{display:block}.search{padding:10px 12px;background:#fff;border-bottom:1px solid #e4e9ef}.search input{width:100%;height:40px;border:1px solid #d5dde7;border-radius:10px;background:#f8fafc;padding:0 12px;font:500 12px system-ui;color:#26384e;outline:none}.tree{padding:10px 10px 28px}.series{border:1px solid #dbe2eb;border-radius:12px;background:#fff;overflow:hidden;margin-bottom:9px}.volume{border-top:1px solid #edf1f5}.group{display:flex;align-items:center;min-height:52px}.group.volume-row{padding-left:18px;background:#fbfcfe}.toggle{min-width:0;flex:1;display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:10px 7px 10px 10px;text-align:left;color:inherit}.toggle>span:last-child{display:flex;min-width:0;flex-direction:column;gap:2px}.toggle strong{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toggle small{font-size:9px;color:#8794a5}.chev{font-size:20px;color:#7b8da3;transition:transform .15s}.toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}.action{border:0;background:transparent;color:#527091;font:700 9px system-ui;min-height:34px;padding:0 8px;margin-right:4px;border-radius:8px}.chapters{padding-left:36px}.chapter{display:flex;align-items:center;border-top:1px solid #f0f3f6;background:#fff}.chapter>button:first-child{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:10px 8px;display:flex;flex-direction:column;gap:2px;color:inherit}.chapter strong{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.delete{width:36px;height:36px;border:0;background:transparent;color:#a06363;font-size:18px}.empty{display:flex;flex-direction:column;gap:5px;padding:48px 18px;text-align:center;color:#78879a}.empty strong{font-size:13px;color:#43536a}.empty span{font-size:10px}@media(prefers-color-scheme:dark){:root,body{background:#0d1520;color:#e5edf7}.head{background:#172538;border-color:#263a52}.head span{color:#90a1b5}.online{background:#24354a;color:#d9e6f5}.search{background:#111c2a;border-color:#223247}.search input{background:#162232;border-color:#2a3b50;color:#edf4fc}.series{background:#111b28;border-color:#273749}.volume{border-color:#213043}.group.volume-row{background:#131e2c}.chapter{background:#111b28;border-color:#1f2d3e}.toggle small{color:#8fa0b5}.empty strong{color:#cfdae7}}
</style></head><body>
<header class="head"><div><strong>İndirilenler</strong><span id="summary"></span></div><button id="online" class="online" type="button">Çevrimiçi dön</button></header><div class="search"><input id="search" type="search" autocomplete="off" placeholder="Eser veya bölüm ara"></div><main id="tree" class="tree"></main>
<script>
(function(){'use strict';var N=window.NavaOffline,tree=document.getElementById('tree'),summary=document.getElementById('summary'),search=document.getElementById('search'),online=document.getElementById('online'),so={},vo={},rel={byUrl:{},byAlias:{}};function c(v,n){return String(v==null?'':v).replace(/\s+/g,' ').trim().slice(0,n||600)}function norm(v){return c(v,600).toLocaleLowerCase('tr-TR').replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}function canon(v){try{var u=new URL(String(v||''),'https://www.verudanava.com/');u.hash='';u.search='';u.protocol='https:';u.hostname='www.verudanava.com';u.port='';return u.href.replace(/\/$/,'')}catch(_){return''}}function slug(v){try{return c(decodeURIComponent(new URL(String(v||''),'https://www.verudanava.com/').pathname.split('/').filter(Boolean).pop()||'').replace(/\.html?$/i,'').replace(/[-_]+/g,' '),400)}catch(_){return''}}function vn(v){var m=c(v,1000).match(/(?:cilt|volume|vol\.?)\s*([0-9]+(?:\.[0-9]+)?)/i);return m?m[1]:''}function cn(v){var m=c(v,1000).match(/(?:bölüm|bolum|chapter|ch\.?|episode|ep\.?)\s*([0-9]+(?:\.[0-9]+)?)/i);return m?m[1]:''}function strip(v){return c(v,700).replace(/\s*(?:[-–—|:]\s*)?(?:cilt|volume|vol\.?)\s*\d+(?:\.\d+)?(?:\s*[-–—|:].*)?$/i,'').trim()}function junk(v){return /^(|nava|icerik|diger|cilt|volume|vol|bolum|chapter|ch|episode|ep)$/.test(norm(v))}try{var rr=N&&N.getSeriesRelations?N.getSeriesRelations():'{}',rj=JSON.parse(rr||'{}');if(rj.byUrl)rel.byUrl=rj.byUrl;if(rj.byAlias)rel.byAlias=rj.byAlias}catch(_){}function meta(i){i=i||{};var st=c(i.seriesTitle,600),tt=c(i.title,500),sl=slug(i.url),mix=[st,tt,sl].join(' '),v=vn(mix),ch=cn(mix),u=canon(i.url),cand=strip(st),series='';if(u&&rel.byUrl[u])series=rel.byUrl[u];if(!series&&cand&&rel.byAlias[norm(cand)])series=rel.byAlias[norm(cand)];var tb=strip(tt),sb=strip(sl);if(!series&&tb&&rel.byAlias[norm(tb)])series=rel.byAlias[norm(tb)];if(!series&&sb&&rel.byAlias[norm(sb)])series=rel.byAlias[norm(sb)];if(!series&&!junk(cand))series=cand;if(!series&&!junk(sb))series=sb.split(' ').map(function(x){return x?x.charAt(0).toLocaleUpperCase('tr-TR')+x.slice(1):''}).join(' ');if(!series)series='Diğer';var kind=String(i.kind||'').toLowerCase(),isVol=kind==='volume'||(!!v&&!ch&&/(?:cilt|volume|vol\.?)\s*\d/i.test([st,tt,sl].join(' ')));return{i:i,u:u,series:series,v:v,ch:ch,kind:kind,isVol:isVol}}function data(){try{var x=JSON.parse(N&&N.listDownloads?N.listDownloads():'{}');return Array.isArray(x.items)?x:{items:[]}}catch(_){return{items:[]}}}function grouped(items){var seen={},rows=[];items.forEach(function(i){var u=canon(i.url);if(!u)return;if(!seen[u]){seen[u]=i;rows.push(u)}else if(c(i.seriesTitle,600).length>c(seen[u].seriesTitle,600).length)seen[u]=i});var sm={};rows.map(function(u){return meta(seen[u])}).forEach(function(r){var sk=norm(r.series),s=sm[sk]||(sm[sk]={name:r.series,items:[],vols:{}});s.items.push(r);var vk=r.v||'0',v=s.vols[vk]||(s.vols[vk]={name:r.v?'Cilt '+r.v:'Diğer',no:r.v,items:[],page:null,chs:[]});v.items.push(r);if(r.isVol){if(!v.page)v.page=r;return}if(r.ch||r.kind==='chapter')v.chs.push(r)});return Object.keys(sm).map(function(k){return sm[k]}).sort(function(a,b){return a.name.localeCompare(b.name,'tr')})}function btn(txt,cls,fn){var b=document.createElement('button');b.type='button';b.className=cls||'';b.textContent=txt;b.onclick=fn;return b}function row(title,sub,open,toggle,actions,cls){var r=document.createElement('div');r.className='group '+(cls||'');var b=btn('','toggle',toggle),ch=document.createElement('span'),cp=document.createElement('span'),st=document.createElement('strong'),sm=document.createElement('small');ch.className='chev';ch.textContent='›';st.textContent=title;sm.textContent=sub;cp.append(st,sm);b.append(ch,cp);b.setAttribute('aria-expanded',open?'true':'false');r.append(b);actions.forEach(function(a){r.append(btn(a.t,'action',a.f))});return r}function open(u){try{N.open(u)}catch(_){}}function del(items,label){if(!confirm(label+' silinsin mi?'))return;var seen={};items.forEach(function(r){var u=canon(r.i.url);if(u&&!seen[u]){seen[u]=1;try{N.delete(r.i.url)}catch(_){}}});setTimeout(render,400)}function render(){var idx=data(),q=norm(search.value),items=idx.items||[];summary.textContent=items.length+' içerik';var fil=q?items.filter(function(i){var r=meta(i);return norm([r.series,i.title,r.v,r.ch,slug(i.url)].join(' ')).indexOf(q)>=0}):items,gs=grouped(fil);tree.replaceChildren();if(!gs.length){var e=document.createElement('div');e.className='empty';e.innerHTML='<strong>'+(items.length?'Sonuç yok':'Henüz indirme yok')+'</strong><span>'+(items.length?'Aramayı değiştir.':'İndirdiğin ciltler burada görünecek.')+'</span>';tree.append(e);return}gs.forEach(function(s){var key=norm(s.name),sec=document.createElement('section'),body=document.createElement('div'),openS=q||!!so[key];sec.className='series';body.hidden=!openS;sec.append(row(s.name,Object.keys(s.vols).length+' cilt',openS,function(){so[key]=!so[key];render()},[{t:'Sil',f:function(){del(s.items,s.name)}}],''));Object.keys(s.vols).sort(function(a,b){return(Number(a)||99999)-(Number(b)||99999)}).forEach(function(k){var v=s.vols[k],vk=key+'|'+k,vsec=document.createElement('section'),vb=document.createElement('div'),openV=q||!!vo[vk],acts=[];vsec.className='volume';vb.className='chapters';vb.hidden=!openV;if(v.page)acts.push({t:'Aç',f:function(){open(v.page.i.url)}});acts.push({t:'Sil',f:function(){del(v.items,s.name+' • '+v.name)}});vsec.append(row(v.name,v.chs.length+' bölüm',openV,function(){vo[vk]=!vo[vk];render()},acts,'volume-row'));v.chs.sort(function(a,b){return(Number(a.ch)||999999)-(Number(b.ch)||999999)}).forEach(function(r){var cr=document.createElement('div');cr.className='chapter';var ob=btn('','',function(){open(r.i.url)}),st=document.createElement('strong');st.textContent=r.i.title||('Bölüm '+r.ch);ob.append(st);cr.append(ob,btn('×','delete',function(){if(confirm('Silinsin mi?')){N.delete(r.i.url);setTimeout(render,300)}}));vb.append(cr)});vsec.append(vb);body.append(vsec)});sec.append(body);tree.append(sec)})}search.oninput=render;online.onclick=function(){location.replace('https://www.verudanava.com/')};function net(){fetch('https://www.verudanava.com/favicon.ico?_nava63='+Date.now(),{cache:'no-store',mode:'no-cors'}).then(function(){online.classList.add('show')}).catch(function(){online.classList.remove('show')})}window.addEventListener('online',net);window.addEventListener('offline',function(){online.classList.remove('show')});render();setInterval(net,5000);setTimeout(net,700)})();
</script></body></html>
