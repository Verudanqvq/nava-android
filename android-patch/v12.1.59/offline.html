<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Nava • Bağlantı yok</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#142033;background:#f4f8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 20%,#fff 0,#f4f8ff 48%,#eaf2ff 100%)}main{width:min(420px,100%);text-align:center}.logo{width:76px;height:76px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;background:#2563eb;color:white;font-weight:900;font-size:30px;box-shadow:0 16px 38px rgba(37,99,235,.22)}h1{font-size:24px;margin:0 0 8px}p{font-size:14px;line-height:1.55;color:#64748b;margin:0 auto 22px;max-width:330px}.actions{display:grid;gap:10px}button{appearance:none;border:0;border-radius:13px;min-height:48px;padding:0 18px;font:800 14px/1 system-ui;background:#2563eb;color:white;box-shadow:0 8px 24px rgba(37,99,235,.20)}button:disabled{opacity:.62}.hint{min-height:20px;margin-top:12px;font-size:12px;color:#64748b}@media(prefers-color-scheme:dark){:root,body{background:#0f172a;color:#eef5ff}body{background:radial-gradient(circle at 50% 20%,#172033 0,#0f172a 58%,#0b1120 100%)}p,.hint{color:#94a3b8}.logo{background:#3b82f6}}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">N</div>
  <h1>Bağlantı yok</h1>
  <p>İnternet bağlantını kontrol et. Bağlantı geri geldiğinde Nava otomatik olarak tekrar deneyecek.</p>
  <div class="actions"><button id="retry" type="button">Tekrar dene</button></div>
  <div class="hint" id="hint">Bağlantı bekleniyor…</div>
</main>
<script>
(function(){
'use strict';
var b=document.getElementById('retry'),h=document.getElementById('hint'),running=false;
function home(){location.replace('https://www.verudanava.com/');}
function retry(){if(running)return;running=true;b.disabled=true;h.textContent='Bağlantı kontrol ediliyor…';try{if(history.length>1){history.back();setTimeout(function(){try{if(location.protocol==='file:')home()}catch(_){home()}},1800)}else home()}catch(_){home()}setTimeout(function(){running=false;b.disabled=false},2200)}
b.addEventListener('click',retry);
window.addEventListener('online',function(){h.textContent='Bağlantı geri geldi. Nava açılıyor…';setTimeout(retry,120)});
window.addEventListener('offline',function(){h.textContent='Bağlantı bekleniyor…'});
if(navigator.onLine)h.textContent='Tekrar deneyebilirsin.';
})();
</script>
</body>
</html>
